    <script>
    // ==========================================
    // 1. KONFIGURACE A KONSTANTY
    // ==========================================
    const DB_URL = "databaze-knihovny.json"; 
    const MEDIA_BASE_URL = "media/";
    const DOCX_BASE_URL = "dokumenty/";

    const urlParams = new URLSearchParams(window.location.search);
    const articleId = urlParams.get('id');

    // ==========================================
    // 2. FUNKCE PRO VZHLED A UI
    // ==========================================
    function fixDocumentFormatting(container) {
        const tables = container.querySelectorAll('table');
        tables.forEach(table => {
            if (!table.parentElement.classList.contains('table-responsive-wrapper')) {
                const wrapper = document.createElement('div');
                wrapper.className = 'table-responsive-wrapper';
                table.parentNode.insertBefore(wrapper, table);
                wrapper.appendChild(table);
            }
        });
    }

    function applyWordAlignment(container) {
        container.querySelectorAll('a[id^="wdalign-"]').forEach(function(anchor) {
            var m = anchor.id.match(/^wdalign-(center|both|right)-/);
            if (!m) return;
            var parent = anchor.parentElement;
            if (!parent) { anchor.remove(); return; }
            if (m[1] === 'center') parent.classList.add('align-center');
            else if (m[1] === 'both')   parent.classList.add('align-justify');
            else if (m[1] === 'right')  parent.classList.add('align-right');
            anchor.remove();
        });
    }

    function populateControlPanel() {
        const container = document.getElementById('dynamicButtonsContainer');
        if (!container) return;
        container.innerHTML = `
            <div style="display:flex; flex-direction:column; gap:4px; margin-bottom:10px; border-bottom:1px solid var(--border-subtle); padding-bottom:10px;">
                <span style="font-size:0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase;">Vzhled</span>
                <button class="btn" onclick="window.setTheme('light')" style="text-align:left;">☀️ Světlý</button>
                <button class="btn" onclick="window.setTheme('dark')" style="text-align:left;">🌙 Tmavý</button>
                <button class="btn" onclick="window.setTheme('auto')" style="text-align:left;">🌓 Automatický</button>
            </div>
            <div style="display:flex; flex-direction:column; gap:4px; margin-bottom:10px; border-bottom:1px solid var(--border-subtle); padding-bottom:10px;">
                <span style="font-size:0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase;">Písmo ke čtení</span>
                <select id="fontSelect" class="sort-select" style="width:100%; padding:8px; font-size:0.9rem;" onchange="window.changeReaderFont(this.value)">
                    <option value="system-ui, -apple-system, sans-serif">Výchozí Systémové</option>
                    <option value="'Inter', sans-serif">Inter (Moderní)</option>
                    <option value="'Roboto', sans-serif">Roboto (Google)</option>
                    <option value="'Open Sans', sans-serif">Open Sans (Čisté)</option>
                    <option value="'Montserrat', sans-serif">Montserrat (Geometrické)</option>
                    <option value="'Ubuntu', sans-serif">Ubuntu (Kulaté)</option>
                    <option value="'Lora', serif">Lora (Knižní Patkové)</option>
                    <option value="'Merriweather', serif">Merriweather (Novinové)</option>
                    <option value="'Playfair Display', serif">Playfair (Elegantní)</option>
                </select>
            </div>
            <button class="btn" onclick="window.copyArticleLink()" style="text-align:left;">📋 Sdílet článek</button>
            <button class="btn" onclick="window.print()" style="text-align:left;">🖨️ Vytisknout článek</button>
        `;

        const savedFont = localStorage.getItem('jmhz_article_font');
        if (savedFont) {
            document.getElementById('fontSelect').value = savedFont;
            window.changeReaderFont(savedFont);
        }
    }

    // ==========================================
    // 3. PARSOVÁNÍ OBSAHU A SHORTCODŮ
    // ==========================================
    function replaceMediaTags(html) {
        let parsed = html;
        
        parsed = parsed.replace(/(?:<a[^>]*>)?\[VIDEO:\s*(.+?)\](?:<\/a>)?/gi, (match, content) => {
            let rawSrc = content.replace(/<[^>]+>/g, '').trim();
            let fullSrc = rawSrc;
            if (!fullSrc.startsWith('http://') && !fullSrc.startsWith('https://')) {
                if (!fullSrc.startsWith('/')) fullSrc = MEDIA_BASE_URL + fullSrc;
                else fullSrc = MEDIA_BASE_URL.replace(/\/$/, '') + fullSrc;
            }
            let baseSrc = fullSrc.replace(/\.mp4$/i, '');
            return `
            <div class="media-wrapper kb-video-container" data-base-src="${baseSrc}" data-original-src="${fullSrc}">
                <video controls preload="metadata" playsinline style="width:100%; border-radius:8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); background:#000;">
                    <source src="${fullSrc}" type="video/mp4">
                    Váš prohlížeč nepodporuje přehrávání videa.
                </video>
            </div>`;
        });
        
        parsed = parsed.replace(/(?:<a[^>]*>)?\[AUDIO:\s*(.+?)\](?:<\/a>)?/gi, (match, content) => {
            let src = content.replace(/<[^>]+>/g, '').trim();
            if (!src.startsWith('http://') && !src.startsWith('https://')) {
                 if (!src.startsWith('/')) src = MEDIA_BASE_URL + src;
                 else src = MEDIA_BASE_URL.replace(/\/$/, '') + src;
            }
            return `<div class="media-wrapper"><audio controls style="width:100%;"><source src="${src}" type="audio/mpeg">Audio</audio></div>`;
        });
        
        parsed = parsed.replace(/(?:<a[^>]*>)?\[OBRAZEK:\s*(.+?)\](?:<\/a>)?/gi, (match, content) => {
            let src = content.replace(/<[^>]+>/g, '').trim();
            if (!src.startsWith('http://') && !src.startsWith('https://')) {
                 if (!src.startsWith('/')) src = MEDIA_BASE_URL + src;
                 else src = MEDIA_BASE_URL.replace(/\/$/, '') + src;
            }
            return `<div class="media-wrapper"><img src="${src}" style="max-width:100%; border-radius:8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);"></div>`;
        });

        parsed = parsed.replace(/(?:<a[^>]*>)?\[PRILOHA:\s*([^|\]]+)(?:\|([^\]]+))?\](?:<\/a>)?/gi, (match, url, label) => {
            let src = url.replace(/<[^>]+>/g, '').trim();
            let btnLabel = label ? label.replace(/<[^>]+>/g, '').trim() : "Stáhnout přílohu";
            if (!src.startsWith('http://') && !src.startsWith('https://')) {
                 if (!src.startsWith('/')) src = DOCX_BASE_URL + src;
                 else src = DOCX_BASE_URL.replace(/\/$/, '') + src;
            }
            return `<div style="margin: 20px 0;"><a href="${src}" target="_blank" class="btn primary" style="display:inline-flex; align-items:center; gap:8px; text-decoration:none;"><span style="font-size:1.2rem;">📎</span> ${btnLabel}</a></div>`;
        });

        parsed = parsed.replace(/(?:<a[^>]*>)?\[FAQ:\s*([^|\]]+)\|([^\]]+)\](?:<\/a>)?/gi, (match, question, answer) => {
            let q = question.replace(/<[^>]+>/g, '').trim();
            let a = answer.replace(/<[^>]+>/g, '').trim();
            return `<div class="faq-box"><div class="faq-question" onclick="window.toggleFaq(this)"><span>${q}</span><span class="faq-icon">▼</span></div><div class="faq-answer">${a}</div></div>`;
        });

        parsed = parsed.replace(/(?:<a[^>]*>)?\[KVIZ:\s*(.+?)\](?:<\/a>)?/gi, (match, content) => {
            let parts = content.split('|').map(p => p.trim().replace(/<[^>]+>/g, ''));
            let question = parts.shift(); 
            let quizId = 'quiz_' + Math.random().toString(36).substr(2, 9);
            let htmlOut = `<div class="lms-quiz-box" style="background:var(--bg-surface); border:1px solid var(--border-strong); border-radius:8px; padding:20px; margin:30px 0;"><h4 style="margin:0 0 15px 0; color:var(--text-primary); display:flex; align-items:center; gap:8px;"><span style="font-size:1.5rem;">🤔</span> ${question}</h4><div class="lms-quiz-options" style="display:flex; flex-direction:column; gap:10px;">`;
            parts.forEach((ans) => {
                let isCorrect = ans.endsWith('*');
                let cleanAns = isCorrect ? ans.slice(0, -1).trim() : ans;
                htmlOut += `<button class="btn" onclick="window.checkArticleQuiz(this, ${isCorrect}, '${quizId}')" style="text-align:left; justify-content:flex-start; font-size:1rem; padding:12px; border:1px solid var(--border); background:var(--bg-elevated); transition:0.2s;">${cleanAns}</button>`;
            });
            htmlOut += `</div><div id="${quizId}_feedback" style="margin-top:15px; font-weight:600; font-size:0.95rem; display:none; padding:10px; border-radius:6px;"></div></div>`;
            return htmlOut;
        });

        return parsed;
    }

    // ==========================================
    // 4. GENERACE OBSAHU A SCROLLSPY
    // ==========================================
    function generateTOC() {
        const headings = document.getElementById('articleContent').querySelectorAll('h1, h2');
        let tocHtml = '';
        headings.forEach((h, index) => {
            const id = `sec-${index}`;
            h.id = id;
            const level = h.tagName.toLowerCase().replace('h', '');
            const extraClass = level === '1' ? ' toc-level-1' : ' toc-level-2';
            tocHtml += `<a href="#${id}" class="toc-link${extraClass}" data-target="${id}">${h.textContent}</a>`;
        });

        const mobileBtn = document.getElementById('mobileTocBtn');
        const pcBtn = document.getElementById('pcTocExpandBtn');
        const mobileList = document.getElementById('mobileTocList');

        if (headings.length > 0) {
            document.getElementById('tocList').innerHTML = tocHtml;
            if (mobileList) mobileList.innerHTML = tocHtml; 
            initEnterpriseScrollSpy(headings);
            initMobileTOC(); 
        } else {
            document.querySelector('.toc-aside').style.display = 'none';
            if (mobileBtn) mobileBtn.style.display = 'none';
            if (pcBtn) pcBtn.style.display = 'none';
        }
    }

    function initMobileTOC() {
        const mobileBtn = document.getElementById('mobileTocBtn');
        const pcBtn = document.getElementById('pcTocExpandBtn'); 
        const modal = document.getElementById('mobileTocModal');
        const closeBtn = document.getElementById('mobileTocClose');
        const searchInput = document.getElementById('mobileTocSearchInput');
        const listContainer = document.getElementById('mobileTocList');

        // Společná fce pro otevření okna (ať už z mobilu nebo z PC)
        const openModal = () => {
            modal.classList.add('open');
            document.body.style.overflow = 'hidden'; 
            if(searchInput) { 
                searchInput.value = ''; 
                searchInput.dispatchEvent(new Event('input')); 
                // Počkáme na dokončení animace a aktivujeme kurzor do pole vyhledávání
                setTimeout(() => searchInput.focus(), 300);
            }
        };

        // Napojení na obě tlačítka
        if (mobileBtn) mobileBtn.addEventListener('click', openModal);
        if (pcBtn) pcBtn.addEventListener('click', openModal);

        const closeModal = () => {
            modal.classList.remove('open');
            document.body.style.overflow = '';
        };
        if (closeBtn) closeBtn.addEventListener('click', closeModal);

        if (listContainer) listContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('toc-link')) closeModal();
        });

        if (searchInput && listContainer) {
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); 
                const links = listContainer.querySelectorAll('.toc-link');
                
                links.forEach(link => {
                    const text = link.textContent.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    if (text.includes(term)) {
                        link.style.display = 'block';
                    } else {
                        link.style.display = 'none';
                    }
                });
            });
        }
    }

    function initEnterpriseScrollSpy(headings) {
        const tocLinks = document.querySelectorAll('.toc-aside .toc-link'); 
        const tocList = document.getElementById('tocList'); // Správný rolovatelný kontejner panelu
        const observerOptions = { root: null, rootMargin: '-80px 0px -60% 0px', threshold: 0 };
        
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    tocLinks.forEach(link => {
                        const isActive = link.getAttribute('data-target') === entry.target.id;
                        link.classList.toggle('active', isActive);
                        
                        // CHYTRÉ POSOUVÁNÍ PANELU
                        if (isActive && tocList) {
                            const linkTop = link.offsetTop;
                            const linkBottom = linkTop + link.offsetHeight;
                            const listScrollTop = tocList.scrollTop;
                            const listHeight = tocList.clientHeight;

                            if (linkTop < listScrollTop) {
                                tocList.scrollTo({ top: linkTop - 20, behavior: 'smooth' });
                            } else if (linkBottom > listScrollTop + listHeight) {
                                tocList.scrollTo({ top: linkBottom - listHeight + 20, behavior: 'smooth' });
                            }
                        }
                    });
                }
            });
        }, observerOptions);
        headings.forEach(h => observer.observe(h));
    }

    window.calculateArticleTime = function(container) {
        const indicator = document.getElementById('articleTimeIndicator');
        if (!indicator) return;

        const text = container.textContent || "";
        const words = text.trim().split(/\s+/).length;
        let totalSeconds = Math.ceil(words / 200) * 60; 

        const mediaElements = container.querySelectorAll('video, audio');
        let loadedCount = 0;

        const updateUI = () => {
            const mins = Math.ceil(totalSeconds / 60);
            let minText = 'minut';
            if (mins === 1) minText = 'minuta';
            else if (mins >= 2 && mins <= 4) minText = 'minuty';
            
            indicator.innerHTML = `⏱️ Odhadovaný čas na přečtení článku: <span style="color:var(--accent); font-weight:700;">${mins} ${minText}</span>`;
            const metaBox = document.getElementById('articleMeta');
            if (metaBox) {
                const datePart = metaBox.innerHTML.split('<br>')[0];
                metaBox.innerHTML = `${datePart}<br>Vypočtený odhad: <strong>${mins} min</strong>`;
            }
        };

        if (mediaElements.length === 0) {
            updateUI();
            return;
        }

        indicator.innerHTML = `⏱️ Vyhodnocuji délku přiložených médií...`;
        mediaElements.forEach(media => {
            if (media.readyState >= 1) { 
                totalSeconds += media.duration;
                loadedCount++;
                if (loadedCount === mediaElements.length) updateUI();
            } else {
                media.addEventListener('loadedmetadata', () => {
                    totalSeconds += media.duration;
                    loadedCount++;
                    if (loadedCount === mediaElements.length) updateUI();
                });
                setTimeout(() => {
                    if (loadedCount < mediaElements.length) {
                        loadedCount++;
                        if (media.readyState === 0) totalSeconds += 180; 
                        if (loadedCount === mediaElements.length) updateUI();
                    }
                }, 1500);
            }
        });
    };

    // ==========================================
    // 5. INTERAKTIVNÍ PRVKY
    // ==========================================
    window.changeReaderFont = function(fontFamily) {
        document.getElementById('articleContent').style.fontFamily = fontFamily;
        localStorage.setItem('jmhz_article_font', fontFamily);
    };

    window.copyArticleLink = function() {
        navigator.clipboard.writeText(window.location.href).then(() => {
            if(window.KB_Toaster) KB_Toaster.show('Zkopírováno', 'Odkaz na článek byl zkopírován do schránky.', 'success');
            else alert('Zkopírováno: Odkaz na článek byl zkopírován do schránky.');
        });
    };

    window.toggleFaq = function(element) { element.parentElement.classList.toggle('open'); };

    window.openLightbox = function(src) {
        document.getElementById('kbLightboxImg').src = src;
        document.getElementById('kbLightbox').classList.add('active');
    };
    
    window.closeLightbox = function() {
        document.getElementById('kbLightbox').classList.remove('active');
        setTimeout(() => { document.getElementById('kbLightboxImg').src = ''; }, 300);
    };

    window.checkArticleQuiz = function(btn, isCorrect, quizId) {
        const parent = btn.parentElement;
        const feedback = document.getElementById(quizId + '_feedback');
        
        if (isCorrect) {
            Array.from(parent.children).forEach(b => {
                b.disabled = true; b.style.opacity = '0.5'; b.style.cursor = 'not-allowed';
            });
            btn.style.opacity = '1'; btn.style.color = '#fff';
            btn.style.background = 'var(--success)'; btn.style.borderColor = 'var(--success)';
            feedback.innerHTML = '✅ Správně!';
            feedback.style.background = 'var(--success-bg)'; feedback.style.color = 'var(--success)';
        } else {
            btn.disabled = true; 
            btn.style.opacity = '0.7'; 
            btn.style.cursor = 'not-allowed';
            btn.style.color = '#fff';
            btn.style.background = 'var(--error)'; btn.style.borderColor = 'var(--error)';
            feedback.innerHTML = '❌ Nesprávně. Zkuste kliknout na jinou možnost.';
            feedback.style.background = 'var(--error-bg)'; feedback.style.color = 'var(--error)';
        }
        feedback.style.display = 'block';
    };

    // ==========================================
    // 6. HLAVNÍ FUNKCE (NAČTENÍ ČLÁNKU)
    // ==========================================
    async function loadArticle() {
        if (!articleId) return location.href = 'index.html';
        try {
            const res = await fetch(DB_URL + "?t=" + Date.now());
            if (!res.ok) throw new Error("Nelze načíst databázi aplikace JMHZ KNIHOVNA");
            const db = await res.json();
            
            const allItems = [...(db.articles || []), ...(db.lms || [])];
            const article = allItems.find(a => a.id === articleId);
            
            if (!article || !article.docxFile) throw new Error("Článek nenalezen.");

            document.title = `${article.title} - SALARY Knihovna Znalostí`;
            document.getElementById('articleTitle').textContent = article.title;
            if (window.trackRecentVisit) window.trackRecentVisit(article.title, location.href, '📄');
            
            const dateObj = new Date(article.lastUpdated);
            document.getElementById('articleMeta').innerHTML = `Aktualizace: <strong>${dateObj.toLocaleDateString('cs-CZ')}</strong><br>Původní odhad: <strong>${article.readingTimeMin || 1} min</strong>`;
            document.getElementById('articleTags').innerHTML = (article.tags || []).map(t => `<span class="tag-pill">${t}</span>`).join('');

            populateControlPanel();

            const docxUrl = DOCX_BASE_URL + encodeURIComponent(article.docxFile);
            const docRes = await fetch(docxUrl);
            if (!docRes.ok) throw new Error(`Dokument "${article.docxFile}" nenalezen.`);
            
            const arrayBuffer = await docRes.arrayBuffer();

            const mammothOptions = {
                ignoreEmptyParagraphs: false,
                styleMap: [
                    "u => u",
                    "strike => s"
                ],
                transformDocument: (function() {
                    var _n = 0;
                    return mammoth.transforms.paragraph(function(p) {
                        if (!p.alignment || p.alignment === 'left') return p;
                        var name = 'wdalign-' + p.alignment + '-' + (_n++);
                        return Object.assign({}, p, { children: [{ type: 'bookmarkStart', name: name, id: name }].concat(p.children) });
                    });
                }())
            };
            
            const result = await mammoth.convertToHtml({ arrayBuffer: arrayBuffer }, mammothOptions);
            let rawHtml = replaceMediaTags(result.value);

            const contentContainer = document.getElementById('articleContent');
            contentContainer.innerHTML = rawHtml;
            
            fixDocumentFormatting(contentContainer);
            applyWordAlignment(contentContainer);

            contentContainer.querySelectorAll('a').forEach(link => {
                if (link.href && link.href.startsWith('http')) {
                    link.setAttribute('target', '_blank');
                    link.setAttribute('rel', 'noopener noreferrer');
                }
            });
            contentContainer.querySelectorAll('img').forEach(img => {
                img.addEventListener('click', () => window.openLightbox(img.src));
            });

            document.getElementById('loader').style.display = 'none';
            document.getElementById('layoutContainer').style.display = 'grid';

            generateTOC();
            if (window.calculateArticleTime) window.calculateArticleTime(contentContainer);
            if (window.KB_VideoManager) window.KB_VideoManager.init();

        } catch (e) { 
            document.getElementById('loader').innerHTML = `<h2 style="color:var(--error)">Chyba</h2><p>${e.message}</p><br><a href="index.html" class="btn">Zpět</a>`; 
        }
    }

    // ==================================================================
    // 7. EVENT LISTENERY 
    // ==============================================================
    document.addEventListener('DOMContentLoaded', loadArticle);

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch((err) =>
                console.warn('Service Worker se nepodařilo zaregistrovat:', err)
            );
        });
    }

    window.addEventListener('scroll', () => {
        const winScroll = window.scrollY || document.documentElement.scrollTop;
        const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
        
        const pb = document.getElementById('progressBar');
        if (pb) pb.style.width = scrolled + "%";

        const btnTop = document.getElementById('backToTop');
        if (btnTop) btnTop.classList.toggle('visible', window.scrollY > 400);
    }, { passive: true });
    </script>
	
	
    <button id="backToTop" class="back-to-top" aria-label="Zpět nahoru" title="Zpět na začátek stránky" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
      // ================================================================================================
	  // SALARY Site Analytics Script (Obohacená včerejší verze)
	  // ================================================================================================

    async function sendAnonymousHit() {
        // --- DOPLNĚNO: GENERACE A ULOŽENÍ UNIKÁTNÍHO ID NÁVŠTĚVNÍKA ---
        function generateId() {
            return Math.random().toString(36).substring(2) + Date.now().toString(36);
        }

        let visitorId = localStorage.getItem('salary_visitor_id');
        if (!visitorId) {
            visitorId = 'USR_' + generateId();
            localStorage.setItem('salary_visitor_id', visitorId);
        }
        // --------------------------------------------------------------

        // 1. Detekce typu zařízení 
        let deviceType = "Počítač";
        if (/Mobi|Android|iPhone/i.test(navigator.userAgent)) {
            deviceType = "Mobil";
        } else if (/Tablet|iPad/i.test(navigator.userAgent)) {
            deviceType = "Tablet";
        }

        // 2. Základní data z prohlížeče
        let pagePath = window.location.pathname;
        let fullUrl = window.location.href;
        let pageTitle = document.title || "Bez nadpisu";
        let referrer = document.referrer || "Přímá návštěva";
        let country = "Neznámá";
        let city = "Neznámé";

        // 3. ROBUSTNÍ zjištění lokality (Primární API + Záložní API)
        try {
            // Pokus 1: Služba ipapi.co
            let geoResponse = await fetch('https://ipapi.co/json/');
            if (geoResponse.ok) {
                let geoData = await geoResponse.json();
                country = geoData.country_name || "Neznámá";
                city = geoData.city || "Neznámé";
            } else {
                throw new Error("Primární API přetíženo (Status: " + geoResponse.status + ")");
            }
        } catch (e) {
            console.log("Primární Geo IP selhala, zkouším záložní...", e.message);
            try {
                // Pokus 2: Záložní služba ipwho.is
                let backupResponse = await fetch('https://ipwho.is/');
                if (backupResponse.ok) {
                    let backupData = await backupResponse.json();
                    if(backupData.success) {
                        country = backupData.country || "Neznámá";
                        city = backupData.city || "Neznámé";
                    }
                }
            } catch (backupError) {
                console.log("I záložní Geo IP služba je blokována (pravděpodobně AdBlock).");
            }
        }

        // 4. Sestavení URL adresy (Doplněn parametr &vid= na konec)
        const googleAppScriptUrl = "https://script.google.com/macros/s/AKfycby-ATpAR9X3OhgpDNn0Ov9a_z9RyWFEN0X0M5SN631Sc4aoceiRV6Hm6x0NfozTVLaIIg/exec";
        
        const trackingUrl = `${googleAppScriptUrl}?page=${encodeURIComponent(pagePath)}&title=${encodeURIComponent(pageTitle)}&fullurl=${encodeURIComponent(fullUrl)}&referrer=${encodeURIComponent(referrer)}&country=${encodeURIComponent(country)}&city=${encodeURIComponent(city)}&device=${encodeURIComponent(deviceType)}&vid=${encodeURIComponent(visitorId)}`;

        // 5. Tiché odeslání dat na pozadí
        if (navigator.sendBeacon) {
            navigator.sendBeacon(trackingUrl);
        } else {
            fetch(trackingUrl, { mode: 'no-cors' });
        }
    }

    // Spustit měření po načtení stránky
    if (document.readyState === 'complete') {
        sendAnonymousHit();
    } else {
        window.addEventListener('load', sendAnonymousHit);
    }
</script>
