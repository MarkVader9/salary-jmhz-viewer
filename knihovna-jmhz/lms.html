<!DOCTYPE html>
<html lang="cs" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.ckeditor.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.ckeditor.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.ckeditor.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' data: blob: https:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'">
    <title>Interaktivní Kurz - SALARY s.r.o. KNIHOVNA JMHZ</title>
    <meta name="description" content="Interaktivní vzdělávací kurzy SALARY k legislativě a metodikám JMHZ.">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="../icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../icon.svg">
    <link rel="manifest" href="app.webmanifest">
    <meta property="og:image" content="../icon.svg">
    <meta property="og:locale" content="cs_CZ">
    <meta name="twitter:card" content="summary">
    <meta property="og:title" content="Interaktivní Kurz - SALARY s.r.o. KNIHOVNA JMHZ">
    <meta property="og:description" content="Znalostní Knihovna Legislativy JMHZ a Interaktivní Vzdělávací Kurzy SALARY s.r.o.">
    <meta property="og:type" content="website">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
        
        
        <script src="kb-core.js"></script>
    <script src="library-menu.js"></script>
    <script src="library-ui.js"></script>
    <script src="kb-video.js"></script> 
        <link rel="stylesheet" href="library-style.css?v=3">

</head>

<body>

    <div id="loader" style="text-align: center; padding: 100px; color: var(--text-muted);">
        <h2 id="loaderText">Připravuji interaktivní kurz...</h2>
        <p style="font-size: 0.9rem;">Probíhá generování kapitol a načítání uloženého postupu.</p>
    </div>

    <div class="lms-layout" id="layoutContainer" style="display: none;">
        
        <aside class="lms-sidebar">
            <div class="lms-sidebar-header">
                <h3 style="margin:0 0 15px 0; font-size:1.1rem;" id="courseTitleSidebar">Název kurzu</h3>
                <span class="lms-progress-text" id="progressText">Dokončeno 0 %</span>
                <div class="lms-progress-track"><div class="lms-progress-fill" id="progressBar"></div></div>
            </div>
            <div class="lms-lesson-list" id="lessonList"></div>
        </aside>

        <main class="lms-content-area">
            <div class="lms-lesson-header-wrap">
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <h1 class="lms-lesson-title" id="lessonTitle">Lekce</h1>
                    <div id="lmsTimeIndicator" style="font-size: 0.9rem; color: var(--text-muted); font-weight: 600;">
                        </div>
                </div>
                <button class="btn" onclick="copyCourseLink()" title="Zkopírovat odkaz na tento kurz" style="white-space:nowrap;">📋 Sdílet kurz</button>
            </div>
            
            <div class="lms-body editor-content" id="lessonContent"></div>
            
            <div class="lms-nav-footer">
                <button class="btn" id="btnPrev" style="visibility:hidden;">← Předchozí lekce</button>
                <button class="btn primary" id="btnNext" style="padding:12px 24px; font-size:1rem; border-radius:30px;">Završit lekci a pokračovat →</button>
            </div>
            <div class="lms-keyboard-hint">Tip: K navigaci mezi lekcemi můžete používat šipky na klávesnici (← a →)</div>
        </main>

        <aside class="right-sidebar">
            <div class="info-box" id="externalControlPanel">
                <span class="sidebar-label">Nastavení kurzu</span>
                <div id="dynamicButtonsContainer" style="display:flex; flex-direction:column; gap:8px;"></div>
            </div>
            <div class="info-box">
                <span class="sidebar-label">Štítky a Info</span>
                <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 15px;" id="articleMeta"></div>
                <div id="articleTags"></div>
            </div>
        </aside>
    </div>

<script>
    // =========================================================
    // KONFIGURACE LMS
    // =========================================================
    const CONFIG = {
        PANELS_POSITION: 'bottom-left'
    };

    const DB_URL = "databaze-knihovny.json"; 
    const MEDIA_BASE_URL = "media/";
    const DOCX_BASE_URL = "dokumenty/";

    const urlParams = new URLSearchParams(window.location.search);
    const courseId = urlParams.get('course');
    
    let courseData = null;
    let lessons = [];
    let currentLessonIndex = 0;
    let completedLessons = [];

    async function initLms() {
        if (!courseId) return location.href = 'index.html';
        try {
            const res = await fetch(DB_URL + "?t=" + Date.now());
            const db = await res.json();
            
            courseData = (db.lms || []).find(c => c.id === courseId);
            if (!courseData) throw new Error("Tento kurz nebyl nalezen.");

            document.title = `${courseData.title} - SALARY LMS`;
            document.getElementById('courseTitleSidebar').textContent = courseData.title;

            const savedProgress = localStorage.getItem(`jmhz_lms_progress_${courseId}`);
            if (savedProgress) completedLessons = JSON.parse(savedProgress);

            const docxUrl = DOCX_BASE_URL + encodeURIComponent(courseData.docxFile);
            const docRes = await fetch(docxUrl);
            if (!docRes.ok) throw new Error(`Zdrojový soubor kurzu chybí na serveru.`);
            
            const arrayBuffer = await docRes.arrayBuffer();
            const mammothOptions = { ignoreEmptyParagraphs: false };
            const result = await mammoth.convertToHtml({ arrayBuffer: arrayBuffer }, mammothOptions);
            
            parseHtmlToLessons(result.value);

            applyPanelsPosition();

            document.getElementById('loader').style.display = 'none';
            document.getElementById('layoutContainer').style.display = 'grid';

            populateControlPanel();

            let startIdx = 0;
            while(completedLessons.includes(startIdx) && startIdx < lessons.length - 1) {
                startIdx++;
            }
            renderSidebar();
            openLesson(startIdx);

        } catch (e) { 
            document.getElementById('loader').innerHTML = `<h2 style="color:var(--error)">Tento Kurz Se Nyní Připravuje</h2><p>${e.message}</p><br><a href="index.html" class="btn">Zpět</a>`; 
        }
    }

    function populateControlPanel() {
        const container = document.getElementById('dynamicButtonsContainer');
        
        container.innerHTML = `
            <div style="display:flex; flex-direction:column; gap:4px; margin-bottom:10px; border-bottom:1px solid var(--border-subtle); padding-bottom:10px;">
                <span style="font-size:0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase;">Vzhled</span>
                <button class="btn" onclick="setTheme('light')" style="text-align:left;">☀️ Světlý</button>
                <button class="btn" onclick="setTheme('dark')" style="text-align:left;">🌙 Tmavý</button>
                <button class="btn" onclick="setTheme('auto')" style="text-align:left;">🌓 Automatický</button>
            </div>

            <div class="info-icon-container">
                <button class="btn" onclick="exportProgress()" style="text-align:left; flex:1;">💾 Přenést Na Jiný PC</button>
                
                <div class="info-bubble-wrap" id="infoBubbleWrap" onclick="toggleInfoBubble(event)">
                    <div class="info-bubble-icon">i</div>
                    <div class="info-content">
                        <div class="info-content-inner" onclick="event.stopPropagation()">
                            <h3>
                                Nápověda k přenosu postupu
                                <button class="info-content-close" onclick="toggleInfoBubble(event)" title="Zavřít">&times;</button>
                            </h3>
                            <div style="font-size: 0.95rem; line-height: 1.6;">
                                <strong>Jak přenést průběh postupu Vašeho studia tohoto Interaktivního kurzu na jiné zařízení (PC / Mobil / Tablet):</strong><br><br>
                                1. Kliknutím na toto tlačítko "Přenést Na Jiný PC" zde v levostranném menu Vašeho kurzu se Váš kód automaticky <strong>zkopíruje do schránky</strong> (do mezipaměti počítače).<br><br>
                                2. Přejděte tam, kam si kód chcete uložit (např. do e-mailu a uložte jako rozepsaný E-mail který můžete zobrazit také na onom jiném zařízení (např. skrze aplikaci Gmail), a nebo do poznámek v tomto počítači a přenést v .TXT souboru poznámek skrze USB Flashku, ... atd.).<br><br>
                                3. Na jiném zařzení (PC / Mobil / Tablet) si tento kód opět zkopírujte z Vámi zvoleného přenosného zdroje (E-mail / Poznámky). Otevřete si webovou stránku tohoto konkrétního Interaktivního kurzu, a vložte Vámi zkopírovaný kód do pole po kliknutí na tlačítko <strong>Obnovit Postup z Kódu</strong>. Potvrďte klikem na  <strong>OK</strong>, a máte přenos dokončen. Díky této chytré funkci máte takto možnost navázat na Váš stávající průběh studia v tomto konkrétním kurzu přesně tam, kde jste naposledy skončili na předešlém zařízení..
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <button class="btn" onclick="importProgress()" style="text-align:left;">📂 Obnovit Postup z Kódu</button>
        `;

        const dateObj = new Date(courseData.lastUpdated);
        document.getElementById('articleMeta').innerHTML = `Aktualizace: <strong>${dateObj.toLocaleDateString('cs-CZ')}</strong><br>Délka kurzu: <strong>${courseData.readingTimeMin || 1} min</strong>`;
        document.getElementById('articleTags').innerHTML = (courseData.tags || []).map(t => `<span class="tag-pill">${t}</span>`).join('');
    }
        
        // Funkce pro otevření/zavření infohlášky
    window.toggleInfoBubble = function(e) {
        e.stopPropagation(); // Zabrání tomu, aby se kliknutí propsalo hned do dokumentu a okamžitě okno zavřelo
        const wrap = document.getElementById('infoBubbleWrap');
        if (wrap) wrap.classList.toggle('active');
    };

    // Pokud uživatel klikne kamkoliv jinam na stránku, infohláška se zavře
    document.addEventListener('click', function(e) {
        const wrap = document.getElementById('infoBubbleWrap');
        // Pokud je infohláška otevřená a uživatel klikl MIMO ni, tak ji zavřeme
        if (wrap && wrap.classList.contains('active') && !e.target.closest('#infoBubbleWrap')) {
            wrap.classList.remove('active');
        }
    });

    function applyPanelsPosition() {
        const layout = document.getElementById('layoutContainer');
        layout.setAttribute('data-panel-pos', CONFIG.PANELS_POSITION);

        if (CONFIG.PANELS_POSITION === 'bottom-left') {
            const leftSidebar = document.querySelector('.lms-sidebar');
            const rightSidebar = document.querySelector('.right-sidebar');
            
            let panelsWrap = document.getElementById('leftPanelsWrap');
            if (!panelsWrap) {
                panelsWrap = document.createElement('div');
                panelsWrap.id = 'leftPanelsWrap';
                panelsWrap.style.padding = "20px";
                panelsWrap.style.display = "flex";
                panelsWrap.style.flexDirection = "column";
                panelsWrap.style.gap = "20px";
                panelsWrap.style.background = "var(--bg-elevated)";
                
                const boxes = rightSidebar.querySelectorAll('.info-box');
                boxes.forEach(box => panelsWrap.appendChild(box));
                leftSidebar.appendChild(panelsWrap);
            }
        }
    }

    window.exportProgress = function() {
        const code = btoa(JSON.stringify(completedLessons));
        
        navigator.clipboard.writeText(code).then(() => {
            if(window.KB_Toaster) {
                KB_Toaster.show(
                    'Postup zkopírován!', 
                    'Kód máte v mezipaměti počítače. Kód vašeho postupu. Na jakémkoli jiném počítači ho vložte přes tlačítko "Obnovit Postup z Kódu" hned pod tímto tlačítkem které jste nyní stiskli. Díky této funkci si přenesete Váš aktuální průběh vzdělávání z tohoto kurzu s sebou na jiný počítač, třeba u Vás doma, a můžete tak navázat na průběh Vašeho studia tohoto kurzu a pokračovat ve studiu třeba u Vás na domácím počítači. Navážete souvisle ve Vašem studiu přesně tam, kde jste naposledy skončili, třeba během pracovní doby na počítači u Vás v práci. Pod ikonkou infohlášky k tomuto tlačítku naleznete instrukce krok-za-krokem.', 
                    'success'
                );
            } else {
                alert('Kód postupu byl zkopírován. Na jakémkoli jiném počítači ho vložte přes tlačítko "Obnovit Postup z Kódu" hned pod tímto tlačítkem které jste nyní stiskli. Díky této funkci si přenesete Váš aktuální průběh vzdělávání z tohoto kurzu s sebou na jiný počítač, třeba u Vás doma, a pokračovat ve studiu tohoto kurzu u Vás na domácím počítači tam, kde jste skončili naposledy, třeba na pracovním počítači u Vás v práci. Pod ikonkou infohlášky k tomuto tlačítku naleznete instrukce krok-za-krokem.');
            }
        });
    };

    window.importProgress = function() {
        const code = prompt("Vložte kód pro obnovení postupu:");
        if (code) {
            try {
                completedLessons = JSON.parse(atob(code));
                localStorage.setItem(`jmhz_lms_progress_${courseId}`, JSON.stringify(completedLessons));
                alert("Postup Vašeho studia u tohoto kurzu byl úspěšně obnoven!");
                location.reload();
            } catch (e) {
                alert("Neplatný kód.");
            }
        }
    };

    window.toggleFaq = function(element) { element.parentElement.classList.toggle('open'); };

    window.checkQuizAnswer = function(btn, isCorrect, quizId) {
        const parent = btn.parentElement;
        const feedback = document.getElementById(quizId + '_feedback');
        
        if (isCorrect) {
            // SPRÁVNÁ ODPOVĚĎ: Zablokujeme všechna tlačítka a ukážeme úspěch
            Array.from(parent.children).forEach(b => {
                b.disabled = true; b.style.opacity = '0.5'; b.style.cursor = 'not-allowed';
            });
            btn.style.opacity = '1'; btn.style.color = '#fff';
            btn.style.background = 'var(--success)'; btn.style.borderColor = 'var(--success)';
            
            feedback.innerHTML = '✅ Správná odpověď!';
            feedback.style.background = 'var(--success-bg)'; feedback.style.color = 'var(--success)';
        } else {
            // ŠPATNÁ ODPOVĚĎ: Zablokujeme JEN to jedno kliknuté tlačítko
            btn.disabled = true; 
            btn.style.opacity = '0.7'; 
            btn.style.cursor = 'not-allowed';
            btn.style.color = '#fff';
            btn.style.background = 'var(--error)'; 
            btn.style.borderColor = 'var(--error)';
            
            feedback.innerHTML = '❌ Bohužel, nesprávně. Zkuste to znovu.';
            feedback.style.background = 'var(--error-bg)'; feedback.style.color = 'var(--error)';
        }
        feedback.style.display = 'block';
    };

    function parseHtmlToLessons(html) {
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = html;
        let currentLesson = { title: "Úvod do kurzu", content: "" };
        
        Array.from(tempDiv.childNodes).forEach(node => {
            if (node.nodeName === 'H1') {
                if (currentLesson.content.trim()) lessons.push(currentLesson);
                currentLesson = { title: node.textContent, content: "" };
            } else {
                currentLesson.content += node.outerHTML || node.textContent;
            }
        });
        if (currentLesson.content.trim()) lessons.push(currentLesson);
        if (lessons.length > 1 && !lessons[0].content.trim()) lessons.shift();
    }

// Vylepšená podpora shortcodů s ořezem HTML balastu lms.html

// Vylepšená podpora shortcodů s ořezem HTML balastu lms.html
    function replaceMediaTags(html) {
        let parsed = html;
        
        parsed = parsed.replace(/(?:<a[^>]*>)?\[VIDEO:\s*(.+?)\](?:<\/a>)?/gi, (match, content) => {
            let rawSrc = content.replace(/<[^>]+>/g, '').trim();
            let fullSrc = rawSrc;
            
            // Sestavení absolutní URL přesně podle toho, co je ve Wordu
            if (!fullSrc.startsWith('http://') && !fullSrc.startsWith('https://')) {
                if (!fullSrc.startsWith('/')) {
                    fullSrc = MEDIA_BASE_URL + fullSrc;
                } else {
                    fullSrc = MEDIA_BASE_URL.replace(/\/$/, '') + fullSrc;
                }
            }
            
            // baseSrc = ořízneme jen .mp4 (pro pozdější přilepení _4k.mp4 ve skriptu)
            let baseSrc = fullSrc.replace(/\.mp4$/i, '');

            // ZMĚNA: defaultVideoUrl je nyní PŘESNĚ fullSrc z Wordu (např. 001_uvod.mp4)
            return `
            <div class="media-wrapper kb-video-container" data-base-src="${baseSrc}" data-original-src="${fullSrc}">
                <video controls preload="metadata" style="width:100%; border-radius:8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); background:#000;">
                    <source src="${fullSrc}" type="video/mp4">
                    Váš prohlížeč nepodporuje přehrávání videa.
                </video>
            </div>`;
        });
        
        parsed = parsed.replace(/(?:<a[^>]*>)?\[AUDIO:\s*(.+?)\](?:<\/a>)?/gi, (match, content) => {
            let src = content.replace(/<[^>]+>/g, '').trim();
            if (!src.startsWith('http://') && !src.startsWith('https://')) {
                 if (!src.startsWith('/')) src = MEDIA_BASE_URL + src;
                 else src = MEDIA_BASE_URL.replace(/\/$/, '') + src;
            }
            return `<div class="media-wrapper"><audio controls style="width:100%;"><source src="${src}" type="audio/mpeg">Audio</audio></div>`;
        });
        
        parsed = parsed.replace(/(?:<a[^>]*>)?\[OBRAZEK:\s*(.+?)\](?:<\/a>)?/gi, (match, content) => {
            let src = content.replace(/<[^>]+>/g, '').trim();
            if (!src.startsWith('http://') && !src.startsWith('https://')) {
                 if (!src.startsWith('/')) src = MEDIA_BASE_URL + src;
                 else src = MEDIA_BASE_URL.replace(/\/$/, '') + src;
            }
            return `<div class="media-wrapper"><img src="${src}" style="max-width:100%; border-radius:8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);"></div>`;
        });

        parsed = parsed.replace(/(?:<a[^>]*>)?\[PRILOHA:\s*([^|\]]+)(?:\|([^\]]+))?\](?:<\/a>)?/gi, (match, url, label) => {
            let src = url.replace(/<[^>]+>/g, '').trim();
            let btnLabel = label ? label.replace(/<[^>]+>/g, '').trim() : "Stáhnout přílohu";
            if (!src.startsWith('http://') && !src.startsWith('https://')) {
                 if (!src.startsWith('/')) src = DOCX_BASE_URL + src;
                 else src = DOCX_BASE_URL.replace(/\/$/, '') + src;
            }
            return `<div style="margin: 20px 0;"><a href="${src}" target="_blank" class="btn primary" style="display:inline-flex; align-items:center; gap:8px; text-decoration:none;"><span style="font-size:1.2rem;">📎</span> ${btnLabel}</a></div>`;
        });

        parsed = parsed.replace(/(?:<a[^>]*>)?\[FAQ:\s*([^|\]]+)\|([^\]]+)\](?:<\/a>)?/gi, (match, question, answer) => {
            let q = question.replace(/<[^>]+>/g, '').trim();
            let a = answer.replace(/<[^>]+>/g, '').trim();
            return `<div class="faq-box"><div class="faq-question" onclick="toggleFaq(this)"><span>${q}</span><span class="faq-icon">▼</span></div><div class="faq-answer">${a}</div></div>`;
        });
        
        parsed = parsed.replace(/(?:<a[^>]*>)?\[KVIZ:\s*(.+?)\](?:<\/a>)?/gi, (match, content) => {
            let parts = content.split('|').map(p => p.trim().replace(/<[^>]+>/g, ''));
            let question = parts.shift(); 
            let quizId = 'quiz_' + Math.random().toString(36).substr(2, 9);
            
            let htmlOut = `<div class="lms-quiz-box" style="background:var(--bg-surface); border:1px solid var(--border-strong); border-radius:8px; padding:20px; margin:30px 0;"><h4 style="margin:0 0 15px 0; color:var(--text-primary); display:flex; align-items:center; gap:8px;"><span style="font-size:1.5rem;">🧠</span> ${question}</h4><div class="lms-quiz-options" style="display:flex; flex-direction:column; gap:10px;">`;
            
            parts.forEach((ans) => {
                let isCorrect = ans.endsWith('*');
                let cleanAns = isCorrect ? ans.slice(0, -1).trim() : ans;
                htmlOut += `<button class="btn" onclick="checkQuizAnswer(this, ${isCorrect}, '${quizId}')" style="text-align:left; justify-content:flex-start; font-size:1rem; padding:12px; border:1px solid var(--border); background:var(--bg-elevated); transition:0.2s;">${cleanAns}</button>`;
            });
            
            htmlOut += `</div><div id="${quizId}_feedback" style="margin-top:15px; font-weight:600; font-size:0.95rem; display:none; padding:10px; border-radius:6px;"></div></div>`;
            return htmlOut;
        });

        return parsed;
    }

    function renderSidebar() {
        const list = document.getElementById('lessonList');
        list.innerHTML = '';
        
        lessons.forEach((lesson, index) => {
            const isCompleted = completedLessons.includes(index);
            const isActive = index === currentLessonIndex;
            
            const item = document.createElement('div');
            item.className = `lms-lesson-item ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}`;
            item.innerHTML = `<div class="lms-check"></div> <span>${index + 1}. ${lesson.title}</span>`;
            item.onclick = () => openLesson(index);
            list.appendChild(item);
        });

        const percentage = Math.round((completedLessons.length / lessons.length) * 100);
        document.getElementById('progressBar').style.width = percentage + '%';
        document.getElementById('progressText').textContent = `Dokončeno ${percentage} %`;
    }

    function openLesson(index) {
        currentLessonIndex = index;
        const lesson = lessons[index];
        
        document.getElementById('lessonTitle').textContent = lesson.title;
        
        // Získání kontejneru a zpracování obsahu i dynamických záložek (TABS)
        const contentContainer = document.getElementById('lessonContent');
        processLessonContent(lesson.content, contentContainer, courseId, index);
        
        // Původní scroll (posune nahoru celou stránku, pokud se scrollovalo na mobilu)
        window.scrollTo({ top: 0, behavior: 'smooth' });
        
        // NOVÉ: Vyroluje samotný panel lekce zpět nahoru!
        if (contentContainer) {
            contentContainer.scrollTop = 0;
        }

        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');

        btnPrev.style.visibility = index > 0 ? 'visible' : 'hidden';
        btnPrev.onclick = () => openLesson(index - 1);

        if (index === lessons.length - 1) {
            btnNext.textContent = "🏆 Dokončit kurz";
            btnNext.onclick = () => finishCourse(index);
        } else {
            btnNext.textContent = "Završit lekci a pokračovat →";
            btnNext.onclick = () => completeAndNext(index);
        }

        renderSidebar();
    }

    function completeAndNext(index) {
        if (!completedLessons.includes(index)) {
            completedLessons.push(index);
            localStorage.setItem(`jmhz_lms_progress_${courseId}`, JSON.stringify(completedLessons));
        }
        openLesson(index + 1);
    }

    function finishCourse(index) {
        if (!completedLessons.includes(index)) {
            completedLessons.push(index);
            localStorage.setItem(`jmhz_lms_progress_${courseId}`, JSON.stringify(completedLessons));
        }
        renderSidebar();
        
        document.getElementById('lessonTitle').textContent = "🎉 Gratulujeme!";
        document.getElementById('lessonContent').innerHTML = `
            <div style="text-align:center; padding:40px 20px;">
                <div style="font-size:4rem; margin-bottom:20px;">🎓</div>
                <h3 style="font-size:1.5rem; margin-bottom:15px; color:var(--text-primary);">Dokončili jste kurz: ${courseData.title}</h3>
                
                <div style="background:var(--bg-surface); padding:30px; border-radius:12px; border:1px dashed var(--border-strong); max-width:500px; margin:0 auto; margin-bottom: 20px;">
                    <h4 style="margin-top:0;">Vystavit certifikát o absolvování</h4>
                    <input type="text" id="certNameInput" placeholder="Zadejte své jméno a příjmení..." style="width:100%; padding:12px; border:1px solid var(--border); border-radius:6px; font-size:1rem; margin-bottom:15px; outline:none; box-sizing:border-box;">
                    <button class="btn primary" onclick="generateCertificate()" style="width:100%; padding:12px; font-size:1rem;">🖨️ Obdržet Můj Certifikát</button>
                </div>
                
                <button class="btn" onclick="resetCourse()" style="padding:10px 20px; font-size:0.9rem;">🔄 Vymazat celý Váš průběh vzdělávání v tomto kurzu a začít kurz znovu (Můžete kdykoli)</button>
            </div>
        `;
        document.getElementById('btnNext').style.display = 'none';
        document.getElementById('btnPrev').style.visibility = 'hidden';
    }

        const printWindow = window.open('', '', 'width=900,height=700');
        
        printWindow.document.write(`
            <html><head><title>Certifikát - ${name}<\/title>

                .cert-container { border: 10px solid #343B4E; padding: 50px; border-radius: 20px; background: #fafafa; }
                .logo { font-size: 24px; font-weight: 900; color: #F57C00; margin-bottom: 40px; }
                h1 { font-size: 40px; color: #111827; margin: 0; text-transform: uppercase;}

                p { font-size: 20px; color: #4b5563; }
                .name { font-size: 36px; font-weight: bold; color: #111827; border-bottom: 2px solid #e5e7eb; display: inline-block; padding-bottom: 10px; min-width: 400px; margin: 20px 0; }
                .footer { margin-top: 60px; display: flex; justify-content: space-between; font-size: 16px; color: #6b7280; font-weight: bold;}
            <\/style>
            <\/head><body>
                <div class="cert-container">
                    <div class="logo">SALARY s.r.o.<\/div>
                    <h1>Certifikát o absolvování<\/h1>
                    <p>Tímto potvrzujeme, že<\/p>
                    <div class="name">${name}<\/div>
                    <p>úspěšně absolvoval/a interaktivní vzdělávací kurz<\/p>
                    <h2>${courseData.title}<\/h2>
                    <div class="footer"><span>Datum: ${date}<\/span><span>JMHZ Znalostní Knihovna<\/span><\/div>
                <\/div>
                <script>window.onload = function() { window.print(); window.close(); }<\/script>
            <\/body><\/html>
        `);
        printWindow.document.close();
    };

    window.resetCourse = function() {
        if (confirm("Opravdu vymazat postup?")) {
            localStorage.removeItem(`jmhz_lms_progress_${courseId}`);
            completedLessons = [];
            document.getElementById('btnNext').style.display = 'block'; 
            openLesson(0);
        }
    };

    window.copyCourseLink = function() {
        const url = window.location.href.split('#')[0]; 
        navigator.clipboard.writeText(url).then(() => {
            if(window.KB_Toaster) KB_Toaster.show('Zkopírováno', 'Odkaz na kurz byl zkopírován.', 'success');
            else alert('Zkopírováno: Odkaz na kurz byl zkopírován.');
        });
    };

    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowRight' && document.getElementById('btnNext').style.display !== 'none') {
            document.getElementById('btnNext').click();
        } else if (e.key === 'ArrowLeft' && document.getElementById('btnPrev').style.visibility !== 'hidden') {
            document.getElementById('btnPrev').click();
        }
    });

    // =========================================================
    // LOGIKA PRO DYNAMICKÉ ZÁLOŽKY (TABS) Z MS WORDU
    // =========================================================
    
    function processLessonContent(html, container, courseId, lessonIndex) {
        let tabsData = [];

        // 1. Regulární výraz pro vyhledání [TAB: ...]
        const tabRegex = /(?:<a[^>]*>)?\[TAB:\s*([^\]|]+)(?:\s*\|\s*([^\]]+))?\](?:<\/a>)?/gi;

        // 2. Extrakce dat pro záložky a odstranění tagů z hlavního textu
        let cleanHtml = html.replace(tabRegex, (match, title, content) => {
            // Odstranění HTML tagů (např. automatických odkazů z Wordu) ze samotných parametrů
            const parts = content ? content.split('|').map(p => p.replace(/<[^>]+>/g, '').trim()) : [];
            
            if (title.trim().toLowerCase() === 'lektor') {
                tabsData.push({
                    type: 'instructor',
                    title: '🎓 Profil Lektora',
                    name: parts[0] || "Tým SALARY",
                    role: parts[1] || "Lektor",
                    bio: parts[2] || "",
                    avatar: parts[3] ? (parts[3].startsWith('http') ? parts[3] : MEDIA_BASE_URL + parts[3]) : ""
                });
            } else if (title.trim().toLowerCase() === 'poznámky') {
                tabsData.push({
                    type: 'notes',
                    title: '📝 Moje Studijní Poznámky',
                    active: true
                });
            } else {
                tabsData.push({
                    type: 'text',
                    title: title.trim(),
                    content: content || ""
                });
            }
            return ""; // Odstraní tag z hlavního textu lekce
        });

        // 3. Původní zpracování ostatních médií (Video, Kvíz, FAQ atd.)
        cleanHtml = replaceMediaTags(cleanHtml);

        // 4. Vložení vyčištěného obsahu do lekce
        container.innerHTML = cleanHtml;

        // 5. Pokud byly nalezeny nějaké záložky, vykreslíme komponentu záložek
        if (tabsData.length > 0) {
            renderDynamicTabs(container, courseId, lessonIndex, tabsData);
        }
    }

    function renderDynamicTabs(container, courseId, lessonIndex, tabs) {
        const lessonId = `lesson_${lessonIndex}`;
        
        let buttonsHTML = "";
        let panesHTML = "";

        tabs.forEach((tab, index) => {
            const activeClass = index === 0 ? "active" : "";
            const tabUniqueId = `tab-${lessonId}-${index}`;

            buttonsHTML += `<button class="lms-tab-btn ${activeClass}" data-target="${tabUniqueId}">${tab.title}</button>`;

            let content = "";
            if (tab.type === 'instructor') {
                content = `
                    <div class="lms-instructor-profile">
                        <img src="${tab.avatar}" class="lms-instructor-thumb" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\'><rect width=\\'100\\' height=\\'100\\' fill=\\'%23e5e7eb\\'/><text x=\\'50\\' y=\\'55\\' font-family=\\'Arial\\' font-size=\\'40\\' fill=\\'%239ca3af\\' text-anchor=\\'middle\\'>👤</text></svg>'">
                        <div class="lms-instructor-info">
                            <span class="lms-instructor-role">${tab.role}</span>
                            <h3 style="margin-top:0;">${tab.name}</h3>
                            <p>${tab.bio}</p>
                        </div>
                    </div>`;
            } else if (tab.type === 'notes') {
                const storageKey = `jmhz_lms_notes_${courseId}_${lessonId}`;
                const savedValue = localStorage.getItem(storageKey) || "";
                content = `
                    <div class="lms-notes-container">
                        <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;">
                            Tyto poznámky jsou soukromé a ukládají se bezpečně pouze do vašeho prohlížeče. Budou tu na vás čekat i po restartu.
                        </div>
                        <textarea class="lms-notes-textarea" id="txt-${tabUniqueId}" placeholder="Začněte psát své studijní poznámky k této lekci...">${savedValue}</textarea>
                        <div class="lms-notes-footer" style="margin-top:8px; display:flex; justify-content:space-between; color:var(--text-muted); font-size:0.8rem;">
                            <span id="len-${tabUniqueId}">Počet Napsaných Znaků: ${savedValue.length}</span>
                            <span class="lms-save-status" id="stat-${tabUniqueId}" style="display:flex; align-items:center; gap:4px; opacity:0; transition:opacity 0.3s; color:var(--success);">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Uloženo
                            </span>
                        </div>
                    </div>`;
            } else {
                content = `<p>${tab.content}</p>`;
            }

            panesHTML += `<div class="lms-tab-pane ${activeClass}" id="${tabUniqueId}">${content}</div>`;
        });

        const fullHTML = `
            <div class="lms-tabs-container">
                <div class="lms-tabs-header">${buttonsHTML}</div>
                <div class="lms-tabs-body">${panesHTML}</div>
            </div>`;

        // ZDE JE ZMĚNA: Najdeme všechna připojená média v dané lekci
        const mediaWrappers = container.querySelectorAll('.media-wrapper');
        
        if (mediaWrappers.length > 0) {
            // Pokud lekce obsahuje médium, vložíme záložky HNED ZA NĚJ (za to první hlavní)
            mediaWrappers[0].insertAdjacentHTML('afterend', fullHTML);
        } else {
            // Jako záložní plán (pokud v lekci není žádné video/obrázek), vložíme záložky na konec lekce
            container.insertAdjacentHTML('beforeend', fullHTML);
        }

        const tabContainer = container.querySelector('.lms-tabs-container');
        const btns = tabContainer.querySelectorAll('.lms-tab-btn');
        const panes = tabContainer.querySelectorAll('.lms-tab-pane');

        // Navázání přepínání
        btns.forEach(btn => {
            btn.addEventListener('click', function() {
                btns.forEach(b => b.classList.remove('active'));
                panes.forEach(p => p.classList.remove('active'));
                
                this.classList.add('active');
                const targetPane = tabContainer.querySelector('#' + this.getAttribute('data-target'));
                if (targetPane) {
                    targetPane.classList.add('active');
                }
            });
        });

        // Navázání auto-save pro textarea (zajišťuje, že prvky už 100% existují v DOM)
        tabs.forEach((tab, index) => {
            if (tab.type === 'notes') {
                const tabUniqueId = `tab-${lessonId}-${index}`;
                const storageKey = `jmhz_lms_notes_${courseId}_${lessonId}`;
                const area = tabContainer.querySelector(`#txt-${tabUniqueId}`);
                const lenIndicator = tabContainer.querySelector(`#len-${tabUniqueId}`);
                const statIndicator = tabContainer.querySelector(`#stat-${tabUniqueId}`);
                let saveTimeout;

                if (area) {
                    area.addEventListener('input', () => {
                        const text = area.value;
                        if (lenIndicator) lenIndicator.textContent = `Znaků: ${text.length}`;
                        if (statIndicator) statIndicator.style.opacity = '0'; 
                        
                        clearTimeout(saveTimeout);
                        saveTimeout = setTimeout(() => {
                            localStorage.setItem(storageKey, text);
                            if (statIndicator) {
                                statIndicator.style.opacity = '1'; 
                                setTimeout(() => { statIndicator.style.opacity = '0'; }, 2000);
                            }
}, 500);
                    });
                }
            }
        });

        // <--- ZDE JE TO SPRÁVNÉ MÍSTO PRO INICIALIZACI VIDEA (až po ukončení cyklu forEach) --->
        if (window.KB_VideoManager) KB_VideoManager.init(); 
    }
        // =========================================================
    // VÝPOČET ČASU (Čtení + Délka Videí a Audia)
    // =========================================================
    window.calculateLessonTime = function(container) {
        const indicator = document.getElementById('lmsTimeIndicator');
        if (!indicator) return;

        // 1. Výpočet času čtení textu (Průměrně čteme 200 slov za minutu)
        const text = container.textContent || "";
        const words = text.trim().split(/\s+/).length;
        let totalSeconds = Math.ceil(words / 200) * 60; 

        // 2. Nalezení všech přehrávačů v lekci (Videa i Audio)
        const mediaElements = container.querySelectorAll('video, audio');
        let loadedCount = 0;

        // Funkce pro vykreslení finálního výsledku
        const updateUI = () => {
            const mins = Math.ceil(totalSeconds / 60);
            let minText = 'minut';
            if (mins === 1) minText = 'minuta';
            else if (mins >= 2 && mins <= 4) minText = 'minuty';
            
            // 1. Aktualizace hlavního indikátoru nad textem lekce
            indicator.innerHTML = `⏱️ Odhadovaný čas na tuto lekci: <span style="color:var(--accent);">${mins} ${minText}</span>`;

            // 2. NOVÉ: Přepis údaje v pravém panelu (Štítky a Info) pro aktuální lekcii
            const metaBox = document.getElementById('articleMeta');
            if (metaBox) {
                // Skript vezme stávající obsah, odsekne ho u značky <br> (čímž zachráníme datum) 
                // a připojí k němu nový, dynamicky spočítaný čas pro tuto konkrétní lekci.
                const datePart = metaBox.innerHTML.split('<br>')[0];
                metaBox.innerHTML = `${datePart}<br>Délka lekce: <strong>${mins} min</strong>`;
            }
        };

        // Pokud v lekci není žádné video/audio, rovnou ukážeme čas čtení textu
        if (mediaElements.length === 0) {
            updateUI();
            return;
        }

        indicator.innerHTML = `⏱️ Analyzuji délku videí...`;

        // 3. Počkáme na načtení metadat z FTP, abychom znali PŘESNOU délku videí
        mediaElements.forEach(media => {
            // Pokud se metadata (délka) stihla načíst už dřív
            if (media.readyState >= 1) { 
                totalSeconds += media.duration;
                loadedCount++;
                if (loadedCount === mediaElements.length) updateUI();
            } else {
                // Pokud ještě nejsou, počkáme si na ně
                media.addEventListener('loadedmetadata', () => {
                    totalSeconds += media.duration;
                    loadedCount++;
                    if (loadedCount === mediaElements.length) updateUI();
                });
                
                // BEZPEČNOSTNÍ POJISTKA: Pokud by video na FTP chybělo, nebo měl uživatel zablokovaná média
                setTimeout(() => {
                    if (loadedCount < mediaElements.length) {
                        loadedCount++;
                        // Pokud video selhalo, přidáme k času paušální odhad 3 minuty
                        if (media.readyState === 0) totalSeconds += 180; 
                        if (loadedCount === mediaElements.length) updateUI();
                    }
                }, 1500); // Čekáme max 1.5 sekundy
            }
        });
    };

    document.addEventListener('DOMContentLoaded', initLms);

    // Registrace Service Workeru (offline režim / PWA)
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch((err) =>
                console.warn('Service Worker se nepodařilo zaregistrovat:', err)
            );
        });
    }
