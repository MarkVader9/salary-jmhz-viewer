/* === Design Tokens === */
:root {

  --bg-base: oklch(97% 0.005 250);

  --border-subtle: oklch(92% 0.008 250);
  --border-strong: oklch(78% 0.015 250);
  --text-primary: oklch(20% 0.02 250);
  --text-secondary: oklch(42% 0.015 250);
  --text-muted: oklch(58% 0.012 250);
  --text-faint: oklch(72% 0.008 250);
  /* Accent — deep blue */
  --accent: oklch(48% 0.2 255);
  --accent-hover: oklch(40% 0.22 255);
  --accent-subtle: oklch(94% 0.035 255);
  --accent-text: oklch(99% 0.005 255);
  --accent-focus: oklch(48% 0.2 255 / 0.15);
  --accent-border: oklch(72% 0.08 255);
  --accent-bg: var(--accent);
  --accent-bg-hover: var(--accent-hover);
  --on-accent-bg: var(--accent-text);
  --logo-color: #343B4E;
  --logo-shape-color: #343B4E;
  /* Semantic */
  --error: oklch(52% 0.2 25);
  --error-bg: oklch(95% 0.035 25);
  --error-border: oklch(82% 0.08 25);
  --success: oklch(50% 0.14 155);
  --success-bg: oklch(94% 0.04 155);
  --success-border: oklch(82% 0.06 155);
  --warning: oklch(58% 0.16 80);
  --warning-bg: oklch(95% 0.045 80);
  --warning-border: oklch(82% 0.08 80);
  --match-bg: oklch(95% 0.055 80);
  --match-border: oklch(82% 0.08 80);
  /* Excel-like table */
  --table-th-bg: oklch(94% 0.01 250);
  --table-th-frozen-bg: oklch(89% 0.018 250);
  --table-th-border: oklch(82% 0.015 250);
  --table-row-even-bg: oklch(94.5% 0.008 250);
  /* Effects */
  --shadow-color: oklch(20% 0.02 250);
  --bg-elevated-scrim: oklch(99% 0.003 250 / 0.92);
  /* Motion */
  --ease: cubic-bezier(0.25, 1, 0.5, 1);
  --duration: 180ms;
  /* Spacing (4pt base) */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px; --sp-8: 32px; --sp-12: 48px;
  /* Radius */
  --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px;
}

:root[data-theme="dark"] {
  /* Tinted dark neutrals — same hue 250, inverted lightness */
  --bg-base: oklch(18% 0.012 250);
  --bg-surface: oklch(22% 0.014 250);
  --bg-elevated: oklch(23% 0.015 250);
  --bg-hover: oklch(30% 0.018 250);
  --bg-active: oklch(34% 0.02 250);
  --border: oklch(38% 0.018 250);
  --border-subtle: oklch(30% 0.014 250);
  --border-strong: oklch(48% 0.02 250);
  --text-primary: oklch(96% 0.008 250);
  --text-secondary: oklch(82% 0.014 250);
  --text-muted: oklch(74% 0.012 250);
  --text-faint: oklch(64% 0.012 250);
  /* Accent — muted, dark-leaning blue family for dark mode */
  --accent: oklch(72% 0.08 255);
  --accent-hover: oklch(80% 0.08 255);
  --accent-subtle: oklch(26% 0.04 255);
  --accent-text: oklch(15% 0.01 250);
  --accent-focus: oklch(72% 0.10 255 / 0.30);
  --accent-border: oklch(45% 0.05 255);
  --accent-bg: oklch(30% 0.04 255);
  --accent-bg-hover: oklch(38% 0.05 255);
  --on-accent-bg: oklch(98% 0.005 255);
  --logo-color: oklch(82% 0.014 250);
  --logo-shape-color: oklch(50% 0.018 250);
  /* Semantic — desaturated row tints, brighter foregrounds */
  --error: oklch(74% 0.16 25);
  --error-bg: oklch(28% 0.07 25);
  --error-border: oklch(48% 0.12 25);
  --success: oklch(74% 0.14 155);
  --success-bg: oklch(28% 0.06 155);
  --success-border: oklch(48% 0.10 155);
  --warning: oklch(80% 0.14 80);
  --warning-bg: oklch(30% 0.06 80);
  --warning-border: oklch(50% 0.10 80);
  --match-bg: oklch(32% 0.07 80);
  --match-border: oklch(50% 0.10 80);
  /* Excel-like table — header + alternating dark stripe match page bg */
  --table-th-bg: oklch(18% 0.012 250);
  --table-th-frozen-bg: oklch(18% 0.012 250);
  --table-th-border: oklch(40% 0.018 250);
  --table-row-even-bg: oklch(18% 0.012 250);
  /* Effects */
  --shadow-color: oklch(0% 0 0);
  --bg-elevated-scrim: oklch(23% 0.015 250 / 0.92);
  color-scheme: dark;
}

/* === Reset & Base === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; overflow: auto; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 0.875rem;
  color: var(--text-primary);
  background: var(--bg-base);
  font-kerning: normal;
  -webkit-font-smoothing: antialiased;
}

/* === Layout === */
.app { display: flex; flex-direction: column; min-height: 100vh; }
.toolbar {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-4);
  min-height: 48px; background: var(--bg-elevated); border-bottom: 1px solid var(--border);
  z-index: 10; flex-shrink: 0; position: relative;
}
.content { padding: var(--sp-4) var(--sp-6); }
.validation-panel-spacer { flex-shrink: 0; }
.validation-panel {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  background: var(--bg-elevated);
  border-top: 1px solid var(--border);
  box-shadow: 0 -4px 16px color-mix(in oklch, var(--shadow-color) 8%, transparent);
}

/* === Toolbar === */
.toolbar button, .btn {
  padding: var(--sp-1) var(--sp-3); border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--bg-elevated); cursor: pointer; font-size: 0.8125rem; font-weight: 500;
  color: var(--text-secondary); transition: all var(--duration) var(--ease);
}
.toolbar button:hover, .btn:hover { background: var(--bg-hover); border-color: var(--border-strong); color: var(--text-primary); }
.toolbar button:active, .btn:active { background: var(--bg-active); transform: scale(0.98); }
.toolbar button.primary, .btn.primary { background: var(--accent-bg); color: var(--on-accent-bg); border-color: var(--accent-bg); }
.toolbar button.primary:hover, .btn.primary:hover { background: var(--accent-bg-hover); border-color: var(--accent-bg-hover); }
.toolbar button.primary:active, .btn.primary:active { transform: scale(0.98); }
.btn-submit-cssz { background: #15803d !important; color: #fff !important; border-color: #15803d !important; }
.btn-submit-cssz:hover { background: #166534 !important; border-color: #166534 !important; }

/* NOVÉ: Tlačítko pro JMHZ Knihovnu */
.btn-jmhz-knihovna { background: #0057ca !important; color: #fff !important; border-color: #dcedff !important; }
.btn-jmhz-knihovna:hover { background: #0d136a !important; color: #fff !important; border-color: #0d136a !important; }

.btn-report:hover { transform: none !important; }
.toolbar-left, .toolbar-center, .toolbar-right { min-width: 0; }

.btn-report:hover { transform: none !important; }
.toolbar-left, .toolbar-center, .toolbar-right { min-width: 0; }
.toolbar-left {
  display: flex; align-items: center; gap: var(--sp-3); position: relative; z-index: 1;
}
.toolbar-right {
  display: flex; align-items: center; gap: var(--sp-3); justify-self: end; position: relative; z-index: 1;
}
.toolbar-right > button, .toolbar-right > .split-button { white-space: nowrap; }
.brand-logo {
  display: inline-flex; align-items: center; flex-shrink: 0;
  height: 28px; color: var(--logo-color);
}
.brand-logo svg { display: block; height: 100%; width: auto; }
.toolbar-center {
  display: flex; align-items: center; justify-content: center; min-width: 0; overflow: visible; position: relative; gap: var(--sp-2);
}

/* === File Selector Combo Box === */
.file-selector {
  position: relative;
  display: inline-flex;
  align-items: center;
  max-width: 423px;
  width: 100%;
}
.file-selector-trigger {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-1) var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--bg-elevated);
  cursor: pointer;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all var(--duration) var(--ease);
  white-space: nowrap;
  overflow: hidden;
  min-width: 0;
  width: 100%;
}
.file-selector-trigger:hover { background: var(--bg-hover); border-color: oklch(78% 0.015 250); color: var(--text-primary); }
.file-selector.open .file-selector-trigger { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-focus); }
.file-selector-filename {
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  flex: 1;
  text-align: left;
}
.file-selector-badge {
  font-size: 0.6875rem;
  color: var(--text-muted);
  background: var(--bg-base);
  padding: 1px 6px;
  border-radius: 10px;
  flex-shrink: 0;
}
.file-selector-chevron {
  flex-shrink: 0;
  font-size: 0.625rem;
  color: var(--text-muted);
  transition: transform var(--duration) var(--ease);
}
.file-selector.open .file-selector-chevron { transform: rotate(180deg); }
.file-selector-backdrop {
  position: fixed;
  inset: 0;
  z-index: 49;
}
.file-selector-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  min-width: 280px;
  max-width: 420px;
  width: max-content;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: 0 8px 24px oklch(20% 0.02 250 / 0.12);
  z-index: 50;
  padding: var(--sp-1);
  max-height: 320px;
  overflow-y: auto;
}
.file-selector-item {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.8125rem;
  color: var(--text-secondary);
  transition: background var(--duration) var(--ease);
}
.file-selector-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.file-selector-item--active { background: var(--accent-subtle); color: var(--accent); font-weight: 600; }
.file-selector-item--active:hover { background: var(--accent-subtle); }
:root[data-theme="dark"] .file-selector-item--active { color: var(--text-primary); }
.file-selector-item-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.file-selector-item-badge {
  font-size: 0.625rem;
  font-weight: 500;
  color: var(--text-muted);
  background: var(--bg-base);
  padding: 1px 6px;
  border-radius: 8px;
  flex-shrink: 0;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}
.file-selector-close {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: transparent;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.6875rem;
  transition: all var(--duration) var(--ease);
  padding: 0;
}
.file-selector-close:hover { background: var(--error-bg); color: var(--error); }
.file-selector-divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: var(--sp-1) 0;
}
.file-selector-action {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.8125rem;
  color: var(--accent);
  font-weight: 500;
  transition: background var(--duration) var(--ease);
}
.file-selector-action:hover { background: var(--bg-hover); }
.file-selector-action-icon {
  font-size: 0.875rem;
  font-weight: 700;
  line-height: 1;
}

/* === Modal backdrop + dialog (reusable) === */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.35);
}
.modal-dialog {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--sp-6);
  min-width: 320px;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}
/* === Hamburger / Drawer Toggle === */
.drawer-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 116px;
  height: 29px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--bg-elevated);
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 1rem;
  transition: all var(--duration) var(--ease);
  flex-shrink: 0;
}
.drawer-toggle:hover { background: var(--bg-hover); color: var(--text-primary); border-color: oklch(78% 0.015 250); }
.drawer-toggle:active { background: var(--bg-active); transform: scale(0.95); }
.drawer-toggle-icon { line-height: 1; }

/* === Drawer (slides from left) === */
.drawer-backdrop {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: rgba(0, 0, 0, 0.25);
}
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: 280px;
  max-width: 85vw;
  z-index: 91;
  background: var(--bg-elevated);
  border-left: 1px solid var(--border);
  box-shadow: -4px 0 24px oklch(20% 0.02 250 / 0.12);
  display: flex;
  flex-direction: column;
  animation: drawer-slide-in var(--duration) var(--ease);
}
@keyframes drawer-slide-in {
  from { transform: translateX(100%); }
  to   { transform: translateX(0); }
}
.drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--border);
  min-height: 48px;
}
.drawer-close {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: transparent;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.8125rem;
  transition: all var(--duration) var(--ease);
  padding: 0;
}
.drawer-close:hover { background: var(--bg-hover); color: var(--text-primary); }
.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: var(--sp-3);
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}
.drawer-body button {
  width: 100%;
  text-align: left;
  padding: var(--sp-2) var(--sp-3);
  border: none;
  border-radius: var(--radius-md);
  background: transparent;
  cursor: pointer;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all var(--duration) var(--ease);
}
.drawer-body button:hover { background: var(--bg-hover); color: var(--text-primary); }
.drawer-body button:active { background: var(--bg-active); }
.drawer-body button.primary { background: var(--accent); color: var(--accent-text); }
.drawer-body button.primary:hover { background: var(--accent-hover); }


/* Původní ČSSZ tlačítko v menu */
.drawer-body .btn-submit-cssz { background: #15803d; color: #fff; }
.drawer-body .btn-submit-cssz:hover { background: #166534; }

/* NOVÉ: Tlačítko pro JMHZ Knihovnu v menu */
.drawer-body .btn-jmhz-knihovna { background: #0057ca !important; color: #fff !important; border-color: #dcedff !important; }
.drawer-body .btn-jmhz-knihovna:hover { background: #0d136a !important; color: #fff !important; border-color: #0d136a !important; }

.drawer-body .btn-csv-meta {
  display: flex; align-items: center; gap: var(--sp-1);
  font-size: 0.8rem; color: var(--text-secondary);
}
.drawer-body .btn-csv-meta .csv-meta-sources { color: var(--text-faint); font-size: 0.75rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drawer-body .btn-csv-meta .csv-meta-clear { color: var(--text-faint); font-size: 0.875rem; opacity: 0.6; }
.drawer-body .btn-csv-meta:hover .csv-meta-clear { color: var(--error); opacity: 1; }
.drawer-divider {
  border: none;
  border-top: 1px solid var(--border-subtle);
  margin: var(--sp-1) 0;
}
.split-button {
  position: relative;
  display: inline-flex;
  align-items: stretch;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--bg-elevated);
}
.split-button:hover {
  background: var(--bg-hover);
}
.split-button:active {
  background: var(--bg-active);
}
.split-button > button {
  border: none;
  border-radius: 0;
  background: transparent;
}
.split-button > button:first-child {
  border-top-left-radius: var(--radius-md);
  border-bottom-left-radius: var(--radius-md);
}
.split-button > button:first-child:not(:last-child) {
  padding-right: 2px;
}
.split-button > button:first-child:last-child {
  border-top-right-radius: var(--radius-md);
  border-bottom-right-radius: var(--radius-md);
}
.split-button-toggle {
  border-left: 1px solid var(--border);
  border-top-right-radius: var(--radius-md);
  border-bottom-right-radius: var(--radius-md);
  overflow: hidden;
  background-clip: padding-box;
  width: 6px;
  min-width: 6px;
  max-width: 6px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 6px;
  font-size: 0.5rem;
  color: var(--text-muted);
}
.split-button-toggle:hover,
.split-button-toggle:active {
  border-top-right-radius: var(--radius-md);
  border-bottom-right-radius: var(--radius-md);
  background-clip: padding-box;
}
.split-button > button:hover {
  color: var(--text-primary);
}
.split-button > button:active {
  color: var(--text-primary);
}
.split-button.primary {
  border-color: var(--accent-bg);
  background: var(--accent-bg);
}
.split-button.primary:hover {
  background: var(--accent-bg-hover);
  border-color: var(--accent-bg-hover);
}
.split-button.primary > button {
  color: var(--on-accent-bg);
}
/* Override .toolbar button:hover which sets background: var(--bg-hover) */
.split-button.primary > button,
.split-button.primary > button:hover,
.split-button.primary > button:active {
  background: transparent;
  border-color: transparent;
  color: var(--on-accent-bg);
}
.split-button.primary .split-button-toggle {
  border-left-color: color-mix(in oklch, var(--on-accent-bg) 30%, transparent);
  color: var(--on-accent-bg);
}
.save-menu-backdrop {
  position: fixed;
  inset: 0;
  z-index: 29;
}
.save-menu {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  min-width: max-content;
  padding: var(--sp-1);
  display: flex;
  flex-direction: column;
  gap: 2px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: 0 4px 12px color-mix(in oklch, var(--shadow-color) 10%, transparent);
  z-index: 30;
}
.save-menu button {
  width: 100%;
  text-align: left;
  border-radius: var(--radius-sm);
  padding: var(--sp-1) var(--sp-3);
  white-space: nowrap;
}
.validation-menu {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  min-width: max-content;
  padding: var(--sp-1);
  display: flex;
  flex-direction: column;
  gap: 2px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: 0 4px 12px color-mix(in oklch, var(--shadow-color) 10%, transparent);
  z-index: 30;
}
.validation-menu button {
  width: 100%;
  text-align: left;
  border-radius: var(--radius-sm);
  padding: var(--sp-1) var(--sp-3);
  white-space: nowrap;
}
.toolbar .privacy-note {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: center;
}
.toolbar .privacy-note { font-size: 14px; color: var(--text-muted); }
.toolbar-empty-note {
  position: absolute;
  left: 43%;
  top: 50%;
  transform: translate(-50%, -50%);
  max-width: calc(100% - 320px);
  pointer-events: none;
}
.toolbar .error-badge { background: var(--error); color: var(--accent-text); font-size: 0.6875rem; font-weight: 600; padding: 2px var(--sp-2); border-radius: 10px; }

/* === Employee Card === */
.emp-card {
  background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);
  margin-bottom: var(--sp-2); overflow: hidden;
  box-shadow: 0 1px 2px color-mix(in oklch, var(--shadow-color) 5%, transparent);
  transition: box-shadow var(--duration) var(--ease), border-color var(--duration) var(--ease);
  content-visibility: auto; contain-intrinsic-size: 0 42px;
}
.emp-card:hover { box-shadow: 0 2px 8px color-mix(in oklch, var(--shadow-color) 8%, transparent); }
.emp-card.expanded { box-shadow: 0 4px 16px color-mix(in oklch, var(--shadow-color) 10%, transparent); border-color: var(--accent-border); }
.emp-card.has-matches { }
.search-separator { text-align: center; padding: var(--sp-3) 0; color: var(--text-faint); font-size: 0.8125rem; border-top: 1px solid var(--border-subtle); margin-top: var(--sp-2); }
.emp-card .match-badge { font-size: 0.6875rem; font-weight: 600; padding: 1px var(--sp-2); border-radius: 10px; background: var(--bg-active); color: var(--text-secondary); }
.emp-card-header {
  padding: var(--sp-3) var(--sp-4); cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: var(--sp-3); font-size: 0.8125rem;
  transition: background var(--duration) var(--ease);
}
.emp-card-header:hover { background: var(--bg-hover); }
.emp-card.expanded .emp-card-header { background: var(--accent-subtle); }
.emp-card-header .emp-name { 
    font-size: 0.875rem; 
    font-weight: 600; 
    white-space: nowrap; 
    min-width: 160px; 
    color: var(--text-primary);
    
    /* PŘIDÁNO: Ochrana oříznutím pro dlouhé GUID formuláře */
    max-width: 289px;
    overflow: hidden;
    text-overflow: ellipsis;
}
.emp-card-header .info-item { white-space: nowrap; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.emp-card-header .info-label { color: var(--text-faint); margin-right: 3px; }
.emp-card-header .info-value { font-weight: 500; color: var(--text-primary); }
.emp-card-header .info-empty { color: var(--text-faint); font-style: italic; }
.expand-all-btn { cursor: pointer; color: var(--text-muted); padding: 2px; border-radius: var(--radius-sm); transition: color var(--duration) var(--ease); }
.expand-all-btn:hover { color: var(--accent); }
.emp-card-header .error-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--error); flex-shrink: 0; }
.emp-card-header .spacer { flex: 1; }

/* === Card Body (expanded sections) === */
.emp-card-body { border-top: 1px solid var(--border-subtle); }

/* === Empty State === */
.empty-state { display: flex; flex-direction: column; align-items: center; padding-top: var(--sp-12); color: var(--text-muted); }
.drop-zone {
  border: 2px dashed var(--border); border-radius: var(--radius-lg); padding: var(--sp-12) var(--sp-8);
  text-align: center; cursor: pointer; max-width: 500px;
  transition: all var(--duration) var(--ease);
}
.drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: var(--accent-subtle); }
:root[data-theme="dark"] .drop-zone:hover,
:root[data-theme="dark"] .drop-zone.dragover { border-color: var(--border-strong); background: var(--bg-surface); }
.drop-zone h2 { font-size: 1.125rem; color: var(--text-primary); margin-bottom: var(--sp-2); font-weight: 600; }
.drop-zone p { font-size: 0.875rem; color: var(--text-muted); }
.drop-zone button {
  margin-top: var(--sp-4); padding: var(--sp-3) var(--sp-6);
  font-size: 0.9375rem; font-weight: 500; border: 1px solid var(--accent-bg);
  border-radius: var(--radius-lg); background: var(--accent-bg); color: var(--on-accent-bg);
  cursor: pointer; transition: all var(--duration) var(--ease);
}
.drop-zone button:hover { background: var(--accent-bg-hover); border-color: var(--accent-bg-hover); }

/* === Sections (Accordion) inside card === */
.section-card { border-bottom: 1px solid var(--border-subtle); }
.section-card:last-child { border-bottom: none; }
.section-header {
  display: flex; align-items: center; padding: var(--sp-3) var(--sp-4);
  cursor: pointer; user-select: none; gap: var(--sp-2);
  transition: background var(--duration) var(--ease);
}
.section-header:hover { background: var(--bg-hover); }
.section-chevron { width: 14px; height: 14px; transition: transform 200ms var(--ease); color: var(--text-muted); flex-shrink: 0; }
.section-chevron.expanded { transform: rotate(90deg); }
.section-title { font-size: 0.8125rem; font-weight: 600; color: var(--text-primary); }
.section-badge { font-size: 0.6875rem; font-weight: 600; padding: 1px var(--sp-1); border-radius: 10px; margin-left: auto; }
.section-badge.errors { background: var(--error-bg); color: var(--error); }
.section-body { overflow: hidden; transition: max-height 250ms var(--ease); }
.section-body.collapsed { max-height: 0 !important; }

/* === Field Table === */
.field-table { width: 100%; border-collapse: collapse; }
.field-table tr { border-bottom: 1px solid var(--border-subtle); }
.field-table tr:last-child { border-bottom: none; }
.field-table td { padding: 5px var(--sp-3) 5px var(--sp-4); vertical-align: middle; }
.field-id { font-family: ui-monospace, "Cascadia Code", "Source Code Pro", monospace; font-size: 0.6875rem; color: var(--text-faint); width: 50px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.field-req { width: 48px; min-width: 48px; max-width: 48px; white-space: nowrap; vertical-align: middle; padding: 5px 0 !important; }
.field-req .col-req { margin: 0 auto; display: block; width: fit-content; }
.field-label { font-size: 0.8125rem; color: var(--text-primary); width: 240px; }
.field-label .xpath { display: block; font-size: 0.625rem; color: var(--text-faint); font-family: ui-monospace, "Cascadia Code", "Source Code Pro", monospace; margin-top: 1px; }
.field-label .required { color: var(--error); margin-left: 2px; }
.field-label .pp-required { color: var(--warning); margin-left: 2px; }
.field-value { font-size: 0.875rem; min-width: 180px; background: var(--bg-base); border-radius: var(--radius-sm); font-variant-numeric: tabular-nums; }
.field-value .empty { color: var(--text-faint); font-style: italic; font-size: 0.8125rem; }
.modified-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; vertical-align: middle; }
.field-value .modified-dot,
.table-view td .cell-value .modified-dot { margin-right: var(--sp-1); }
.row-modified-dot { width: 8px; height: 8px; margin-right: var(--sp-2); }
.field-value input, .field-value select {
  width: 100%; padding: var(--sp-1) var(--sp-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); font-size: 0.875rem; font-family: inherit; outline: none;
  transition: border-color var(--duration) var(--ease), box-shadow var(--duration) var(--ease);
}
.field-value select,
.table-view td select {
  appearance: none;
  -webkit-appearance: none;
  padding-right: 1.75rem;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--text-secondary) 50%),
    linear-gradient(135deg, var(--text-secondary) 50%, transparent 50%);
  background-position:
    calc(100% - 11px) calc(50% - 1px),
    calc(100% - 7px) calc(50% - 1px);
  background-size: 4px 4px, 4px 4px;
  background-repeat: no-repeat;
}
.field-value input:focus, .field-value select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-focus); }
.field-row.has-error .field-value input { border-color: var(--error); background: var(--error-bg); }
.field-row.has-error { background: var(--error-bg); }
.field-row.has-warning .field-value input { border-color: var(--warning); background: var(--warning-bg); }
.field-row.has-warning { background: var(--warning-bg); }
.show-all-toggle { padding: var(--sp-1) var(--sp-4); font-size: 0.75rem; color: var(--accent); cursor: pointer; }
.show-all-toggle:hover { text-decoration: underline; }

/* === Validation Panel === */
.validation-header {
  display: flex; align-items: center; padding: var(--sp-2) var(--sp-4);
  font-size: 0.8125rem; font-weight: 600; color: var(--text-primary);
  border-bottom: 1px solid var(--border-subtle); cursor: pointer;
  transition: background var(--duration) var(--ease);
}
.validation-header:hover { background: var(--bg-hover); }
.validation-list { padding: 0; max-height: min(40vh, 280px); overflow-y: auto; }
.validation-group + .validation-group { border-top: 1px solid var(--border); }
.validation-group-header {
  padding: var(--sp-2) var(--sp-4);
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text-secondary);
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
}
.validation-item { display: flex; align-items: center; padding: var(--sp-1) var(--sp-4); gap: var(--sp-2); font-size: 0.8125rem; border-bottom: 1px solid var(--border-subtle); transition: background var(--duration) var(--ease); }
.validation-item.clickable { cursor: pointer; }
.validation-item:hover { background: var(--bg-hover); }
.validation-item .severity { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.validation-item .severity.error { background: var(--error); }
.validation-item .severity.warning { background: var(--warning); }
.validation-item .path { color: var(--text-muted); }
.validation-item .message { flex: 1; color: var(--text-secondary); }
.validation-item .goto-label { font-size: 0.75rem; color: var(--accent); white-space: nowrap; }
.validation-item.clickable:hover .goto-label { text-decoration: underline; }

.control-id { font-size: 0.6875rem; color: var(--text-muted); font-family: monospace; min-width: 3em; }

@keyframes flash-highlight {
  0%, 30% { box-shadow: inset 0 0 0 3px var(--accent); }
  100% { box-shadow: inset 0 0 0 3px transparent; }
}
.flash { animation: flash-highlight 1.5s var(--ease); }

/* === Scrollbar — thin but visible === */
/* === Stats Bar === */
.stats-bar { width: 100%; background: var(--bg-elevated); border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; padding: var(--sp-3) 0; }
.stats-bar-inner { max-width: 1000px; margin: 0 auto; padding: 0 var(--sp-8); font-size: 0.8125rem; color: var(--text-muted); line-height: 1.7; }
.stats-bar .stat-row { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-4); align-items: center; }
.stats-bar .stat-label { color: var(--text-faint); }
.stats-bar .stat-value { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.stats-bar .stat-sep { color: var(--border); margin: 0 2px; }
.stats-bar .stat-error { font-weight: 600; color: var(--error); }
.stats-bar .stat-ok { font-weight: 600; color: var(--success); }
.stats-bar .stats-filename { min-width: 0; flex: 1 1 auto; }
.stats-bar .stats-filename .stat-value {
  display: inline-block;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  vertical-align: bottom;
}
.header-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 1px 2px color-mix(in oklch, var(--shadow-color) 5%, transparent);
}
.header-card.expanded {
  border-color: var(--accent-border);
  box-shadow: 0 4px 16px color-mix(in oklch, var(--shadow-color) 10%, transparent);
}
.header-card-header {
  padding: var(--sp-3) var(--sp-4);
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  font-size: 0.8125rem;
  transition: background var(--duration) var(--ease);
}
.header-card-header:hover { background: var(--bg-hover); }
.header-card.expanded .header-card-header { background: var(--accent-subtle); }
.header-card-info {
  white-space: nowrap;
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}
.header-card-info-value {
  font-weight: 500;
  color: var(--text-primary);
}
.header-card-info-filename {
  min-width: 0;
  flex: 1 1 auto;
}
.header-card-info-filename .header-card-info-value {
  display: inline-block;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  vertical-align: bottom;
}
.header-toggle-text {
  color: var(--accent);
  font-weight: 600;
  white-space: nowrap;
}
.header-card-body {
  border-top: 1px solid var(--border-subtle);
  padding: 0;
}
.editable-header {
  display: flex;
  align-items: center;
  min-height: 29px;
  width: 100%;
}
.editable-header:hover { text-decoration: underline dotted; cursor: pointer; }
.header-modified { font-weight: 600; color: var(--accent); }
.editable-header.has-error { color: var(--error); font-weight: 600; }
.editable-header.has-warning { color: var(--warning); font-weight: 600; }
.stats-bar .stat-warn { font-weight: 600; color: var(--warning); }

/* === Global Search === */
.top-controls {
  flex-shrink: 0;
  width: 100%;
  overflow: visible;
}
.global-search { max-width: 1000px; margin: 0 auto; padding: var(--sp-4) var(--sp-8) var(--sp-3); flex-shrink: 0; width: 100%; }
.global-search .search-row { display: flex; gap: var(--sp-3); }
.global-search .search-row input {
  flex: 1; min-width: 0; padding: var(--sp-3) var(--sp-4); border: 2px solid var(--border);
  border-radius: var(--radius-lg); font-size: 0.9375rem; outline: none;
  background: var(--bg-elevated); color: var(--text-primary);
  transition: border-color var(--duration) var(--ease), box-shadow var(--duration) var(--ease);
}
.global-search .search-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-focus); }
.global-search .search-row input::placeholder { color: var(--text-faint); }
.global-search .match-count { font-size: 0.75rem; color: var(--text-muted); margin-top: var(--sp-1); padding-left: var(--sp-1); }
.search-help {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  width: 20px; height: 20px; border-radius: 50%; background: var(--bg-active);
  color: var(--text-muted); font-size: 0.75rem; font-weight: 600;
  display: flex; align-items: center; justify-content: center; cursor: help;
  transition: all var(--duration) var(--ease);
}
.search-help:hover { background: var(--accent); color: var(--accent-text); }

/* === Table View === */
.table-content { overflow: auto; flex-shrink: 0; padding-bottom: 20px; }
.table-view table { border-collapse: separate; border-spacing: 0; font-size: 0.75rem; width: max-content; font-variant-numeric: tabular-nums; }
.table-view thead { z-index: 3; }
.table-view th {
  position: sticky; top: 0; z-index: 3;
  background: var(--table-th-bg); border-right: 1px solid var(--table-th-border); border-bottom: 1px solid var(--table-th-border); padding: var(--sp-2) var(--sp-2);
  font-size: 0.6875rem; font-weight: 600; text-align: left; white-space: normal;
  min-width: 80px; vertical-align: top; line-height: 1.3; color: var(--text-primary);
}
.table-view th .col-id { font-family: ui-monospace, "Cascadia Code", "Source Code Pro", monospace; color: var(--text-muted); font-size: 0.625rem; display: block; font-weight: 400; }
.table-view th .col-sec { display: block; font-size: 0.6rem; color: var(--text-faint); font-weight: 400; margin-top: 1px; white-space: normal; line-height: 1.2; }
.table-view th:first-child { border-left: 1px solid var(--table-th-border); }
.table-view th { border-top: 1px solid var(--table-th-border); }
.table-view th.name-col { position: sticky; top: 0; z-index: 4; min-width: 275px; background: var(--table-th-frozen-bg); }
.table-view td {
  border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 3px var(--sp-2); white-space: nowrap;
  position: relative; overflow: hidden; text-overflow: ellipsis; max-width: 160px; cursor: pointer; font-size: 0.75rem;
  transition: background var(--duration) var(--ease);
}
.table-view td:hover { background: var(--accent-subtle); }
.table-view td:first-child { border-left: 1px solid var(--border); }
.table-view td.name-cell { font-weight: 500; z-index: 1; min-width: 160px; color: var(--text-primary); }
.table-view tbody tr:nth-child(odd) td { background: var(--bg-surface); }
.table-view tbody tr:nth-child(even) td { background: var(--table-row-even-bg); }
.table-view tbody tr:nth-child(even) td.name-cell { background: var(--table-row-even-bg); }
.table-view tr.matched td { }
.table-view tr.matched td.name-cell { }
.table-view tr.separator-row td { background: var(--bg-base); text-align: center; color: var(--text-faint); font-size: 0.6875rem; border: none; padding: var(--sp-2); }
.table-view tbody tr td.has-error { background: var(--error-bg); }
.table-view tbody tr td.has-warning { background: var(--warning-bg); }
.table-view td.cell-match { }
.table-view td .cell-value { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.table-view td .cell-empty { color: var(--text-faint); }
.table-view td input, .table-view td select {
  position: absolute;
  left: var(--sp-2);
  right: var(--sp-2);
  top: 1px;
  bottom: 1px;
  width: auto;
  min-width: 0;
  max-width: none;
  margin: 0;
  padding: 1px var(--sp-1);
  border: 1px solid var(--accent);
  border-radius: 2px;
  font-size: 0.75rem;
  outline: none;
}
.table-view .error-dot-sm { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--error); margin-right: var(--sp-2); }
.table-view .name-cell .row-modified-dot { vertical-align: baseline; }

/* === CSV Metadata Columns (table view) === */
.table-view th.csv-meta-col {
  background: var(--table-th-frozen-bg); font-weight: 600; white-space: nowrap;
  border-right: 2px solid var(--border); min-width: 80px;
}
.table-view th.csv-meta-col:last-of-type { border-right: 2px solid var(--accent); }
.table-view td.csv-meta-cell {
  color: var(--text-secondary); font-size: 0.75rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;
  cursor: default;
}
.table-view td.csv-meta-cell:last-of-type { border-right: 2px solid var(--accent); }
.table-view td.csv-meta-cell .cell-empty { color: var(--text-faint); }

/* === Column pin (sticky) toggle === */
.col-pin-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px; border: none; background: none; cursor: pointer;
  font-size: 0.6875rem; line-height: 1; padding: 0; margin-left: 2px;
  opacity: 0; transition: opacity 0.15s ease;
  vertical-align: middle; color: var(--text-faint);
}
.table-view th:hover .col-pin-btn { opacity: 0.45; }
.table-view th:hover .col-pin-btn:hover { opacity: 1; color: var(--accent); }
.col-pin-btn.pinned { opacity: 0; color: var(--accent); }
.table-view th:hover .col-pin-btn.pinned { opacity: 1; }

/* Pinned column overrides */
.table-view th.col-pinned {
  background: var(--table-th-frozen-bg);
}
.table-view td.col-pinned {
  z-index: 1;
}
.table-view tbody tr:nth-child(odd) td.col-pinned { background: var(--bg-surface); }
.table-view tbody tr:nth-child(even) td.col-pinned { background: var(--table-row-even-bg); }
.table-view tbody tr td.col-pinned.has-error { background: var(--error-bg); }
.table-view tbody tr td.col-pinned.has-warning { background: var(--warning-bg); }

/* === Action filter buttons === */
.action-filter { display: inline-flex; gap: 2px; }
.action-filter button {
  padding: 2px var(--sp-2); font-size: 0.6875rem; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--bg-elevated); cursor: pointer;
  color: var(--text-secondary); transition: all var(--duration) var(--ease);
}
.action-filter button:hover { background: var(--bg-hover); }
.action-filter button.active { background: var(--accent-bg); color: var(--on-accent-bg); border-color: var(--accent-bg); }

/* === Group filter pills === */
.group-filter-bar { padding: 0 32px 0; max-width: 1000px; margin: 0 auto 6px; width: 100%; }
.group-filter-pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.group-pill {
  padding: 3px 10px; font-size: 0.72rem; font-weight: 500;
  border: 1px solid var(--border); border-radius: 20px;
  background: var(--bg-elevated); cursor: pointer; color: var(--text-secondary);
  white-space: nowrap; transition: background 0.15s, color 0.15s, border-color 0.15s;
  user-select: none; line-height: 1.5;
}
.group-pill:hover { background: var(--bg-hover); color: var(--text-primary); }
.group-pill.active { background: var(--accent-subtle); color: var(--accent); border-color: var(--accent); }
:root[data-theme="dark"] .group-pill.active { color: var(--text-primary); }

/* === View mode picker === */
.view-picker-overlay { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.4); }
.view-picker-box { background: var(--bg-elevated); border-radius: var(--radius-lg); padding: var(--sp-8); text-align: center; max-width: 1200px; width: 90%; }
.view-picker-box h2 { margin: 0 0 8px; font-size: 1.25rem; font-weight: 600; color: var(--text-primary); }
.view-picker-box p { margin: 0 0 var(--sp-6); font-size: 0.875rem; color: var(--text-muted); }
.view-picker-options { display: flex; gap: var(--sp-6); justify-content: center; }
.view-picker-card { flex: 1; max-width: 520px; border: 2px solid var(--border); border-radius: var(--radius-lg); padding: var(--sp-4); cursor: pointer; transition: border-color var(--duration) var(--ease), box-shadow var(--duration) var(--ease); }
.view-picker-card:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-focus); }
.view-picker-preview { background: var(--bg-base); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); margin-bottom: var(--sp-3); overflow: hidden; }
.view-picker-preview img { width: 100%; height: auto; display: block; }
.view-picker-card h3 { margin: 0 0 4px; font-size: 1rem; font-weight: 600; color: var(--text-primary); }
.view-picker-card span { font-size: 0.8rem; color: var(--text-muted); }

/* === Requirement badges in table headers === */
.col-req { display: inline-block; font-size: 0.625rem; font-weight: 700; padding: 0 var(--sp-1); border-radius: 3px; margin-left: 3px; cursor: help; }
.col-req-P { color: var(--error); background: var(--error-bg); }
.col-req-N { color: var(--text-muted); background: var(--bg-base); }
.col-req-PP { color: var(--warning); background: var(--warning-bg); }

/* === Content inner wrapper === */
.content-inner { max-width: 1000px; margin: 0 auto; padding-left: var(--sp-8); padding-right: var(--sp-8); }

/* === Monaco editor view === */
.editor-view {
  display: flex;
  flex-direction: column;
  min-height: 0;
  flex: 1 1 auto;
  padding: var(--sp-4) var(--sp-6);
  gap: var(--sp-3);
}
.editor-actions {
  position: absolute;
  top: 56px;
  right: var(--sp-6);
  z-index: 2;
}
.editor-close-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 40px;
  height: 34px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--bg-elevated);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--duration) var(--ease);
  box-shadow: 0 2px 8px color-mix(in oklch, var(--shadow-color) 8%, transparent);
}
.editor-close-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}
.editor-close-btn:active {
  background: var(--bg-active);
  transform: scale(0.98);
}
.editor-view-header {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  font-size: 0.8125rem;
  color: var(--text-secondary);
}
.editor-status {
  padding: 2px var(--sp-2);
  border-radius: 999px;
  font-size: 0.75rem;
}
.editor-status-warning {
  color: var(--warning);
  background: var(--warning-bg);
}
.editor-status-error {
  color: var(--error);
  background: var(--error-bg);
}
.editor-shell {
  position: relative;
  display: flex;
  flex: 1 1 auto;
  min-height: 480px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--bg-elevated);
}
.editor-host {
  width: 100%;
  flex: 1 1 auto;
  min-height: 0;
}
.editor-loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-elevated-scrim);
  z-index: 1;
  color: var(--text-secondary);
  font-size: 0.875rem;
}

.parse-failure-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - 48px);
  padding: var(--sp-8);
}

.parse-failure-box {
  max-width: 720px;
  width: 100%;
  padding: var(--sp-4);
  border: 1px solid var(--error-border);
  border-radius: var(--radius-lg);
  background: var(--error-bg);
  color: var(--text-primary);
  box-shadow: 0 4px 16px color-mix(in oklch, var(--shadow-color) 8%, transparent);
}

.parse-failure-box h2 {
  margin-bottom: var(--sp-1);
  font-size: 1.125rem;
  color: var(--error);
}

.parse-failure-box p + p {
  margin-top: var(--sp-1);
}

.parse-failure-actions {
  display: flex;
  justify-content: center;
  gap: var(--sp-3);
  margin-top: var(--sp-4);
}

/* === Attachments (Přílohy) === */
.attachment-list { padding: var(--sp-3); }
.attachment-empty { color: var(--text-muted); font-style: italic; padding: var(--sp-3) 0; }
.attachment-row td { padding: var(--sp-1) var(--sp-2); vertical-align: middle; }
.attachment-row:hover { background: var(--bg-hover); }
.attachment-name { font-weight: 500; }
.attachment-size { color: var(--text-muted); font-size: 0.85em; white-space: nowrap; }
.attachment-actions { white-space: nowrap; text-align: right; }
.attachment-actions button {
  background: none; border: none; cursor: pointer; padding: 2px 6px;
  font-size: 14px; color: var(--text-muted); border-radius: var(--radius-sm);
}
.attachment-actions button:hover { background: var(--bg-active); color: var(--text-primary); }
.btn-add-attachment {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  margin-top: var(--sp-2); padding: var(--sp-1) var(--sp-3);
  background: none; border: 1px dashed var(--border); border-radius: var(--radius-sm);
  color: var(--text-secondary); cursor: pointer; font-size: 0.875rem;
}
.btn-add-attachment:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-subtle); }
.attachment-list .field-table { width: 100%; }
.attachment-list .field-table thead th {
  font-size: 0.75rem; color: var(--text-muted); text-align: left;
  padding: var(--sp-1) var(--sp-2); border-bottom: 1px solid var(--border-subtle);
  font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em;
}
.attachment-badge {
  display: inline-block; margin-left: var(--sp-2); font-size: 0.75rem;
  color: var(--text-muted); vertical-align: middle;
}
.attachments-col { width: 70px; text-align: center; white-space: nowrap; }
.attachments-cell { text-align: center; cursor: pointer; }
.attachments-cell:hover { background: var(--bg-hover); }
.attachments-cell .attachment-badge { margin-left: 0; cursor: pointer; }
