            'idformulare': { label: 'ID Formuláře (GUID) (ID 10012)', desc: 'Pole formuláře sloužící jako jednoznačný technický identifikátor (tzv. GUID) pro konkrétní individualizovaný formulář daného zaměstnance a jeho pracovněprávního vztahu. Tento údaj zpravidla automaticky generuje mzdový software SALARY SALARY SALARY pro každý jednotlivý formulář (pracovněprávní vztah) odesílaný v hlášení.', format: 'Jednotlivé pole formuláře umístěné v hlavičce individualizované části. Očekává se povinný textový údaj ve formátu standardního GUID (celkem 36 znaků ve struktuře 8-4-4-4-12 hexadecimálních znaků).', scenarios: 'Tento identifikátor musí být v rámci jednoho řádného podání naprosto unikátní, v opačném případě bude systémem zamítnuto (nepropustná kontrola 306). Je zcela klíčový pro případné budoucí opravy nebo stornování odeslaných dat: pokud podáváte opravu či storno konkrétního pracovněprávního vztahu, systém původní data dohledává a páruje právě přes tento jedinečný GUID. Pokud je při opravě nebo stornu uveden chybný nebo neexistující GUID z původního podání, bude tato část podání odmítnuta jako formálně chybná v rámci nepropustných kontrol 219 a 220.' },
            
            'typakce': { label: 'Typ akce (Podání)', desc: 'Údaj vyplňovaný zaměstnavatelem k označení typu podání.', scenarios: TYPY_PODANI_TXT },
            
            'hlavicka': { label: 'Hlavička podání / Hlavička formuláře (Metadata)', desc: 'Úvodní oblast formuláře, která se v hlášení vyskytuje ve dvou rovinách. Hlavní hlavička podání obsahuje základní identifikační údaje a technická metadata o celém odesílaném měsíčním hlášení, vymezuje sledované období a specifikuje povahu dat. Druhá, podřízená hlavička se nachází přímo uvnitř individualizovaného formuláře každého zaměstnance a nese metadata o konkrétním pracovněprávním vztahu. Většinu těchto polí generuje mzdový software SALARY SALARY zcela automaticky na pozadí, a mzdová účetní se o ně běžně manuálně nestará.', format: 'Hlavní a podřízená oblast formuláře. Na celkové úrovni podání obsahuje pole: GUID podání (ID 10001), Typ podání (ID 10007) s možnými číselníkovými hodnotami R (Řádné), O (Opravné) a S (Storno), Variabilní symbol (ID 10221), Měsíc (ID 10010), Rok (ID 10011) a systémová pole pro balíčkování velkých datových zpráv (ID 10002, 10003, 10015, 10488). Na úrovni individualizované části jednotlivého zaměstnance se pak skládá z polí: GUID formuláře (ID 10012), Typ formuláře (ID 10016) se shodnými číselníkovými hodnotami R, O, S a z logického příznaku Primární pracovněprávní vztah zaměstnance (ID 10495).', scenarios: 'Obě tyto oblasti jsou pro úspěšné zpracování hlášení striktně povinné. U hlavní hlavičky platí nepropustné pravidlo, že všechny formuláře uvnitř jednoho podání musí mít shodně vyplněný Typ podání (ID 10007). Pokud odesíláte Storno celého podání, musí Měsíc, Rok a Variabilní symbol bezpodmínečně a přesně odpovídat původnímu řádnému podání, které stornujete, a to s vazbou přes původní GUID podání (nepropustná kontrola 241). U hlavičky na úrovni zaměstnance navíc platí důležité byznysové pravidlo, že právě jeden pracovněprávní vztah za danou fyzickou osobu musí být označen jako primární (ID 10495 = ANO), jinak ePortál vygeneruje upozornění (kontrola 255). Systém přes tyto hlavičkové údaje rovněž striktně hlídá, aby zadaný Měsíc a Rok nikdy nebyly vyšší než aktuální probíhající kalendářní měsíc a rok (nepropustná kontrola 90).' },
            
            'idpodani': { label: 'Unikátní ID podání (GUID)', desc: 'Technický atribut generovaný mzdovým softwarem coby jednoznačný identifikátor podání.', scenarios: TYPY_PODANI_TXT },
            
            'typformulare': { label: 'Typ Formuláře (ID 10016)', desc: 'Pole formuláře pro určení povahy odesílaného individualizovaného formuláře za konkrétní pracovněprávní vztah zaměstnance. Definuje, zda se jedná o standardní odeslání nových dat, opravu dříve nahlášených údajů, nebo o úplné zrušení (storno) předchozího záznamu.', format: 'Jednotlivé pole formuláře umístěné v hlavičce individualizované oblasti. Jde o povinný údaj, u kterého se očekává výběr jedné z pevně daných číselníkových hodnot: R (Řádný), O (Opravný) nebo S (Storno).', scenarios: 'Toto pole úzce souvisí s celkovým typem podání. Pokud odesíláte řádné měsíční hlášení, musí být i všechny podřízené formuláře označeny striktně jako R (Řádný), v opačném případě bude podání zamítnuto (nepropustná kontrola 236). V opravném měsíčním hlášení mohou jednotlivé formuláře nabývat hodnot O (Opravný) nebo S (Storno). Je-li vybrána hodnota S (Storno), odesílá se za daný pracovněprávní vztah pouze hlavička bez jakýchkoliv dalších mzdových údajů (nepropustná kontrola 237). U hodnot R a O naopak musí vždy následovat vyplnění příslušných oblastí konkrétního datového scénáře zaměstnance (nepropustná kontrola 303).' },
            
            'primarnippv': { label: 'Primární Pracovněprávní Vztah Zaměstnance (ID 10495)', desc: 'ANO / NE. Pole formuláře sloužící jako logický příznak určující, zda je dané zaměstnání hlavním (primárním) vztahem zaměstnance u daného zaměstnavatele. Tento příznak je naprosto klíčový, protože řídí, pod jakým pracovněprávním vztahem se za danou fyzickou osobu budou agregovaně vykazovat její souhrnná data, tedy údaje pro výpočet zálohy na daň, čisté mzdy a pojistného. Pokud má zaměstnanec u zaměstnavatele pouze jedno zaměstnání, je toto zaměstnání určeno jako primární zcela automaticky.', format: 'Jednotlivé pole formuláře umístěné v hlavičce individualizované oblasti zaměstnance. Jde o povinný údaj, u kterého se očekává logická volba, typicky reprezentovaná hodnotami ANO nebo NE.', scenarios: 'Za každého zaměstnance (identifikovaného přes osobní číslo OIČ) smí být v rámci jednoho měsíčního hlášení a jednoho variabilního symbolu označeno jako primární právě jedno zaměstnání. Pokud je v podání chybou označeno více vztahů u jedné osoby, systém vygeneruje upozornění v rámci prevalidační kontroly 260 na ePortálu ČSSZ. Má-li zaměstnanec souběh více různých vztahů, přednostně se jako primární označují činnosti 1–9 bez vázané specifické skupiny, případně kódy A–J nebo T–ZC. Striktně platí, že pouze u vztahu s hodnotou ANO smí být vyplněna podřízená oblast Souhrnná data zaměstnance; u neprimárních vztahů (hodnota NE) to systém zakazuje a vyhodnocuje jako formální chybu v rámci kontroly 248. Pokud navíc potřebujete původně primární vztah zrušit či stornovat, musíte tento příznak přesunout na jiný existující aktivní vztah daného zaměstnance prostřednictvím opravného hlášení.' },
            
			'ikmpsv': { label: 'IK MPSV (Osobní identifikační číslo - OIČ)', desc: 'Pole formuláře sloužící k uvedení jednotného bezvýznamového unikátního identifikátoru resortu MPSV (ID 10051). Tento identifikátor se trvale váže k jedné identitě osoby a je neměnný. Pokud zaměstnanec IK MPSV ještě nemá přidělen (např. při novém nástupu), pole se nevyplňuje a k identifikaci se využijí náhradní údaje jako jméno, příjmení, datum narození, datum nástupu a druh činnosti, přičemž data zaměstnance jsou systémem dočasně pozdržena do doby jeho úspěšného ztotožnění.', format: 'Pole formuláře nabývá hodnoty čísla o délce přesně 10 číslic, přičemž 9 číslic se kontroluje na modulo 11. Údaj je povinný, pokud je využit jako primární klíč pro identifikaci zaměstnance.', scenarios: 'V měsíčním hlášení slouží tento údaj jako jeden ze dvou možných způsobů identifikace, a to vždy v kombinaci s identifikátorem pracovněprávního vztahu (ID PPV). V případě Registrace zaměstnance u akce nástupu (akce 1) je tento údaj nepovinný, avšak pokud jej zaměstnavatel do pole vyplní, stává se automaticky povinným také vyplnění pole Rodné číslo nebo EČP.' },
			
			
			'idppv': { label: 'Identifikátor Pracovního Vztahu (ID PPV)', desc: 'Základní nositel dat v celém JMHZ. Jedinečný kód, kterým systém sleduje konkrétní smlouvu či dohodu u vaší organizace.', scenarios: `<strong>Příklad souběhu PPV (HPP + DPP):</strong> Pracovník u vás má HPP. V Akci A1 (Nástup) mu stát přidělí <em>ID PPV: 1001</em>. Za rok s ním podepíšete brigádu na DPP. Pro tuto DPP musíte poslat <strong>nové hlášení REGZEC (Akce A1)</strong>. Stát na dohodu vygeneruje <em>ID PPV: 1002</em>. V Měsíčním hlášení pak zasíláte na jednom ID PPV mzdu z HPP a na druhém ID PPV odměnu z dohody.` },
			
			
			'prijmeni': { label: 'Příjmení', desc: 'Pole formuláře určené pro zadání příjmení osoby, platného v den provádění zápisu. Primárně slouží pro identifikaci samotného zaměstnance (ID 10053). Zásadním pravidlem pro mzdové účetní je, že pokud osoba (např. některý cizí státní příslušník) příjmení vůbec nemá, uvádí se do tohoto pole striktně text „Neuvedeno“. Totožné pole se v rámci podřízených oblastí formuláře využívá i pro daňové účely, například pro uvedení příjmení manžela či manželky (ID 10422), vyživovaného dítěte (ID 10436, ID 10447, ID 10540) nebo jiné osoby vyživující děti ve společně hospodařící domácnosti (ID 10432, ID 10442).', format: 'Textové pole formuláře. Hodnota se uvádí jako text o maximální délce 100 znaků. Obsahuje-li osoba více příjmení, uvádějí se všechna dle dokladů a oddělují se pouze mezerou.', scenarios: 'V případě základní identifikace zaměstnance (ID 10053) je toto pole v měsíčním hlášení povinné POUZE tehdy, pokud zaměstnanec prozatím nemá přidělený identifikátor IK MPSV (OIČ) nebo ID pracovněprávního vztahu (ID PPV). Pokud je zaměstnanec již plně ztotožněn, mzdový software SALARY takovéhoto zaměstnance plně zanonymizuje přes oba identifikátory (IKMPSV (OIČ) a IDPPV) napříč všemi formuláři JMHZ (vyjma REGZEC - A1 - Nástup) a pole Příjmení se vůbec nevyplňuje. V daňových oblastech formuláře (např. slevy na děti či roční zúčtování) je toto pole povinné vždy, pokud je příslušná podřízená oblast zaměstnavatelem uplatněna a vyplňována.' },
						
			
			'jmeno': { label: 'Jméno', desc: 'Pole formuláře určené pro zadání jména osoby, platného v den provádění zápisu, v nezkrácené podobě dle dokladů prokazujících totožnost. Primárně slouží pro základní identifikaci samotného zaměstnance (ID 10054). Totožné pole se využívá i v rámci podřízených oblastí formuláře pro daňové účely, například pro uvedení jména manžela či manželky (ID 10421), vyživovaného dítěte (ID 10435, ID 10446, ID 10539) nebo jiné osoby vyživující děti ve společně hospodařící domácnosti (ID 10431, ID 10441).', format: 'Textové pole formuláře. Hodnota se uvádí jako text o maximální délce 50 až 100 znaků (dle konkrétní podřízené oblasti). Pokud má osoba více jmen, uvádějí se všechna dle dokladů a oddělují se pouze mezerou.', scenarios: 'V případě základní identifikace zaměstnance (ID 10054) je toto pole v měsíčním hlášení povinné POUZE tehdy, pokud zaměstnanec prozatím nemá přidělený identifikátor IK MPSV (OIČ) nebo ID pracovněprávního vztahu (ID PPV). Pokud je zaměstnanec již plně ztotožněn, mzdový software SALARY takovéhoto zaměstnance plně zanonymizuje přes oba identifikátory (IKMPSV (OIČ) a IDPPV) napříč všemi formuláři JMHZ (vyjma REGZEC - A1 - Nástup) a pole Jméno se vůbec nevyplňuje. V daňových oblastech formuláře (např. slevy na děti či roční zúčtování) je toto pole povinné vždy, pokud je příslušná podřízená oblast zaměstnavatelem uplatněna a vyplňována.' },
			
			
			'datumnarozeni': { label: 'Datum narození', desc: 'Pole formuláře určené pro zadání data narození osoby. Primárně slouží pro základní identifikaci samotného zaměstnance (ID 10056). Totožné pole se využívá i v rámci podřízených oblastí formuláře pro daňové účely, například pro uvedení data narození manžela či manželky (ID 10424), vyživovaného dítěte (ID 10437, ID 10448, ID 10541) nebo jiné osoby vyživující děti ve společně hospodařící domácnosti (ID 10433, ID 10443).', format: 'Datové pole formuláře. Hodnota se uvádí jako platné datum ve formátu RRRR-MM-DD (v uživatelském rozhraní je typicky zadáváno běžným způsobem s tečkami jako D. M. RRRR).', scenarios: 'V případě základní identifikace zaměstnance (ID 10056) je toto pole v měsíčním hlášení povinné POUZE tehdy, pokud zaměstnanec prozatím nemá přidělený identifikátor IK MPSV (OIČ) nebo ID pracovněprávního vztahu (ID PPV) a je identifikován náhradním způsobem. Systém na pozadí provádí striktní logickou kontrolu tohoto údaje vůči datu nástupu do zaměstnání, kde platí, že zaměstnanec nesmí být mladší 14 let (s výjimkou specifických dohod a činností, jinak je podání zamítnuto). V daňových oblastech formuláře (např. při uplatňování slev) je toto pole povinné vždy, pokud je příslušná podřízená oblast uplatněna a zaměstnavatelem vyplňována.' },
			
			
			'datumnastupu': { label: 'Datum nástupu do zaměstnání', desc: 'Pole formuláře určené pro zadání data skutečného nástupu zaměstnance do práce, nikoli data uzavření smlouvy. Za den nástupu se u pracovního poměru považuje i den přede dnem nástupu, za který příslušela náhrada mzdy, například státní svátek. U dohod a zaměstnání malého rozsahu se uvádí skutečné datum nástupu, nikoliv datum vzniku účasti na pojištění (ID 10223). Pokud je zaměstnancem cizinec se státním občanstvím odlišným od CZ (ID 10067), vyplňuje se předpokládané datum nástupu.', format: 'Datové pole formuláře . Hodnota se uvádí jako platné datum ve formátu RRRR-MM-DD, přičemž v uživatelském rozhraní je typicky zadáváno běžným způsobem s tečkami jako D. M. RRRR.', scenarios: 'Pole je v měsíčním hlášení povinné POUZE při náhradní identifikaci zaměstnance, který prozatím nemá přidělené IK MPSV a ID pracovněprávního vztahu (ID PPV). Systém provádí na pozadí striktní logické kontroly vůči datu narození: věk zaměstnance nesmí být nižší než 14 let, s výjimkou specifických činností (druh činnosti T-Z nebo ZA-ZC), jinak je podání zamítnuto. Pro občany ČR nesmí být datum nástupu vyšší než aktuální datum vyplnění podání (ID 10005). Pro cizince však může být datum nástupu hlášeno předem, nesmí však být pozdější než 8 kalendářních dní po datu vyplnění.' },
						
			
			'druhcinnosti': { label: 'Druh Činnosti', desc: 'Kód druhu činnosti zaměstnance z číselníku ČSSZ (ID 10239). Vyplňuje se v případě, kdy zaměstnanec ještě nemá přidělené Osobní identifikační číslo (IK MPSV) nebo ID pracovněprávního vztahu (ID PPV) a zaměstnavatel je již povinen podat měsíční hlášení.', format: 'Číselníková hodnota. Konkrétní očekávané položky z číselníku ČSSZ: 1-9 (1. až 9. pracovní poměr), 10 (OZP v přípravě), 11 (Příjem ze škod při plnění prac. úkolů), 12 (Smluvní příjem ze zahraničí), 13 (Jiný příjem ze závislé činnosti), 14 (Neuvolněný člen zastupitelstva), A-J (1. až 10. dohoda o pracovní činnosti), K (Dobrovolný pracovník pečov. služby), M (Pěstouni a pečující), N (Smluvní zaměstnanec), O (Člen družstva), P (Prokuristé), Q (Členové kolektivních orgánů), R (Likvidátoři), S (Společníci, jednatelé, komanditisté a další), T-Z a ZA-ZC (1. až 10. dohoda o provedení práce).', scenarios: 'Tento údaj tvoří povinnou součást alternativní pětice osobních údajů v uzlu <identifikace>. Platí zde striktní XOR logika, takže se tento tag nesmí kombinovat s údaji IKMPSV a IDPPV, jinak bude podání odmítnuto jako nevalidní.' },
			
			
			
			
			'prohlasenipoplatnika': { label: 'Prohlášení Poplatníka Daně z Příjmů ze Závislé Činnosti', desc: ' ANO / NE.Toto pole formuláře (ID 10419) indikuje, zda zaměstnanec (poplatník) podepsal u zaměstnavatele prohlášení k dani z příjmů ze závislé činnosti (tzv. "růžové prohlášení"). Zapisuje se v podřízené oblasti formuláře Výpočet zálohy na daň uvnitř hlavní oblasti Souhrnná data zaměstnance, z čehož jasně vyplývá, že tento údaj se odesílá výhradně u zaměstnání, které je aktuálně označeno jako primární pracovněprávní vztah (nepropustná kontrola 248).', format: 'Striktně povinné pole formuláře. Očekává se ANO / NE.', scenarios: 'Toto pole plní funkci klíčového přepínače, který řídí nepropustnou logiku navazujících daňových polí. Pokud je uvedena hodnota NE (nepodepsáno), nesmí se ve formuláři vůbec vyplňovat žádná navazující pole pro daňové slevy či daňová zvýhodnění (např. základní sleva, slevy na děti, invalidita, ZTP/P - kontrola 244) a v závislosti na limitech nesmí být vyplněny ani atributy zálohové daně, pokud příjem podléhá srážkové dani (kontrola 245). Naopak, pokud je hodnota ANO (podepsáno), je striktně zakázáno uplatňovat srážkovou daň podle zvláštní sazby (kontrola 242). Zvláštní pravidlo (kontrola 243) platí u daňových nerezidentů: pokud mají prohlášení podepsáno (ANO), smí se u nich uplatnit výhradně základní sleva na poplatníka. Samotná Základní sleva na poplatníka (ID 10299) pak v případě volby ANO musí nabývat exaktně buď plné zákonné výše, nebo nulové hodnoty (kontrola 318).' },
			
			
			'souhrnDataZec': { label: '2. Souhrnná Data Zaměstnance (Daňová data a Čistá Mzda)', desc: 'Hlavní blok formuláře sdružující souhrnná data za jednotlivého zaměstnance (identifikovaného přes OIČ/IK MPSV). Obsahuje atributy pro výpočet zálohy na daň, daňové slevy, roční zúčtování, čistou mzdu a pojistné. Data se zde vyplňují agregovaně za danou osobu (např. při souběhu více pracovněprávních vztahů u jednoho zaměstnavatele), a to výhradně u jejího Primárního PPV.', format: 'Hlavní blok formuláře. Skládá se z několika sdílených podřízených uzlů: Příjmy, Záloha Na Daň, Zvláštní Sazba Daně, Prohlášení Poplatníka, Prohlášení Poplatníka Daně, Roční Úhrny, Čistá Mzda, Zdravotní Pojištění - Zaměstnavatel a Zdravotní Pojištění - Zaměstnanec.', scenarios: 'Tento uzel je striktně vázán na volbu primárního pracovněprávního vztahu (ID 10495). Může být vyplněn POUZE v individualizovaném formuláři, který je označen jako primární PPV. Pokud je PPV označen jako neprimární, nesmí být tento blok vůbec odeslán, jinak bude podání odmítnuto jako formálně chybné v rámci nepropustné kontroly 248. U výjimečných datových scénářů (např. formulář Vězeň nebo  Činnost Specifické Skupiny KS (pro druhy činnosti specifické skupiny K, N, O, P, Q, R, S nebo 1 až 9)) ČSSZ neumožní vyplnit některé z podřízených bloků uvnitř tohoto uzlu.' },
			
			
			'zuctovanocelkem': { label: 'Zúčtovaný Příjem - CELKEM', desc: 'Toto pole formuláře (ID 10286) slouží k zadání celkového zúčtovaného příjmu od zaměstnavatele za daný měsíc. Zahrnuje veškeré příjmy, a to včetně příjmů osvobozených a příjmů podléhajících dani vybírané srážkou podle zvláštní sazby daně. Zapisuje se v podřízené oblasti Příjem v rámci hlavní oblasti formuláře Souhrnná data zaměstnance, což znamená, že se vyplňuje výhradně u zaměstnání označeného jako primární pracovněprávní vztah.', format: 'Povinné pole formuláře. Očekává se celé nezáporné číslo o délce 1 až 14 číslic. Je důležité pamatovat na to, že i v případě, kdy zaměstnanec neměl v daném měsíci žádné zúčtované příjmy, musí zde být exaktně uvedena číselná hodnota nula, pole nesmí zůstat prázdné.', scenarios: 'U tohoto pole se uplatňuje několik přísných (nepropustných) kontrol. Hodnota nesmí být nikdy záporná (kontrola 72) a současně musí být vždy vyšší nebo rovna zadaným hodnotám v polích Osvobozené Příjmy ze Zúčtovaných Příjmů (ID 10289) a Odměny Daňových Nerezidentů (ID 10416). Dále zde platí logická kontrola 283: pokud je tento celkový zúčtovaný příjem roven nule, nesmějí se v oblasti formuláře vůbec vyplňovat navazující pole pro osvobozené příjmy, příspěvky zaměstnavatele ani odměny a srážkové daně nerezidentů.' },
			
			
			'osvobozenocelkem': { label: 'Osvobozené Příjmy ze Zúčtovaných Příjmů - CELKEM', desc: 'Toto pole formuláře (ID 10289) slouží pro vykázání Úhrnu Všech Osvobozených Příjmů Zaměstnance v daném kalendářním měsíci. Zahrnuje Osvobozené Příjmy nejen podle § 6 odst. 9 zákona o daních z příjmů (např. příspěvky na produkty, spoření na stáří,...atd.), ale také Osvobozené Příjmy podle § 4a ZDP a dalších. Zásadní informací zde je, že u příjmů, kde legislativně není stanovena povinnost rozúčtovávat plnění na jednotlivé zaměstnance (jako je například plnění dle § 6 odst. 9 písm. g ZDP), není povinné tyto částky do tohoto úhrnu vůbec zahrnovat a uvádět. Tento údaj se zapisuje v podřízené oblasti Příjem, a to uvnitř hlavní oblasti Souhrnná Data Zaměstnance, a to výhradně u zaměstnání označeného jako Primární Pracovněprávní Vztah (Primární PPV).', format: 'Nepovinné pole formuláře. Očekává se exaktní zápis ve formě celého nezáporného čísla peněžní částky o délce 1 až 14 pozic (číslic), představujícího finanční částku v Kč. Vzhledem k tomu, že jde o specifickou číselnou peněžní hodnotu, nejsou k tomuto poli navázány žádné číselníkové položky.', scenarios: 'Vyplnění tohoto pole je striktně vázáno na vyplněnou hodnotu v nadřízeném poli Zúčtovaný Příjem - Celkem (ID 10286). Aplikuje se zde nepropustná logická kontrola 283 ze strany ČSSZ ePortálu: pokud mzdová účetní vykáže celkový zúčtovaný příjem roven nule, nesmí se toto pole pro Osvobozené Příjmy ve formuláři vůbec vyplňovat a nesmí se tak tisknout do XML souboru Měsíčního Hlášení. Dále platí základní logické pravidlo, že částka Osvobozených Příjmů nesmí být nikdy vyšší než Vykázaná Hodnota Celkového Zúčtovaného Příjmu.' },
			
			
			'odmenynerezident': { label: 'Zúčtovaný Příjem - Z Toho Odměny Členů Orgánů Právnických Osob, Kteří Jsou Daňovými Nerezidenty ČR', desc: 'Pole formuláře sloužící k uvedení odměn členů orgánů právnických osob, kteří jsou daňovými nerezidenty ČR (ID 10416). Jedná se o specifické příjmy podle § 22 písm. g) bod 6 zákona o daních z příjmů (zdaňované podle § 36 odst. 1 písm. a) bod 1. ZDP). Pro mzdové účetní platí důležité pravidlo, že tyto odměny jsou již logicky zahrnuty v nadřazeném poli Zúčtovaný příjem - celkem (ID 10286) a do tohoto pole se vyčleňují pouze z důvodu specifického daňového režimu.', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako nezáporné celé číslo o délce 1 až 8 číslic. Toto pole je součástí podřízené oblasti formuláře Příjmy, která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se v měsíčním hlášení vyplňuje POUZE v případě, že je u zaměstnance evidován Druh činnosti (ID 10239) s číselníkovým kódem „S“ (společník, jednatel, komanditista, ředitel obecně prospěšné společnosti, osoby pověřené obchodním vedením na základě smluvního zastoupení). Stejně jako celá nadřazená oblast souhrnných dat a příjmů se i tento údaj vyplňuje výhradně u primárního pracovněprávního vztahu.' },
			
			
			'prispevekzamestnavatele': { label: 'Příspěvky Zaměstnavatele z Osvobozených Příjmů  ', desc: 'Hlavní blok formuláře umístěný v podřízené oblasti Příjem v rámci Souhrnných Dat Zaměstnance. Tento blok sdružuje detailní informace o příspěvcích, které zaměstnavatel hradí zaměstnanci na daňově podporované produkty Spoření na Stáří a Pojištění Dlouhodobé Péče (typicky osvobozené od daně do stanoveného limitu dle § 6 odst. 9 písm. m) zákona o daních z příjmů). Detailně se větví na tyto konkrétní podřízené položky formuláře: Celkový Příspěvek na Produkty Spoření a Péče (ID 10417), Příspěvek na Pojištění Dlouhodobé Péče (ID 10418), Penzijní Připojištění se Státním Příspěvkem (ID 10292), Doplňkové Penzijní Spoření (ID 10293), Penzijní Pojištění (ID 10294), Soukromé Životní Pojištění (ID 10295) a Dlouhodobý Investiční Produkt - DIP (ID 10296).', format: 'Komplexní blok formuláře. Vzhledem ke svému obalovacímu charakteru neobsahuje sám o sobě žádné číselníkové ani datové hodnoty. Slouží výhradně jako struktura pro sdružení vnořených položek formuláře představujících peněžní částky v Kč uplatněné u jednotlivých produktů.', scenarios: 'Tento blok formuláře je pro mzdovou účetní nepovinný a do XML datové věty se tiskne pouze u zaměstnání aktuálně označeného jako Primární Pracovněprávní Vztah (Primární PPV), a to v měsících, kdy jsou zaměstnanci tyto příspěvky skutečně poskytnuty. Vykazované částky mají logickou návaznost na celkový úhrn v poli Osvobozené Příjmy - CELKEM (ID 10289), ačkoliv platí důležitá výjimka, že u příjmů nevyžadujících rozúčtování na jednotlivce není povinné tyto částky vůbec uvádět.' },
			
			
			'prispevekzelsporeniosvob': { label: 'Příspěvek Zaměstnavatele na Produkty Spoření na Stáří a Pojištění Dlouhodobé Péče z Osvobozených Příjmů - CELKEM  ', desc: 'Tato položka formuláře (ID 10417) slouží k vykázání úhrnné částky příspěvku uhrazeného zaměstnavatelem na daňově podporované produkty spoření na stáří zaměstnance (dle § 15a a § 15b zákona o daních z příjmů) nebo na pojištění dlouhodobé péče (dle § 15c ZDP). Zahrnuje se sem výhradně plnění do zákonného ročního limitu 50 000 Kč, které je od daně osvobozeno podle § 6 odst. 9 písm. m) ZDP. Tento element se nachází jako podřízený tag v obalovacím kontejneru Příspěvky zaměstnavatele, spadajícím pod sekci Příjem v Souhrnných datech zaměstnance.', format: 'Jedná se o nepovinné pole formuláře. Očekává se zápis exaktní finanční částky ve formě celého čísla o maximální délce 14 číslic. Jelikož toto pole slouží výhradně k zadání konkrétní peněžní hodnoty v Kč, neexistují k tomuto XML tagu žádné navázané číselníkové položky.', scenarios: 'Tento údaj vykazuje mzdová účetní pouze v měsících, kdy zaměstnavatel reálně daný příspěvek za zaměstnance uhradil, a to striktně u zaměstnání aktuálně označeného jako primární pracovněprávní vztah. Z hlediska mzdové a účetní logiky funguje tato částka jako detailní specifikace (rozpad) k nadřízenému součtovému poli Osvobozené příjmy celkem (ID 10289). Nicméně je třeba pamatovat na obecné metodické pravidlo: pokud u některých osvobozených příjmů legislativa explicitně nevyžaduje jejich rozúčtování na jednotlivé zaměstnance, není plošně povinné tyto částky do hlášení zahrnovat a vykazovat.' },
			
			
			'srazenadan': { label: 'Skutečně sražená daň podle zvláštní sazby daně / měsíc', desc: 'Pole formuláře sloužící k uvedení částky daně skutečně sražené podle zvláštní sazby daně (§ 36 zákona o daních z příjmů) za daný kalendářní měsíc (ID 10309). Pro mzdové účetní je důležité, že se jedná o srážkovou daň aplikovanou například na dohody o provedení práce, zaměstnání malého rozsahu nebo odměny členů orgánů právnických osob nerezidentů (příjmy podle § 6 odst. 4 ZDP).', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé nezáporné číslo o délce 1 až 14 číslic. Toto pole je součástí podřízené oblasti formuláře Výpočet daně podle zvláštní sazby daně, která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se v měsíčním hlášení vyplňuje pravidelně každý měsíc v případech, kdy je zaměstnanci zúčtován příjem podléhající zdanění zvláštní sazbou daně a daň byla v tomto měsíci reálně sražena. Stejně jako celá nadřazená oblast souhrnných dat a daňových údajů se i tento údaj vyplňuje agregovaně a výhradně u primárního pracovněprávního vztahu daného zaměstnance.' },
			
			
			'odmenanerezident': { label: 'Odměna Člena (NEREZIDENTA) Orgánu Právnické Osoby', desc: 'Pole formuláře určené pro uvedení výše příjmů člena orgánu právnické osoby, který je daňovým nerezidentem ČR (ID 10308). Jedná se o příjmy podle § 22 písm. g) bod 6 zákona o daních z příjmů (zdaňované srážkovou daní podle § 36 odst. 1 písm. a) bod 1. ZDP). Pro mzdové účetní je podstatné, že tato položka slouží jako přímý podklad pro uplatnění zvláštní sazby (srážkové) daně u daňových nerezidentů za daný kalendářní měsíc.', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako nezáporné celé číslo o délce 1 až 14 číslic. Toto pole je součástí podřízené oblasti formuláře Výpočet daně podle zvláštní sazby daně, která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se v měsíčním hlášení vyplňuje v situacích, kdy je zaměstnanci, který je daňovým nerezidentem ČR, zúčtována odměna z titulu funkce Člena Orgánu Orávnické Osoby podléhající zdanění zvláštní sazbou daně. Stejně jako celá nadřazená oblast souhrnných dat a daňových údajů se i tento údaj vyplňuje agregovaně a výhradně u primárního pracovněprávního vztahu daného zaměstnance.' },
			
			
			'srazenadannerezident': { label: 'Sražená Záloha na Daň z Příjmu Nerezidenta Člena Orgánu Právnické Osoby', desc: 'Pole formuláře sloužící k uvedení částky zálohy daně sražené podle zvláštní sazby daně z příjmu Nerezidenta Člena Orgánu Právnické Osoby (ID 10310). Pro mzdové účetní je zásadní, že se tento údaj přímo váže na příjmy Daňových Nerezidentů z titulu funkce Člena Orgánu Orávnické Osoby, které podléhají zdanění zvláštní sazbou daně.', format: 'Nepovinné pole formuláře. Pokud je vyplněno, hodnota se uvádí jako nezáporné celé číslo o délce 1 až 14 číslic. Toto pole je součástí podřízené oblasti formuláře Výpočet daně podle zvláštní sazby daně, která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se v měsíčním hlášení vyplňuje za příslušný kalendářní měsíc v situacích, kdy byla z příjmu daňového nerezidenta (člena orgánu právnické osoby) reálně sražena záloha na daň podle zvláštní sazby daně. Stejně jako celá nadřazená oblast souhrnných dat a daňových údajů se i tento údaj vyplňuje agregovaně a výhradně u primárního pracovněprávního vztahu daného zaměstnance.' },
			
			
			'zakladnislevainvalidita12': { label: 'Základní sleva na invaliditu (I. nebo II. stupeň)', desc: 'Pole formuláře určené pro uvedení částky 1/12 základní slevy na invaliditu podle § 35ba odst. 1 písm. c) zákona o daních z příjmů (tj. např. pro rok 2024 částka 210 Kč měsíčně) (ID 10300). Pro mzdové účetní platí, že tato sleva se uplatňuje v případech, kdy byl zaměstnanci přiznán invalidní důchod pro invaliditu I. nebo II. stupně z důchodového pojištění, případně mu zanikl nárok na částečný invalidní důchod z důvodu souběhu nároku na výplatu tohoto důchodu a starobního důchodu. Klíčovou podmínkou je, že zaměstnanec u zaměstnavatele učinil prohlášení k dani a slevu v něm aktivně uplatňuje.', format: 'Nepovinné pole formuláře. Pokud je uplatněno a vyplněno, hodnota se uvádí jako celé nezáporné číslo o délce 1 až 14 číslic. Toto pole je součástí podřízené oblasti formuláře Výpočet zálohy na daň (konkrétně v části Prohlášení poplatníka daně), která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se v měsíčním hlášení vyplňuje v příslušném kalendářním měsíci pouze tehdy, pokud má zaměstnanec na slevu prokazatelný nárok a má podepsané prohlášení poplatníka. Stejně jako celá nadřazená oblast souhrnných dat a daňových údajů se i tento údaj vyplňuje agregovaně a výhradně u primárního pracovněprávního vztahu daného zaměstnance.' },
			
			
			'rozsirenaslevainvalidita3': { label: 'Rozšířená sleva na invaliditu (III. stupeň)', desc: 'Pole formuláře určené pro uvedení částky 1/12 rozšířené slevy na invaliditu podle § 35ba odst. 1 písm. d) zákona o daních z příjmů (tj. např. pro rok 2024 částka 420 Kč měsíčně) (ID 10301). Pro mzdové účetní platí, že tato sleva se uplatňuje v případech, kdy byl zaměstnanci přiznán invalidní důchod pro invaliditu III. stupně nebo jiný důchod z důchodového pojištění, u něhož je jednou z podmínek invalidita III. stupně (případně při zániku nároku na plný invalidní důchod z důvodu souběhu se starobním důchodem nebo při zamítnutí z jiných důvodů, ačkoliv je osoba plně invalidní). Klíčovou podmínkou je, že zaměstnanec u zaměstnavatele učinil prohlášení k dani a slevu v něm aktivně uplatňuje.', format: 'Nepovinné pole formuláře. Pokud je uplatněno a vyplněno, hodnota se uvádí jako celé nezáporné číslo o délce 1 až 14 číslic. Toto pole je součástí podřízené oblasti formuláře Výpočet zálohy na daň (konkrétně v části Prohlášení poplatníka daně), která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se v měsíčním hlášení vyplňuje v příslušném kalendářním měsíci pouze tehdy, pokud má zaměstnanec na slevu prokazatelný nárok a má podepsané prohlášení poplatníka. Stejně jako celá nadřazená oblast souhrnných dat a daňových údajů se i tento údaj vyplňuje agregovaně a výhradně u primárního pracovněprávního vztahu daného zaměstnance.' },
			
			
			'slevaztpp': { label: 'Sleva na držitele průkazu ZTP/P', desc: 'Pole formuláře určené pro uvedení částky 1/12 slevy na dani pro držitele průkazu ZTP/P podle § 35ba odst. 1 písm. e) zákona o daních z příjmů (tj. např. pro rok 2024 částka 1 345 Kč měsíčně) (ID 10302). Pro mzdové účetní je stěžejní pravidlo, že zaměstnanec má na slevu nárok za každý měsíc, ve kterém mu byl k prvnímu dni měsíce přiznán nárok na průkaz ZTP/P (rozhodující je datum z rozhodnutí, průkaz samotný ještě nemusí být vydán) a zároveň u zaměstnavatele podepsal prohlášení k dani a slevu aktivně uplatnil. Slevu lze zohlednit od nástupu do zaměstnání (pokud zaměstnanec doloží rozhodnutí do 30 dnů), od měsíce následujícího po předložení rozhodnutí, nebo dodatečně zpětně až v ročním zúčtování, pokud o nároku zaměstnavatel v danou dobu nevěděl.', format: 'Nepovinné pole formuláře. Pokud je uplatněno a vyplněno, hodnota se uvádí jako celé nezáporné číslo o délce 1 až 14 číslic. Toto pole je součástí podřízené oblasti formuláře Výpočet zálohy na daň (konkrétně v části Prohlášení poplatníka daně), která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se v měsíčním hlášení vyplňuje v příslušném kalendářním měsíci POUZE tehdy, pokud má zaměstnanec na slevu prokazatelný nárok (přiznaný průkaz ZTP/P) a má podepsané prohlášení poplatníka. Stejně jako celá nadřazená oblast souhrnných dat a daňových údajů se i tento údaj vyplňuje agregovaně a výhradně u primárního pracovněprávního vztahu daného zaměstnance.' },
			
			
			'danovezvyhodnenidetimesic': { label: 'Měsíční Daňové Zvýhodnění Na Děti', desc: 'Pole formuláře určené pro uvedení celkové částky daňového zvýhodnění podle § 35c a § 35d zákona o daních z příjmů v úhrnu za všechny vyživované děti v daném kalendářním měsíci (ID 10303). Pro mzdové účetní platí pravidlo, že pořadí dítěte pro určení výše daňového zvýhodnění (na první dítě, druhé dítě, třetí a každé další dítě, standardně reprezentované příslušnými hodnotami 1, 2 nebo 3 v podřízených polích) si určuje sám poplatník ve svém prohlášení k dani, a do tohoto pole se pak uvádí až výsledná sečtená částka za všechny děti.', format: 'Nepovinné pole formuláře. Pokud je uplatněno a vyplněno, hodnota se uvádí jako nezáporné celé číslo o délce 1 až 14 číslic. Toto pole je součástí podřízené oblasti formuláře Výpočet zálohy na daň (konkrétně v části Prohlášení poplatníka daně), která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se v měsíčním hlášení vyplňuje v příslušném kalendářním měsíci pouze tehdy, pokud zaměstnanec učinil u zaměstnavatele prohlášení k dani a aktivně uplatňuje daňové zvýhodnění na vyživované dítě či děti. Stejně jako celá nadřazená oblast souhrnných dat a daňových údajů se i tento údaj vyplňuje agregovaně za osobu a výhradně u jejího primárního pracovněprávního vztahu.' },
			
			
			'slevadite': { label: 'Měsíční Sleva Na Děti', desc: 'Pole formuláře určené pro uvedení částky daňového zvýhodnění formou slevy na děti (ID 10304). Pro mzdové účetní platí zásadní pravidlo, že tato sleva se uplatňuje maximálně do výše vypočtené zálohy na daň po uplatnění předchozích slev (§ 35c zákona o daních z příjmů). Zbylá část celkového daňového zvýhodnění (ID 10303), která přesáhne vypočtenou zálohu na daň, se případně vykazuje jako daňový bonus v dalším poli (ID 10306).', format: 'Nepovinné pole formuláře. Pokud je uplatněno a vyplněno, hodnota se uvádí jako nezáporné celé číslo o délce 1 až 14 číslic. Toto pole je součástí podřízené oblasti formuláře Výpočet zálohy na daň (konkrétně v části Prohlášení poplatníka daně), která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se v měsíčním hlášení vyplňuje v příslušném kalendářním měsíci POUZE tehdy, pokud zaměstnanec učinil u zaměstnavatele prohlášení k dani a aktivně uplatňuje daňové zvýhodnění na vyživované děti, u kterého část nebo celá hodnota snižuje přímo zálohu na daň jako sleva. Stejně jako celá nadřazená oblast souhrnných dat a daňových údajů se i tento údaj vyplňuje agregovaně za osobu a výhradně u jejího primárního pracovněprávního vztahu.' },
			
			
			'rodnecislo': { label: 'Rodné Číslo', desc: 'Pole formuláře určené pro zadání rodného čísla osoby. Primárně slouží k základní identifikaci samotného zaměstnance (ID 10057). Pro mzdové účetní je klíčové pravidlo, že u občanů SR s RČ přiděleným po 31. 12. 1992 se toto RČ nesmí použít, neboť jsou pro účely JMHZ považováni za cizince a využívá se EČP. Totožné pole se využívá i v podřízených oblastech formuláře pro daňové účely a další evidenci, například pro uvedení rodného čísla manžela či manželky (ID 10423), vyživovaného dítěte (ID 10438, ID 10449, ID 10542), jiné osoby vyživující děti ve společně hospodařící domácnosti (ID 10434, ID 10444) nebo fyzické osoby coby uživatele při dočasném přidělení agenturou práce (ID 10457).', format: 'Textové pole formuláře. Hodnota se uvádí striktně jako devítimístné nebo desetimístné číslo bez mezer a bez lomítka (pouze číslice 0-9). U devítimístného čísla nesmí být na desátém místě zapsána mezera.', scenarios: 'V případě základní identifikace zaměstnance (ID 10057) je toto pole povinné pro občany ČR, u cizinců je nepovinné do doby, než je jim RČ (či EČP) přiděleno (v takovém případě se identifikují náhradním způsobem). V daňových oblastech a dalších částech formuláře je toto pole vyplňováno pouze tehdy, pokud je příslušná oblast uplatněna a daná osoba je v ní uvedena. Pokud se pole vyplní, systém na pozadí provádí striktní logické kontroly na platný formát rodného čísla (včetně kontroly modulo 11, kontroly vůči datu narození a kontroly shody pohlaví).' },
			
			
			'prukazztpp': { label: 'Průkaz ZTP/P (Držitel Průkazu ZTP/P)', desc: 'Pole formuláře sloužící k označení, zda daná osoba (vyživované dítě nebo manžel/manželka) má přiznán nárok na průkaz ZTP/P. Pro mzdové účetní je klíčové pravidlo, že přiznání nároku zvyšuje příslušné daňové zvýhodnění na dítě nebo slevu na manžela/manželku na dvojnásobek, přičemž rozhodující je datum z rozhodnutí o přiznání nároku (průkaz samotný ještě nemusí být fyzicky vydán). Totožné pole se využívá v podřízených oblastech formuláře pro daňové účely, a to pro vyživované dítě v měsíčním vyjádření (ID 10439), pro manželku či manžela v rámci ročního zúčtování (ID 10425) a také pro uplatnění průkazu ZTP/P u dětí v jednotlivých měsících v rámci ročního zúčtování (ID 10450).', format: 'Datové pole formuláře závislé na kontextu podřízené oblasti. U měsíčního zvýhodnění na dítě (ID 10439) a u slevy na manžela/manželku (ID 10425) se jedná o příznak (logická hodnota ANO/NE). U ročního zúčtování dětí v jednotlivých měsících (ID 10450) se vyplňuje jako textový řetězec o délce přesně 12 znaků pro jednotlivé měsíce v roce, kde každý znak nabývá hodnoty A (ano) nebo N (ne).', scenarios: 'Pole je nepovinné, ale stává se povinným v momentě, kdy je v příslušné podřízené oblasti aktivně uplatňována sleva či daňové zvýhodnění na konkrétní osobu a ta je zároveň držitelem průkazu ZTP/P. Měsíční zvýhodnění lze uplatnit od měsíce následujícího po předložení rozhodnutí (nebo od nástupu do zaměstnání, doloží-li se rozhodnutí do 30 dnů), dodatečně lze nevyužitý nárok uplatnit až zpětně v ročním zúčtování. Všechny tyto údaje spadají do hlavní oblasti Souhrnných dat a vyplňují se agregovaně výhradně u primárního pracovněprávního vztahu daného zaměstnance.' },
			
			
			
			'slevazamestnanceovozelevidovana': { label: 'Sleva na Pojistném Zaměstnance - ovocnářství a pěstování zeleniny (ID 10546)', desc: 'Pole formuláře sloužící k evidenci, zda má zaměstnanec za příslušný kalendářní měsíc nárok na slevu na pojistném zaměstnance v sektoru ovocnářství a pěstování zeleniny a jeho sleva je v daném měsíci nenulová. Započtou se pouze ti zaměstnanci, kteří by jinak měli povinnost v příslušném měsíci platit pojistné.', format: 'Příznakové pole formuláře nabývající logických hodnot (ANO/NE). V případě, že mzdová účetní uplatní nárok volbou ANO, vyplňuje se také navázané podřízené pole formuláře pro Výši slevy na pojistném zaměstnance (ID 10547), jež činí 7,1 % z částky vyměřovacího základu zaměstnance, ze které je odváděno pojistné (ID 10477), a zaokrouhluje se na celé koruny směrem nahoru.', scenarios: 'Toto pole formuláře se nachází v oblasti pro průběh pojištění v daném měsíci a v podřízené sekci slev na pojistném zaměstnanců pro ovocnářství a pěstování zeleniny . Mzdová účetní volí hodnotu ANO pouze tehdy, pokud je sleva aktivně uplatňována a její výše není nulová. Vykázané individuální hodnoty výše slev z této individualizované části se následně sčítají a agregovaně se projevují v oblasti souhrnných dat měsíčního hlášení za celého zaměstnavatele v poli Úhrn slev na pojistném zaměstnanců (ID 10545).' },
			
			
			
			
			'pracovnidobakratsi': { label: 'Rozsah kratší pracovní/služební doby (ID 10373)', desc: 'Pole formuláře pro evidenci týdenního rozsahu hodin ze všech zaměstnání v pracovním či služebním poměru u téhož zaměstnavatele. Slouží k prokázání limitu (nejvýše 30 hodin týdně), který je nezbytnou podmínkou pro uplatnění slevy na pojistném zaměstnavatele za daného zaměstnance.', format: 'Datové pole formuláře pro zápis desetinného čísla s maximálně 4 číslicemi, z toho 2 pro desetinná místa, bez úvodní nuly.', scenarios: 'Vyplňuje se v podřízené oblasti Slev na pojistném zaměstnavatele pouze v případě, že je Důvod uplatnění slevy (ID 10374) vyplněn hodnotami A až F. Uplatňuje-li se sleva pro osoby mladší 21 let (hodnota G), pole se neuvádí.' },
			
			
			'duvoduplatneni': { label: 'Důvod uplatnění slevy (ID 10374)', desc: 'Pole formuláře určující zákonný důvod, pro který mzdová účetní uplatňuje za daného zaměstnance slevu na pojistném zaměstnavatele podle § 7a odst. 1 zákona č. 589/1992 Sb. Je-li u zaměstnance splněno více důvodů pro slevu, volí se vždy pouze jeden.', format: 'Výběrové pole formuláře s hodnotami číselníku: A - dosáhl alespoň 55 let, B - pečuje o dítě mladší 10 let, C - pečuje o osobu blízkou, D - studium do 26 let, E - rekvalifikace, F - osoba se zdravotním postižením, G - mladší 21 let.', scenarios: 'Pole se stává povinným v okamžiku, kdy je v rámci individualizované části formuláře zvoleno uplatnění slevy na pojistném (ID 10372) jako ANO. Hodnotu F nelze uvést, pokud je zaměstnavatel uznán jako zaměstnavatel na chráněném trhu práce.' },
			
			
			'kodobce': { label: 'Kód obce (ID 10230, ID 10529)', desc: 'Pole formuláře zachycující číselný kód obce, na jejímž území výkon práce buď fakticky a převážně probíhal (ID 10230), nebo která je uvedená přímo v pracovní smlouvě zaměstnance jako sjednané místo výkonu práce (ID 10529).', format: 'Datové pole formuláře úzce navázané na číselník obcí ČSÚ, vyžadující přesně 6 číslic (např. 537004 pro Nymburk).', scenarios: 'Povinné pole v podřízených oblastech formuláře týkajících se místa výkonu práce. V případě výkonu práce výhradně v zahraničí se v oblasti faktického výkonu práce namísto zahraniční lokace uvádí kód obce sídla českého zaměstnavatele.' },
			
			
			'kodstatu': { label: 'Stát místa výkonu práce (ID 10231) / Kód státu zahraniční osoby (ID 10492)', desc: 'Pole formuláře definující buď státní příslušnost faktického místa výkonu práce zaměstnance (ID 10231), nebo kód státu zahraniční právnické či fyzické osoby v případech agenturního zaměstnávání (ID 10492).', format: 'Výběrové datové pole napojené na číselník států s dvoupísmenným kódem (např. CZ).', scenarios: 'U běžného výkonu práce pole reflektuje reálný stát, kde se pracovalo; pokud práce probíhala mimo území ČR, zadává se bez vazby na český kód obce. U dočasného přidělení slouží k identifikaci domovského státu zahraničního uživatele.' },
			
			
			'ico': { label: 'IČO uživatele (ID 10252)', desc: 'Pole formuláře pro zápis identifikačního čísla osoby (uživatele), ke kterému je kmenový zaměstnanec agentury práce dočasně přidělen za účelem výkonu práce.', format: 'Textové pole formuláře tvořené přesně 8 číslicemi, vkládanými bez mezer a včetně případných úvodních nul.', scenarios: 'Zpřístupňuje se a stává se klíčovým výhradně v podřízené oblasti Dočasné přidělení, pokud je příznak Zaměstnání za účelem dočasného přidělení u uživatele (ID 10251) označen jako ANO a uživatel je v tuzemském rejstříku.' },
			
			
			'identifikace': { label: 'Registrační číslo zahraniční osoby (ID 10493)', desc: 'Pole formuláře zachycující specifický identifikační údaj (registrační číslo) uživatele, ke kterému je zaměstnanec agentury práce dočasně přidělen v situaci, kdy jde o zahraniční fyzickou nebo právnickou osobu bez českého IČO.', format: 'Základní textové pole formuláře v podřízené oblasti pro dočasné přidělení k zahraničnímu uživateli.', scenarios: 'Využívá se čistě při agenturním zaměstnávání, pokud je dočasné přidělení realizováno k uživateli mimo ČR a nelze využít standardní pole IČO či Rodné číslo uživatele.' },
			
			
			'nazev': { label: 'Název zahraniční osoby (uživatele) (ID 10494)', desc: 'Pole formuláře zachycující nezkrácený název zahraničního uživatele (zahraniční právnické nebo fyzické osoby), ke kterému agentura práce zaměstnance dočasně přidělila k výkonu práce.', format: 'Základní textové pole formuláře v podřízené sekci zahraničního dočasného přidělení.', scenarios: 'Zadává se obdobně jako pole identifikace výhradně u přeshraničního agenturního zaměstnávání u zahraničních subjektů.' },
			
			
			'dnyodpracovanepocet': { label: 'Počet odpracovaných dnů (ID 10267)', desc: 'Pole formuláře určující celkovou kumulovanou dobu v pracovním poměru zaměstnance od počátku roku do konce sledovaného měsíce ve dnech. Nezahrnují se sem neodpracované dny svátků.', format: 'Datové pole formuláře pro zápis celého nezáporného čísla v délce 1-8 číslic.', scenarios: 'Dle nejnovější specifikace ČSSZ jde primárně o nepovinný atribut, případně atribut do budoucna nevyužívaný; avšak pokud je z historických či mzdových zvyklostí vykazován, musí obsahovat správnou kumulativní hodnotu.' },
			
			
			'prescas': { label: 'Přesčasové hodiny z odpracovaných (ID 10269) / Příplatky za přesčas (ID 10333)', desc: 'V kontextu pracovní doby označuje pole počet přesčasových hodin, za které vznikl nárok na příplatek či náhradní volno (ID 10269). V kontextu mzdových údajů vyjadřuje přímo zúčtovanou finanční hodnotu příplatků za přesčasovou práci (ID 10333).', format: 'Pro odpracované hodiny (ID 10269) jde o desetinné pole s maximálně 3 desetinnými místy (může nabývat i záporných hodnot při čerpání dřívějšího volna). Pro příplatky (ID 10333) se jedná o celé nezáporné číslo.', scenarios: 'Vyplňuje se nezávisle ve dvou samostatných podřízených oblastech: Odpracované hodiny (evidence času) a Rozpad zúčtované mzdy (evidence financí zúčtovaných k výplatě).' },

			'hodinyneodpracdovol': { label: 'Neodpracované hodiny - dovolená (ID 10279)', desc: 'Pole formuláře, do kterého mzdová účetní eviduje počet hodin, které zaměstnanec v daném měsíci fakticky neodpracoval z důvodu čerpání klasické dovolené na zotavenou.', format: 'Datové pole formuláře tvořené desetinným číslem (max. 3 desetinná místa).', scenarios: 'Patří do bloku neodpracovaných hodin. Uvádí se zde pouze skutečně vyčerpaná dovolená, nevyplňuje se sem proplacení zbývajících dnů nevyčerpané dovolené na konci PPV.' },
			
			
			'hodinyneodpracocr': { label: 'Neodpracované hodiny - OČR s nárokem (ID 10280)', desc: 'Pole formuláře pro zápis hodin, které zaměstnanec neodpracoval z důvodu ošetřování dítěte nebo péče o jiného člena domácnosti, přičemž za tyto hodiny mu prokazatelně náležela dávka ošetřovného.', format: 'Datové pole formuláře, desetinné číslo s maximálně 3 desetinnými místy.', scenarios: 'Evidují se do bloku Neodpracované hodiny. Tento konkrétní údaj je důležitý pro výpočet povinného podílu zaměstnávání OZP, jelikož se tyto hodiny následně matematicky přičítají zpět k hodinám odpracovaným.' },
			
			
			'specifickaskutecnost': { label: 'Specifická právní skutečnost', desc: 'Podřízená oblast v hlavní hlavičce souhrnných dat formuláře, která slouží k evidenci výjimečných organizačních událostí u zaměstnavatele, jakými jsou například rozhodnutí o úpadku či vstoupení do insolvence.', format: 'Seskupovací uzel formuláře obsahující typ rozhodné skutečnosti (ID 10408), datum jejího nastání (ID 10409) a odvozený výplatní termín (ID 10410).', scenarios: 'Uzel se aktivuje a vyplňuje výhradně u zaměstnavatelů, kteří se octli ve stádiu úpadku, a je nezbytný pro správné rozdělení odvodů záloh na daň do doby před a po rozhodnutí o úpadku.' },

			'mzdarozpad': { label: 'Rozpad zúčtované mzdy', desc: 'Podřízená oblast uvnitř mzdových dat, sloužící k pokročilému analytickému rozčlenění základní hrubé mzdy na jednotlivé složky, které ji tvoří, jako jsou tarifní mzdy, příplatky a různé druhy odměn.', format: 'Seskupovací uzel formuláře pro detailní mzdové komponenty (Tarif - ID 10329, Pravidelné odměny - ID 10330, Nepravidelné odměny - ID 10331 a Příplatky).', scenarios: 'Zpracovává se pro statistické účely systému ISPV, vykazuje se vždy v rámci běžných pracovních a služebních poměrů zaměstnanců, u nichž je tato strukturovaná odměna vyplácena.' },

			'celkem': { label: 'Příplatky celkem (ID 10332)', desc: 'Pole formuláře evidující finanční úhrn všech zúčtovaných příplatků zaměstnance v daném měsíci (součet všech zákonných i vnitřních mzdových příplatků, a dokonce i případných doplatků do minimální či zaručené mzdy).', format: 'Datové pole formuláře pro celé nezáporné číslo s délkou 1-8 číslic. Prázdná hodnota (bez vyplnění) není technicky povolena.', scenarios: 'Je-li v hlášení odeslán uzel Příplatky, musí být toto pole bezpodmínečně vyčísleno. Hodnota nesmí zahrnovat pohyblivé složky mzdy jako osobní hodnocení.' },
			
			
			'nocni': { label: 'Příplatky za práci v noci (ID 10334)', desc: 'Pole formuláře pro zapsání přesné finanční výše příplatků zúčtovaných zaměstnanci za výkon práce v nočních hodinách v souladu se zákoníkem práce nebo vnitřním předpisem.', format: 'Datové pole formuláře pro celé nezáporné číslo.', scenarios: 'Vyplňuje se v rámci bloku Příplatků výhradně za měsíce, ve kterých byla práce v noci u daného zaměstnance odpracována a finančně oceněna.' },
			
			
			
			'sobotanedele': { label: 'Příplatky za práci o sobotách a nedělích (ID 10335)', desc: 'Pole formuláře pro evidenci zúčtovaných finančních příplatků za výkon práce o víkendech (soboty a neděle) podle platných ustanovení zákoníku práce.', format: 'Datové pole formuláře pro celé nezáporné číslo.', scenarios: 'Vyplňuje mzdová účetní v bloku Příplatků u zaměstnanců, kterým byla o víkendu nařízena nebo schválena směna a následně zúčtován víkendový příplatek.' },

			'dovolena': { label: 'Náhrady za dovolenou (ID 10338)', desc: 'Pole formuláře vyjadřující finanční částku náhrady mzdy či platu zúčtovanou v měsíci za vyčerpanou řádnou či dodatkovou dovolenou (nebo v případě skončení PPV za dovolenou proplacenou a nevyčerpanou).', format: 'Datové pole formuláře typu celé nezáporné číslo.', scenarios: 'Zadává se jako podpoložka v rámci uzlu Náhrady mzdy ve chvíli, kdy v daném měsíci dochází k finanční kompenzaci dovolenkových nároků.' },
			
			
			'svatky': { label: 'Náhrady za svátky (ID 10339)', desc: 'Pole formuláře pro zúčtovanou finanční částku náhrady mzdy poskytnutou zaměstnanci za státem uznaný svátek, který připadl na jeho běžný pracovní den a kvůli kterému zaměstnanec do práce nešel.', format: 'Datové pole formuláře tvořené celým nezáporným číslem.', scenarios: 'Vyplňuje se uvnitř bloku Náhrady jen za podmínky, že zaměstnanci v měsíci náleželo finanční vyrovnání neodpracovaného svátečního dne.' },
			
			
			'prekazkyzamestnavatel': { label: 'Překážky na straně zaměstnavatele - Hodiny (ID 10472) / Finanční náhrady (ID 10340)', desc: 'V oblasti pracovní doby eviduje pole počet hodin zameškaných prostoje, přerušením práce kvůli počasí či jinými překážkami podniku (ID 10472). V oblasti mezd jde o částku náhrady zúčtované za tyto situace, popř. náhradu při okamžitém zrušení PPV (ID 10340).', format: 'Při zadávání hodin (ID 10472) se použije desetinné číslo (max. 3 desetinná místa), u zúčtovaných peněz (ID 10340) se vykazuje celé nezáporné číslo.', scenarios: 'Zpracovává se v příslušných uzlech Neodpracované hodiny a Náhrady mzdy vždy pouze u zaměstnanců, u nichž podnik nebyl schopen v daném měsíci přidělovat sjednanou práci.' },
			
			
			'prekazkyzamestnanec': { label: 'Překážky na straně zaměstnance - Hodiny (ID 10471) / Finanční náhrady (ID 10341)', desc: 'V oblasti pracovní doby označuje hodiny důležitých osobních překážek s náhradou mzdy (vyšetření u lékaře, pohřeb atd.) pod ID 10471. Ve mzdové oblasti (ID 10341) vyčísluje finanční náhradu za tyto překážky podle části osmé ZP. S výjimkou prvních 14 dnů nemoci.', format: 'Pro evidenci doby (ID 10471) je využíváno desetinné číslo, pro evidenci mezd (ID 10341) se jedná o datové pole pro celé nezáporné číslo.', scenarios: 'V obou příslušných podřízených oblastech se vyplňuje pouze, pokud tyto specifické osobní překážky na straně zaměstnance v daném kalendářním měsíci reálně nastaly.' },
			
			
			
			
			'prispevekzelpojdlpece': { label: 'Příspěvek na pojištění dlouhodobé péče', desc: 'Pole formuláře určené pro uvedení částky osvobozeného příjmu zaměstnance ve formě příspěvku uhrazeného zaměstnavatelem na daňově podporované pojištění dlouhodobé péče (dle § 15c ZDP), jehož pojistníkem je zaměstnanec. Pro mzdové účetní platí, že jde o plnění osvobozené od daně podle § 6 odst. 9 písm. m) zákona o daních z příjmů (ID 10418).', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé číslo (může nabývat i záporných hodnot například pro korekce) o délce 1 až 14 číslic. Toto pole je součástí podřízené oblasti formuláře Příjmy (konkrétně v části Příspěvek zaměstnavatele z osvobozených příjmů), která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se v měsíčním hlášení vyplňuje v situacích, kdy zaměstnavatel poskytl zaměstnanci v daném měsíci tento specifický příspěvek. Stejně jako celá nadřazená oblast souhrnných dat a příjmů se i tento údaj vyplňuje agregovaně a výhradně u primárního pracovněprávního vztahu.' },
			
			
			
			'prispevekpenzpripoj': { label: 'Příspěvek na penzijní připojištění se státním příspěvkem', desc: 'Pole formuláře sloužící k uvedení částky osvobozeného příjmu ve formě příspěvku zaměstnavatele na penzijní připojištění se státním příspěvkem. Pro mzdové účetní platí, že jde o plnění osvobozené od daně podle § 6 odst. 9 písm. m) zákona o daních z příjmů za jednotlivý produkt (ID 10292).', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé číslo (může nabývat i záporných hodnot) o délce 1 až 14 číslic. Toto pole je součástí podřízené oblasti formuláře Příjmy (konkrétně v části Příspěvek zaměstnavatele z osvobozených příjmů), která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se v měsíčním hlášení vyplňuje v příslušném kalendářním měsíci, kdy zaměstnavatel uhradil zaměstnanci tento příspěvek. Údaj se vykazuje agregovaně a výhradně v rámci primárního pracovněprávního vztahu zaměstnance.' },
			
			
			
			'prijemsrazkdanzvlsazba': { label: 'Příjmy podléhající srážkové dani (zvláštní sazba) do 31.1. násl. roku', desc: 'Pole formuláře sloužící k uvedení částky příjmů za předcházející zdaňovací období (r-1), které podléhají srážkové dani podle zvláštní sazby daně a byly vyplaceny nebo obdrženy do 31. 1. následujícího roku (ID 10311). Pro mzdové účetní platí, že tento údaj slouží jako podklad pro předvyplnění daňového přiznání a v potvrzení o zdanitelných příjmech (MFin 5460/A) se jedná o řádek č. 2. Údaj se od potvrzení liší pouze tehdy, pokud část příjmů za předchozí rok nebyla vyplacena do konce ledna.', format: 'Nepovinné pole formuláře. Pokud je vyplněno, hodnota se uvádí jako nezáporné celé číslo o délce 1 až 14 číslic. Toto pole je součástí podřízené oblasti formuláře Roční úhrny jednotlivých položek, která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se vyplňuje výhradně v měsíčním hlášení podávaném za kalendářní měsíc leden. Stejně jako celá nadřazená oblast souhrnných dat a daňových údajů se i tento údaj vyplňuje agregovaně za osobu a výhradně u jejího primárního pracovněprávního vztahu.' },
			
			
			'dansrazenazvlsazba': { label: 'Skutečně sražená daň vybíraná srážkou podle zvláštní sazby daně (roční úhrn)', desc: 'Pole formuláře určené pro uvedení skutečně sražené daně vybírané srážkou podle zvláštní sazby daně za předcházející období (r-1) (ID 10312). Pro mzdové účetní platí, že se jedná o podklad pro předvyplnění daňového přiznání. V potvrzení o zdanitelných příjmech (MFin 5460/A) odpovídá tato částka řádku č. 3 a údaj se liší pouze tehdy, pokud část příjmů za předchozí rok nebyla do konce ledna následujícího roku reálně vyplacena.', format: 'Nepovinné pole formuláře. Pokud je vyplněno, hodnota se uvádí jako nezáporné celé číslo o délce 1 až 14 číslic. Toto pole je součástí podřízené oblasti formuláře Roční úhrny jednotlivých položek, která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se vyplňuje výhradně v měsíčním hlášení podávaném za kalendářní měsíc leden. Tento údaj se vyplňuje agregovaně za osobu a POUZE u jejího primárního pracovněprávního vztahu.' },
			
			
			'prijemzdanitelnycelkem': { label: 'Zdanitelné příjmy v ČR zdaněné zálohou vyplacené do 31.1. násl. roku', desc: 'Pole formuláře sloužící k uvedení úhrnu zdanitelných příjmů v ČR (zdaněných zálohou na daň celkem) vyplacených nebo obdržených do 31. 1. následujícího roku za předcházející období (r-1) (ID 10313). Pro mzdové účetní je tento údaj podkladem pro předvyplnění daňového přiznání a odpovídá řádku č. 2 v potvrzení o zdanitelných příjmech. Liší se pouze v případě, že část příjmů za předchozí rok nebyla do konce ledna vyplacena.', format: 'Nepovinné pole formuláře. Pokud je vyplněno, hodnota se uvádí jako nezáporné celé číslo o délce 1 až 14 číslic. Toto pole je součástí podřízené oblasti formuláře Roční úhrny jednotlivých položek, která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se vyplňuje výhradně v měsíčním hlášení podávaném za kalendářní měsíc leden. Vyplňuje se agregovaně za celou osobu (přes všechny její vztahy u zaměstnavatele) a striktně pouze u jejího primárního pracovněprávního vztahu.' },
			
			
			'prijemzdanitelnydoplatek': { label: 'Doplatky příjmů z minulých období zdanitelné zálohou vyplacené do 31.1.', desc: 'Pole formuláře pro uvedení doplatků příjmů zúčtovaných v minulých zdaňovacích obdobích (r-1, r-2, r-3...), zdanitelných v ČR a zdaněných zálohou na daň, které byly vyplaceny nebo obdrženy do 31. 1. následujícího roku (ID 10316). Pro mzdové účetní jde o důležitý podklad pro předvyplnění daňového přiznání, který odpovídá řádku č. 4 v potvrzení o zdanitelných příjmech.', format: 'Nepovinné pole formuláře. Pokud je vyplněno, hodnota se uvádí jako nezáporné celé číslo o délce 1 až 14 číslic. Toto pole je součástí podřízené oblasti formuláře Roční úhrny jednotlivých položek, která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se v měsíčním hlášení vyplňuje výhradně za měsíc leden. Údaj se vykazuje agregovaně za zaměstnance a striktně v rámci jeho primárního pracovněprávního vztahu.' },
			
			
			'zalohaprijmy': { label: 'Skutečně sražená záloha na daň z příjmů do 31.1. násl. roku', desc: 'Pole formuláře pro uvedení částky skutečně sražené zálohy na daň z příjmů vyplacených nebo obdržených do 31. 1. následujícího roku za předcházející období (r-1) (ID 10317). Z pohledu mzdové účetní jde o podklad pro předvyplnění daňového přiznání odpovídající řádku č. 6 v potvrzení o zdanitelných příjmech (odlišnosti vznikají opět pouze při nevyplacení části příjmů do konce ledna).', format: 'Nepovinné pole formuláře. Pokud je vyplněno, hodnota se uvádí jako nezáporné celé číslo o délce 1 až 14 číslic. Toto pole je součástí podřízené oblasti formuláře Roční úhrny jednotlivých položek, která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se vyplňuje výhradně v měsíčním hlášení za kalendářní měsíc leden. Údaj se vykazuje agregovaně za osobu a pouze u jejího primárního pracovněprávního vztahu.' },
			
			
			'zalohadoplatky': { label: 'Skutečně sražená záloha na daň z doplatků příjmů', desc: 'Pole formuláře určené pro uvedení částky skutečně sražené zálohy na daň z doplatků příjmů zdanitelných v ČR za předcházející období (r-1, r-2, r-3...) (ID 10318). Pro mzdové účetní je to podklad pro předvyplnění daňového přiznání, který odpovídá řádku č. 7 v potvrzení o zdanitelných příjmech.', format: 'Nepovinné pole formuláře. Pokud je vyplněno, hodnota se uvádí jako nezáporné celé číslo o délce 1 až 14 číslic. Toto pole je součástí podřízené oblasti formuláře Roční úhrny jednotlivých položek, která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se vyplňuje výhradně v měsíčním hlášení za kalendářní měsíc leden. Údaj se vykazuje agregovaně za celou osobu a výhradně u primárního pracovněprávního vztahu daného zaměstnance.' },
			
			
			'rocnizuctovanizadost': { label: 'Zaměstnanec požádal o provedení ročního zúčtování', desc: 'Pole formuláře sloužící k označení, zda zaměstnanec požádal u zaměstnavatele o provedení ročního zúčtování záloh na daň za předcházející období (r-1) (ID 10319). Pro mzdové účetní platí, že hodnota ANO znamená evidovanou žádost zaměstnance o roční zúčtování, zatímco hodnota NE znamená, že zúčtování požadováno nebylo.', format: 'Datové pole formuláře. Uvádí se jako logická hodnota (příznak ANO / NE). Toto pole je součástí podřízené oblasti formuláře Roční zúčtování (v rámci Ročních úhrnů), která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se vyplňuje v měsíčních hlášeních podávaných za měsíce leden a únor. Údaj se vykazuje agregovaně za osobu a smí být zaslán pouze u jejího primárního pracovněprávního vztahu.' },
			
			
			'rocnizuctovaniprovedeno': { label: 'Roční Zúčtování Záloh Bylo Provedeno', desc: 'Pole formuláře sloužící k označení faktu, zda bylo roční zúčtování záloh na daň zaměstnavatelem reálně provedeno (ID 10320). Pro mzdové účetní platí klíčové pravidlo, že hodnota ANO potvrzuje fyzické provedení ročního zúčtování na straně zaměstnavatele, zatímco hodnota NE značí, že zúčtování zaměstnavatelem provedeno nebylo.', format: 'Datové pole formuláře. Uvádí se jako logická hodnota (příznak ANO / NE). Toto pole je součástí podřízené oblasti formuláře Roční zúčtování (v rámci Ročních úhrnů), která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se vyplňuje v měsíčních hlášeních podávaných za měsíce leden, únor a březen. Údaj se vykazuje plně agregovaně za celou osobu a výhradně u jejího primárního pracovněprávního vztahu.' },
			
			
			
			'preplatekrok': { label: 'Přeplatek nebo nedoplatek z ročního zúčtování', desc: 'Pole formuláře určené pro uvedení přeplatku na dani z ročního zúčtování záloh (§ 38ch odst. 5 ZDP) a doplatku ze zúčtování daňového bonusu (§ 35d odst. 8 ZDP). Pro mzdové účetní platí, že v případě nedoplatku z ročního zúčtování bude v tomto poli uvedena striktně nula (ID 10321).', format: 'Podmíněně povinné pole formuláře. Pokud je vyplňováno, hodnota se uvádí jako celé číslo se znaménkem o maximální délce 14 číslic. Toto pole je součástí podřízené oblasti formuláře Výsledek ročního zúčtování, která spadá do hlavní oblasti Souhrnná data zaměstnance.', scenarios: 'Položka se vyplňuje pouze v měsíčních hlášeních podávaných za měsíce leden, únor a březen následujícího roku. Údaj je povinný vždy, je-li na zaměstnanci vykazován výsledek ročního zúčtování. Údaj se vykazuje plně agregovaně za celou osobu a smí být zaslán výhradně u jejího primárního pracovněprávního vztahu.' },
			
			
			
			'danpreplatekrok': { label: 'Přeplatek nebo nedoplatek z ročního zúčtování - z toho přeplatek na dani nebo nedoplatek daně', desc: 'Pole formuláře pro uvedení přeplatku na dani vyčleněného z celkového výsledku ročního zúčtování. V případě nedoplatku bude uvedena nula. Pro mzdové účetní platí, že jde o údaj odpovídající současnému řádku č. 23 (pouze v případě kladné hodnoty, jinak 0) nebo řádku 32 a) tiskopisu Výpočet daně MFin 5460/1 - vzor č. 29 (ID 10322).', format: 'Podmíněně povinné pole formuláře. Hodnota se uvádí jako celé číslo se znaménkem o maximální délce 14 číslic. Toto pole je součástí podřízené oblasti formuláře Výsledek ročního zúčtování, která spadá do hlavní oblasti Souhrnná data zaměstnance.', scenarios: 'Položka se vyplňuje v měsíčních hlášeních podávaných za měsíce leden, únor a březen následujícího roku. Je-li uveden celkový výsledek ročního zúčtování, stává se tento vyčleňující údaj povinným. Údaj se vykazuje agregovaně za osobu a pouze u primárního pracovněprávního vztahu.' },
			
			
			
			'danbonuspreplatekrok': { label: 'Z ročního zúčtování z toho doplatek na daňovém bonusu nebo přeplacená částka daňového bonusu', desc: 'Pole formuláře pro uvedení doplatku na daňovém bonusu (označeno znaménkem plus) vyčleněného z celkového výsledku ročního zúčtování. Z pohledu mzdové účetní bude částka uvedena pouze, je-li zaměstnanci reálně vyplácena, tj. nárok na bonus v ročním zúčtování činil alespoň 100 Kč. Jde o údaj odpovídající současnému řádku 32 b) tiskopisu Výpočet daně vzor č. 29 (ID 10323).', format: 'Podmíněně povinné pole formuláře. Hodnota se uvádí jako celé číslo se znaménkem (může být kladné i záporné) o maximální délce 14 číslic. Toto pole je součástí podřízené oblasti formuláře Výsledek ročního zúčtování v hlavní oblasti Souhrnná data zaměstnance.', scenarios: 'Položka se vyplňuje v hlášeních za leden, únor a březen následujícího roku. Tento údaj je povinný, je-li výsledek zúčtování vykazován. Vyplňuje se agregovaně za celou osobu a výhradně u primárního pracovněprávního vztahu.' },
			
			
			
			'uplatnenaslevanapartnera': { label: 'Uplatněna sleva na manželku / manžela', desc: 'Pole formuláře sloužící k označení, zda bylo v rámci ročního zúčtování uplatněno snížení daně o slevu na manžela či manželku. Pro mzdové účetní platí zásadní pravidlo, že pod pojmem manžel nebo manželka se pro účely daní z příjmů vždy rozumí také partner podle zákona upravujícího registrované partnerství (ID 10420).', format: 'Datové pole formuláře typu příznak. Uvádí se jako logická hodnota ANO / NE. Toto pole je součástí podřízené oblasti formuláře Sleva na manželku / manžela (v rámci Výsledku ročního zúčtování), která spadá do hlavní oblasti Souhrnná data zaměstnance.', scenarios: 'Položka se v měsíčním hlášení vyplňuje v měsících leden, únor a březen následujícího roku v rámci zpracování ročních úhrnů. Je-li uveden výsledek ročního zúčtování, je tento údaj povinný. Vyplňuje se agregovaně za osobu u primárního pracovněprávního vztahu.' },
			
			
			
			'uplatnenozvyhodneninadeti': { label: 'Uplatněno daňové zvýhodnění na děti', desc: 'Pole formuláře sloužící k označení faktu, zda bylo u zaměstnance v rámci ročního zúčtování záloh aktivně uplatněno daňové zvýhodnění na vyživované děti ve společně hospodařící domácnosti (ID 10454).', format: 'Datové pole formuláře typu příznak. Uvádí se jako logická hodnota ANO / NE. Toto pole je součástí podřízené oblasti formuláře Daňové zvýhodnění na děti (v rámci Výsledku ročního zúčtování), která spadá do hlavní oblasti Souhrnná data zaměstnance.', scenarios: 'Položka se vyplňuje v měsíčních hlášeních podávaných za měsíce leden, únor a březen následujícího roku. Je-li zaměstnavatelem vyplňována roční část daňového zvýhodnění na děti v rámci výsledku ročního zúčtování, stává se tento údaj povinným. Vykazuje se agregovaně za osobu POUZE u primárního pracovněprávního vztahu.' },
			
			
			'slevapocetmesicu': { label: 'Počet měsíců uplatnění slevy na manželku / manžela', desc: 'Pole formuláře určené pro uvedení počtu měsíců, po které byly v kalendářním roce splněny podmínky pro uplatnění slevy na manžela či manželku (ID 10426). Pro mzdové účetní platí, že se tento počet odvíjí od toho, po které měsíce trvalo manželství (případně registrované partnerství) a po které měsíce z uplatněných zároveň případně vznikl nárok z důvodu péče o dítě v domácnosti.', format: 'Podmíněně povinné pole formuláře. Hodnota se uvádí jako nezáporné celé číslo v rozsahu 1 až 12. Toto pole je součástí podřízené oblasti formuláře Sleva na manželku / manžela (v rámci Výsledku ročního zúčtování), která spadá do hlavní oblasti Souhrnná data zaměstnance.', scenarios: 'Položka se vyplňuje v měsíčních hlášeních podávaných za měsíce leden, únor a březen následujícího roku. Je-li v rámci ročního zúčtování zaměstnavatelem aktivně uplatněna sleva na manželku či manžela, stává se tento údaj povinným. Vykazuje se agregovaně za osobu pouze u jejího primárního pracovněprávního vztahu.' },
			
			
			
			'slevapocetmesicuztpp': { label: 'Počet měsíců uplatnění slevy - z toho počet měsíců ZTP/P', desc: 'Pole formuláře sloužící k uvedení počtu měsíců, po které byl manželovi či manželce, na něž je uplatňována sleva, přiznán nárok na průkaz ZTP/P (ID 10430). Pro mzdové účetní platí striktní logické pravidlo, že tato hodnota musí být vždy menší nebo rovna celkovému počtu měsíců uplatnění slevy na partnera (ID 10426). Vyčleňují se tak pouze ty měsíce z již uplatněných, kdy byl manžel či manželka držitelem průkazu ZTP/P.', format: 'Podmíněně povinné pole formuláře. Hodnota se uvádí jako nezáporné celé číslo v rozsahu 1 až 12. Toto pole je součástí podřízené oblasti formuláře Sleva na manželku / manžela (v rámci Výsledku ročního zúčtování), která spadá do hlavní oblasti Souhrnná data zaměstnance.', scenarios: 'Položka se vyplňuje v měsíčních hlášeních podávaných za měsíce leden, únor a březen následujícího roku. Údaj se stává povinným v momentě, kdy je uplatněna sleva na manželku/manžela a zároveň je u této osoby v ročním zúčtování evidován průkaz ZTP/P. Vykazuje se plně agregovaně za celou osobu pouze u jejího primárního pracovněprávního vztahu.' },
			
			
			
			'mzdaozpuhradadatum': { label: 'Datum úhrady mzdy včetně odvodů na soc. a zdravotní pojištění', desc: 'Pole formuláře určené pro zadání data úhrady mzdy a odvodů pojistného (ID 10347). Pro mzdové účetní platí, že se tento údaj vyplňuje v případě, kdy zaměstnavatel požaduje od Úřadu práce ČR na základě písemné dohody poskytnutí mzdového příspěvku aktivní politiky zaměstnanosti. Vyplacením mzdy se pro tyto účely rozumí její připsání na účet zaměstnance, platba v hotovosti či poštovním poukazem, u odvodů pak den připsání na účet ČSSZ či zdravotní pojišťovny.', format: 'Datové pole formuláře. Hodnota se uvádí jako platné datum ve formátu RRRR-MM-DD. Toto pole je součástí podřízené oblasti formuláře Výdělek osob OZP (v rámci sekce Mzda), která spadá do hlavní oblasti Souhrnná data zaměstnance.', scenarios: 'Údaj je nepovinný, avšak stává se povinným, pokud je zaměstnavatelem vyplňován příslušný podřízený blok Výdělek osob OZP. Stejně jako celá nadřazená oblast souhrnných dat se vyplňuje agregovaně za celou osobu a výhradně u jejího primárního pracovněprávního vztahu.' },
			
			
			'mzdaozphotovost': { label: 'Mzda/plat nebo jeho část vyplacena v hotovosti', desc: 'Pole formuláře sloužící k označení faktu, zda byla v daném kalendářním měsíci mzda či plat (nebo jakákoliv její část) vyplacena zaměstnanci fyzicky v hotovosti (ID 10348). Pro mzdové účetní je důležité, že tento údaj se vykazuje výhradně u zaměstnanců, kteří jsou osobami se zdravotním postižením (podle § 67 zákona o zaměstnanosti), a to pouze u zaměstnavatelů uznaných na chráněném trhu práce.', format: 'Datové pole formuláře typu příznak. Uvádí se jako logická hodnota ANO / NE). Toto pole je součástí podřízené oblasti formuláře Výdělek osob OZP (sekce Mzda) v hlavní oblasti Souhrnná data zaměstnance.', scenarios: 'Údaj je nepovinný, ale stává se striktně povinným, pokud je vyplňována sekce Výdělek osob OZP. Údaj se vykazuje agregovaně za zaměstnance výhradně u primárního pracovněprávního vztahu.' },
			
			
			'mzdaozpsrazka': { label: 'Provedeny srážky ze mzdy nebo platu určené k uspokojení plnění zaměstnavatele', desc: 'Pole formuláře sloužící k označení faktu, zda provedl zaměstnavatel v daném měsíci srážky ze mzdy nebo platu k uspokojení plnění zaměstnavatele podle občanského zákoníku (ID 10349). Pro mzdové účetní platí, že se sem nezahrnují srážky provedené k uhrazení škody, za kterou zaměstnanec odpovídá, ani příspěvky zaměstnance na závodní stravování podle § 236 zákoníku práce. Údaj se vykazuje výhradně u osob se zdravotním postižením pracujících u uznaného zaměstnavatele na chráněném trhu práce.', format: 'Datové pole formuláře typu příznak. Uvádí se jako logická hodnota ANO / NE. Toto pole je součástí podřízené oblasti formuláře Výdělek osob OZP (sekce Mzda), která spadá do hlavní oblasti Souhrnná data zaměstnance.', scenarios: 'Údaj je podmíněně povinný – stává se povinným v momentě, kdy je na formuláři aktivně vyplňována sekce Výdělek osob OZP (chráněný trh práce). Vykazuje se plně agregovaně za osobu a smí být zaslán pouze u jejího primárního pracovněprávního vztahu.' },
			
			
			
			
			'srazkaplnenizel': { label: 'Srážky k uspokojení plnění zaměstnavatele podle občanského zákoníku', desc: 'Pole formuláře určené pro uvedení částky sražené zaměstnanci ze mzdy či platu za daný kalendářní měsíc k uspokojení plnění zaměstnavatele podle občanského zákoníku (ID 10350). Pro mzdové účetní platí, že se tento údaj vyplňuje specificky u zaměstnanců, kteří jsou osobami se zdravotním postižením (OZP), a to výhradně zaměstnavatelem uznaným na chráněném trhu práce.', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé číslo. Toto pole je součástí podřízené oblasti formuláře Srážky ze mzdy, která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se v měsíčním hlášení vyplňuje POUZE tehdy, pokud je zaměstnanec osobou se zdravotním postižením, zaměstnavatel působí na chráněném trhu práce a v daném měsíci byla tato konkrétní srážka ze mzdy reálně provedena. Údaj se vykazuje agregovaně za osobu a výhradně u primárního pracovněprávního vztahu.' },
			
			
			'srazkaskodazec': { label: 'Srážky k uhrazení škody, za kterou odpovídá zaměstnanec', desc: 'Pole formuláře sloužící k uvedení částky sražené zaměstnanci ze mzdy či platu za účelem uhrazení škody, za kterou zaměstnanec odpovídá (ID 10351). Pro mzdové účetní je důležité, že i tento údaj je vyžadován specificky pro účely kontroly u zaměstnanců, kteří jsou osobami se zdravotním postižením (OZP) pracujícími u uznaných zaměstnavatelů na chráněném trhu práce.', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé číslo. Toto pole je součástí podřízené oblasti formuláře Srážky ze mzdy, která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se vyplňuje v příslušném kalendářním měsíci POUZE v případech, kdy je zaměstnanec OZP, zaměstnavatel je uznán na chráněném trhu práce a v daném měsíci byla provedena srážka na náhradu škody. Stejně jako celá nadřazená oblast souhrnných dat se i tento údaj vyplňuje agregovaně výhradně u primárního pracovněprávního vztahu daného zaměstnance.' },
			
			
			'srazkastrava': { label: 'Srážky na závodní stravování pode §236 zákoníku práce', desc: 'Pole formuláře určené pro uvedení částky sražené zaměstnanci ze mzdy či platu jako příspěvek na závodní stravování podle § 236 zákoníku práce (ID 10352). Z pohledu mzdové účetní se tento specifický údaj vykazuje výhradně u zaměstnanců se zdravotním postižením (OZP) u zaměstnavatelů uznaných na chráněném trhu práce za účelem doložení uznatelných nákladů a srážek.', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé číslo. Toto pole je součástí podřízené oblasti formuláře Srážky ze mzdy, která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se v měsíčním hlášení vyplňuje POUZE tehdy, pokud je zaměstnanec osobou se zdravotním postižením, zaměstnavatel působí na chráněném trhu práce a srážka na stravování byla v měsíci reálně provedena. Vykazuje se plně agregovaně za osobu a POUZE u jejího primárního pracovněprávního vztahu.' },
			
			
			'srazkazavazkyzec': { label: 'Srážky k uspokojení závazků zaměstnance podle § 146 písm. b) zákoníku práce', desc: 'Pole formuláře sloužící k uvedení částky sražené zaměstnanci ze mzdy či platu určené k uspokojení závazků zaměstnance na základě dohody o srážkách ze mzdy podle § 146 písm. b) zákoníku práce (ID 10353). Pro mzdové účetní platí, že i tento údaj je primárně sledován u zaměstnanců se zdravotním postižením (OZP) u zaměstnavatelů na chráněném trhu práce.', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé číslo. Toto pole je součástí podřízené oblasti formuláře Srážky ze mzdy, která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se vyplňuje v příslušném kalendářním měsíci POUZE v případech, kdy je zaměstnanec OZP, zaměstnavatel je uznán na chráněném trhu práce a v daném měsíci byla provedena srážka k uspokojení závazků zaměstnance. Údaj se vykazuje agregovaně a striktně jen v rámci primárního pracovněprávního vztahu.' },
			
			
			
			'zdravotnipojisteni': { label: 'Částka', desc: '(ID 10371) • Pole formuláře umístěné ve specifickém podřízeném bloku Zdravotní pojištění za zaměstnance, který se nachází uvnitř hlavní oblasti Souhrnná data zaměstnance. Udává konkrétní výši pojistného na veřejné zdravotní pojištění, které zaměstnavatel odvedl za tohoto zaměstnance.', format: 'Jednotlivé pole formuláře. Jde o povinný údaj, u kterého se očekává exaktní zápis celého nezáporného čísla o délce 1 až 12 číslic. K poli nejsou navázány žádné číselníky, slouží výhradně pro zápis finanční částky.', scenarios: 'Data se do tohoto pole zapisují výhradně u zaměstnání aktuálně označeného jako primární pracovněprávní vztah (ID 10495). Platí zde důležité metodické pravidlo: pokud se na zaměstnance vztahují předpisy sociálního a zdravotního pojištění jiného státu (např. v rámci EU disponuje potvrzením A1), musí být v tomto poli vykázána pevná hodnota 0, protože pojistné odvedené podle předpisů jiného státu se do hlášení nezahrnuje.' },
			
			
			
			'pojisteniod': { label: 'Pojištění Od (Datum Vzniku Účasti Na Nemocenském Pojištění)', desc: 'Toto datové pole formuláře (ID 10354) slouží k vykázání dne vzniku účasti na nemocenském pojištění, případně dne vzniku zaměstnání, u kterého by účast mohla v budoucnu vzniknout (např. při dosažení rozhodného příjmu). Pro mzdovou účetní platí zásadní pravidlo: pokud výdělečná činnost (a účast na pojištění) začala již před aktuálně vykazovaným měsícem a plynule do něj přechází, zapisuje se sem striktně 1. kalendářní den právě vykazovaného měsíce.', format: 'Povinné pole v situaci, kdy je u zaměstnance vykazováno trvání pojištění. Očekává se platný zápis data v exaktním XML formátu RRRR-MM-DD. K tomuto poli nejsou navázány žádné číselníky.', scenarios: 'Údaj se nachází v sekci Průběh pojištění v daném měsíci a tvoří logický pár s konečným datem pojištění. Metodický chyták: Tento tag slouží primárně pro posouzení nemocenského pojištění (NP) pro aktuální měsíc. Pro sestavování evidenčních listů (ELDP) a důchodové nároky systém tento tag přímo nevyužívá, ale místo něj sleduje specifické atributy Platnost kódu od (ID 10241) a Platnost kódu do (ID 10242) uvnitř podřízeného bloku ELDP.' },
