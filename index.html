            'mzda': { label: '7. Evidence Mzdy Zúčtované', desc: 'Oblast formuláře sloužící k detailní evidenci zúčtované mzdy, platu, odměny z dohod či služebního příjmu za konkrétní pracovněprávní vztah v hlášeném kalendářním měsíci. Mzdovým účetním umožňuje uvést celkový zúčtovaný příjem za vykonanou práci a jeho přesný rozpad na základní složky (tarif, prémie), příplatky, náhrady mzdy, odměny za pohotovost a průměrný hodinový výdělek. Evidují se zde také specifika výdělků osob OZP na chráněném trhu práce.', format: 'Hlavní oblast v individualizované části formuláře. Obsahuje přímá pole: Mzda za práci zúčtovaná (ID 10328), Tarifní mzdy (ID 10329), Prémie a odměny pravidelné (ID 10330), Prémie a odměny nepravidelné (ID 10331) a Průměrný hodinový výdělek (ID 10345). Dále se člení na podřízené oblasti: Příplatky, Náhrady mzdy, Odměny za pohotovost a případně specifickou podřízenou oblast pro Výdělek osob OZP, která sdružuje výplaty v hotovosti a srážky (ID 10348, 10349, 10350, 10351, 10352, 10353).', scenarios: 'Tato oblast je zásadní u běžných pracovních poměrů, avšak u některých specifických datových scénářů je formulářem skryta nebo omezena. Například u scénáře Jiný příjem (kódy činnosti 11, 13, 14) tato oblast zcela chybí. U scénáře Vězeň se standardní mzda nehlásí a je dostupná pouze redukovaná podřízená oblast pro náhrady. Zásadním chytákem je nepropustná kontrola 267 na systému DIS: pokud je Mzda za práci zúčtovaná (ID 10328) nulová, nesmí mzdový program vůbec odeslat pole pro tarif, prémie a příplatky. Zároveň zde platí kontrola 28 (chyba 20028), která přísně hlídá, aby Mzda zúčtovaná nebyla nižší než matematický součet jejích složek (tarifu, prémií a příplatků celkem).' },

            
            'mzdazuctovana': { label: 'Mzda Za Práci Zúčtovaná', desc: ' (ID 10328) Pole formuláře v podřízené oblasti Mzda. Slouží k evidenci hrubé mzdy, platu, odměny z dohod nebo služebního příjmu zúčtovaného za sledovaný měsíc výhradně za vykonanou práci, včetně naturální mzdy. Pro mzdové účetní je klíčové, že se do této částky striktně nezahrnují náhrady mzdy, odstupné, cestovní náhrady, stravenkový paušál, benefity, ani odměny za pracovní pohotovost či životní jubilea.', format: 'Povinné číselné pole (ID 10328). Vyplňuje se jako celé nezáporné číslo o délce 1 až 8 číslic. Prázdná hodnota není povolena a v případě nulové zúčtované mzdy zde musí být explicitně vyplněna nula (0).', scenarios: 'S tímto polem souvisí extrémně přísné kontroly. Dle nepropustné kontroly 267 na systému DIS platí, že pokud je Mzda zúčtovaná (ID 10328) rovna 0, nesmí být vůbec odeslána podřízená pole pro tarif, prémie a příplatky (ID 10329 až 10336) – tyto tagy se do XML vůbec negenerují. Dále zde funguje kontrola 28 (chybový kód 20028), která hlídá, zda zúčtovaná mzda není nižší než matematický součet tarifní mzdy, prémií a příplatků celkem. Upozornění z praxe: V systému státní správy je u této kontroly aktuálně známá chyba, kdy se do součtu duplicitně přičítají přesčasy. Mzdové účetní však mají striktně zakázáno položku Mzda zúčtovaná uměle navyšovat, aby vadným validátorem prošla.' },
            
            'mzdarozpad': { label: 'Rozpad Zúčtované Mzdy', desc: 'Oblast formuláře sloužící k detailnímu rozpadu celkové zúčtované mzdy za práci na její jednotlivé základní složky. Mzdová účetní zde eviduje základní tarifní mzdu, pravidelné i nepravidelné prémie a odměny a příplatky vyplacené zaměstnanci v daném měsíci.', format: 'Skládá se z podřízených polí formuláře: Tarifní mzdy (ID 10329), Prémie a odměny pravidelné (ID 10330), Prémie a odměny nepravidelné (ID 10331) a podřízené oblasti formuláře pro Příplatky (ID 10332 až 10336). Do polí se zadávají celá nezáporná čísla.', scenarios: 'Vyplnění této oblasti formuláře úzce souvisí s polem Mzda za práci zúčtovaná (ID 10328). Podle kontroly 28 nesmí být celková mzda menší než součet jejích rozpadnutých složek (ID 10329 + 10330 + 10331 + 10332). Zásadní je nepropustná kontrola 267: pokud je Mzda za práci zúčtovaná rovna 0, nesmí se tato oblast formuláře vůbec vyplňovat (pole nesmí nabývat hodnot, nesmí obsahovat ani nuly), jinak bude podání systémem DIS odmítnuto jako formálně chybné. V určitých datových scénářích, jako je například oblast formuláře Vězeň nebo Jiný příjem, se tato oblast formuláře vůbec nevyskytuje a nevyplňuje.' },
            
            'tarif': { label: 'Tarifní mzdy', desc: 'Pole formuláře sloužící k evidenci základní mzdy, platu, služebního příjmu nebo odměny z dohody vyplacené zaměstnanci v daném měsíci za práci podle mzdových a platových tarifů v úkolových, časových i měsíčních typech odměňování. Zahrnuje se sem také základní složka smluvních mezd nebo celá smluvní mzda, pokud není dále členěna na tarifní a pobídkovou složku.', format: 'Jednotlivé pole formuláře (ID 10329), které je součástí podřízené oblasti formuláře pro rozpad zúčtované mzdy. Do pole se zadává výhradně celé nezáporné číslo o délce 1 až 8 číslic a prázdná hodnota v něm není povolena.', scenarios: 'Vyplnění tohoto pole úzce souvisí s polem Mzda za práci zúčtovaná (ID 10328). Podle nepropustné formální kontroly 28 nesmí být celková zúčtovaná mzda menší než součet jejích složek, včetně tarifní mzdy (ID 10329). Zcela zásadní je nepropustná kontrola 267 (chyba 20267): pokud je Mzda za práci zúčtovaná (ID 10328) rovna 0, nesmí se toto pole vůbec vyplňovat, nesmí obsahovat dokonce ani nulu a musí být z hlášení zcela odstraněno, jinak bude podání systémem DIS odmítnuto jako formálně chybné.' },
            
            
            'odmenypravidelne': { label: 'Prémie a Odměny Pravidelné', desc: 'Pole formuláře sloužící k evidenci prémií a odměn pravidelně měsíčně zúčtovaných se mzdou, platem nebo služebním příjmem. Zahrnují se sem i pohyblivé složky příjmu, jako jsou výkonnostní či motivační odměny, někdy označované jako osobní příplatek. U zaměstnanců pobírajících plat sem patří i každoměsíčně vyplácené příplatky z platového výměru, zejména příplatek za vedení (§ 124 ZP), osobní příplatek (§ 131 ZP) a specializační příplatek pedagogického pracovníka (§ 133 ZP).', format: 'Jednotlivé pole formuláře (ID 10330) spadající do podřízené oblasti pro rozpad zúčtované mzdy. Do pole se zadává výhradně celé nezáporné číslo o délce 1 až 8 číslic.', scenarios: 'Vyplnění pole úzce souvisí s polem Mzda za práci zúčtovaná (ID 10328). Podle nepropustné kontroly 28 nesmí být celková zúčtovaná mzda menší než součet jejích složek, do kterých tyto pravidelné prémie (ID 10330) patří. Zásadní je také nepropustná kontrola 267: pokud je Mzda za práci zúčtovaná (ID 10328) rovna 0, nesmí se toto pole vůbec vyplňovat (nesmí obsahovat ani nulu a nesmí být odesláno), jinak bude podání systémem DIS odmítnuto jako formálně chybné.' },
            
            'odmenynepravidelne': { label: 'Prémie a Odměny Nepravidelné', desc: 'Pole formuláře sloužící k evidenci prémií a odměn nepravidelně zúčtovaných v měsíční mzdě, platu, služebním příjmu nebo odměně z dohody. Zahrnují se sem všechny platby, které nejsou zaměstnanci zúčtovány pravidelně v každém výplatním období, jako jsou například 13. a 14. platy, čtvrtletní, pololetní a různé mimořádné odměny. Nezahrnují se sem však položky, které nemají povahu mzdového plnění.', format: 'Jednotlivé pole formuláře (ID 10331), které spadá do podřízené oblasti pro rozpad zúčtované mzdy. Do pole se zadává výhradně celé nezáporné číslo o délce 1 až 8 číslic a prázdná hodnota není povolena.', scenarios: 'Vyplnění pole úzce souvisí s polem Mzda za práci zúčtovaná (ID 10328). Podle nepropustné kontroly 28 nesmí být celková zúčtovaná mzda menší než součet jejích složek, do kterých tyto nepravidelné odměny (ID 10331) patří. Mimořádně důležitá je také nepropustná kontrola 267: pokud je Mzda za práci zúčtovaná (ID 10328) rovna 0, nesmí se toto pole vůbec vyplňovat (nesmí obsahovat ani nulu a nesmí být odesláno), jinak bude podání systémem DIS odmítnuto jako formálně chybné.' },
            
            
            'nahrady': { label: 'Náhrady', desc: 'Oblast formuláře sloužící k evidenci součtu všech náhrad mzdy, platu, služebního příjmu nebo odměn z dohod, které zaměstnavatel hradí zaměstnanci za neodpracovaný čas. Evidují se zde náhrady za čerpání dovolené (včetně případného proplacení nevyčerpané dovolené při ukončení poměru), placené svátky, překážky v práci na straně zaměstnavatele i zaměstnance a také náhrady při dočasné pracovní neschopnosti placené zaměstnavatelem (vyjma samotných nemocenských dávek).', format: 'Skládá se z celkového pole formuláře Náhrady mzdy zúčtované (ID 10337) a volitelných podřízených polí pro detailní rozpad: Náhrady za dovolenou (ID 10338), Náhrady za svátky (ID 10339), Náhrady - překážky na straně zaměstnavatele (ID 10340), Náhrady - překážky na straně zaměstnance (ID 10341) a Náhrady při dočasné pracovní neschopnosti (ID 10342). Do polí se zadávají celá nezáporná čísla o délce 1 až 8 číslic.', scenarios: 'Vyplnění této oblasti je přísně hlídáno nepropustnou kontrolou 281: pokud je hodnota v celkovém poli Náhrady mzdy zúčtované (ID 10337) nulová nebo nevyplněná, nesmí se podřízená pole pro rozklad náhrad vůbec vyplňovat (nesmí obsahovat dokonce ani nuly), jinak bude podání systémem DIS odmítnuto jako formálně chybné. V případě výjimečného datového scénáře Vězeň se používá pouze speciální odlehčená verze této oblasti.' },
            
            'mzdyzuctovane': { label: 'Náhrady mzdy zúčtované', desc: 'Pole formuláře sloužící k evidenci celkového součtu všech náhrad mzdy, platu, služebního příjmu nebo odměn z dohod, které hradí zaměstnavatel za neodpracovaný čas. Patří sem náhrady za čerpání dovolené, placené svátky a překážky na straně zaměstnance i zaměstnavatele. Nezahrnují se sem však náhrady za dobu dočasné pracovní neschopnosti placené zaměstnavatelem (§ 192 ZP). Pokud zaměstnanec vrací náhradu za vyčerpanou dovolenou, na niž ztratil právo, započte se tato částka do celkového součtu záporně (je odečtena).', format: 'Jednotlivé pole formuláře (ID 10337), které tvoří hlavní sumární položku v podřízené oblasti formuláře pro náhrady. Do pole se zadává výhradně celé nezáporné číslo o délce 1 až 8 číslic a prázdná hodnota není povolena.', scenarios: 'Hodnota v tomto poli úzce souvisí s detailními poli pro rozpad náhrad. Podle nepropustné kontroly 30 nesmí být celkové zúčtované náhrady (ID 10337) menší než součet jejich rozpadnutých složek (ID 10338 + 10339 + 10340 + 10341). Zásadní je také nepropustná kontrola 281: pokud je hodnota v tomto poli (ID 10337) rovna 0, nesmí se podřízená detailní pole pro rozklad náhrad vůbec vyplňovat (nesmí obsahovat dokonce ani nuly a nesmí být odeslána), jinak bude podání systémem DIS odmítnuto jako formálně chybné.' },
                        
            'docasnaneschopnost': { label: 'Náhrady při dočasné pracovní neschopnosti', desc: 'Pole formuláře sloužící k evidenci částky náhrady mzdy, platu nebo odměny z dohod zúčtované k výplatě zaměstnanci za dobu trvání dočasné pracovní neschopnosti nebo karantény placené zaměstnavatelem za daný měsíc. Jedná se výhradně o částky placené zaměstnavatelem podle § 192 zákoníku práce, a proto se sem nezahrnují vyplacené nemocenské dávky. U příslušníků bezpečnostních sborů se zde vykazuje služební příjem v době neschopnosti ke službě podle zvláštních právních předpisů.', format: 'Jednotlivé pole formuláře (ID 10342) spadající do oblasti pro náhrady. Do pole se zadává výhradně celé nezáporné číslo o délce 1 až 8 číslic a prázdná hodnota v něm není povolena.', scenarios: 'Tato náhrada (ID 10342) stojí účetně zcela samostatně a nezahrnuje se do celkové sumy v nadřazeném poli Náhrady mzdy zúčtované (ID 10337). Zásadní je nepropustná formální kontrola 34 hlídající soulad s evidencí pracovní doby: pokud je Počet neodpracovaných hodin z důvodu DPN s náhradou mzdy (ID 10278) větší než nula, musí být i částka v tomto poli pro náhradu při DPN (ID 10342) logicky větší než nula, jinak bude podání systémem DIS striktně odmítnuto jako formálně chybné.' },
            
            'odmeny': { label: 'Odměny', desc: 'Oblast formuláře určená k evidenci specifických odměn zúčtovaných zaměstnanci za sledovaný měsíc, které nespadají do běžného rozpadu mzdy za práci. Mzdová účetní zde eviduje výhradně odměny za pracovní pohotovost podle § 140 zákoníku práce.', format: 'Volitelná podřízená oblast formuláře v rámci hlavní sekce pro mzdu. Skládá se aktuálně z jednoho podřízeného pole formuláře: Odměny za pracovní pohotovost (ID 10343). Do tohoto pole se zadává výhradně celé nezáporné číslo.', scenarios: 'Tato oblast formuláře se vyplňuje a odesílá pouze v situaci, kdy u zaměstnance v daném měsíci reálně nastala potřeba zúčtovat odměnu za pracovní pohotovost. Je nutné dát si pozor, aby sem nebyly omylem zahrnuty běžné prémie a odměny (pravidelné i nepravidelné), které patří do zcela jiné oblasti pro rozpad zúčtované mzdy (oblast mzdaRozpad). U některých specifických datových scénářů, jako je například formulář Vězeň nebo Jiný příjem, se tato oblast vůbec nevyskytuje a nevyplňuje se.' },
            
            'vydelek': { label: 'Výdělek', desc: 'Oblast formuláře sloužící k evidenci údajů k výdělku zaměstnance, konkrétně pro vykazování průměrného (hrubého) hodinového výdělku zjištěného pro náhrady mzdy zaměstnance v daném pracovním poměru podle § 351 a násl. zákoníku práce.', format: 'Podřízená oblast formuláře v rámci hlavní sekce pro mzdu. Funguje jako obalovací element očekávající vnořený podřízený XML tag vydelekPrumernyHod pro pole Průměrný (hrubý) hodinový výdělek (ID 10345), do kterého se zadává vypočtená hodnota peněžní částky.', scenarios: 'Tato oblast se do hlášení zahrnuje, pokud se u zaměstnance vykazuje průměrný hodinový výdělek pro náhrady mzdy. Důležitým účetním pravidlem je povinnost dorovnání: pokud je skutečný zjištěný průměrný výdělek nižší než aktuální minimální mzda nebo příslušná nejnižší úroveň zaručeného platu, na kterou by zaměstnanci v daném měsíci vzniklo právo, musí být ve vnořeném poli odeslána částka uměle navýšená na tuto zaručenou úroveň (totéž platí pro pravděpodobný výdělek).' },
            
            'vydelekprumernyhod': { label: 'Průměrný (hrubý) hodinový výdělek', desc: 'Pole formuláře sloužící k evidenci průměrného hodinového výdělku (vyjádřeného jako peněžní částka v Kč/hod) zjištěného pro náhrady mzdy zaměstnance v daném pracovním poměru podle § 351 a násl. zákoníku práce. Jde o peněžní částku vypočtenou z hrubé mzdy, platu nebo odměn z dohod a odpracované doby za předchozí kalendářní čtvrtletí, která se používá pro výpočet náhrad v následujícím období.', format: 'Jednotlivé podřízené pole formuláře (ID 10345) vnořené v obalovacím tagu vydelek. Do pole se logicky zadává výhradně peněžní částka, nikoliv počet hodin. Technicky se uvádí jako číslo s maximálně 11 číslicemi celkem, z toho mohou být 3 desetinná místa.', scenarios: 'Zásadní legislativní a účetní pravidlo pro tuto peněžní částku spočívá v povinnosti dorovnání: pokud by skutečný zjištěný průměrný výdělek klesl pod úroveň aktuální minimální mzdy nebo příslušné nejnižší úrovně zaručeného platu, nesmí zde mzdová účetní odeslat čistý matematický průměr, ale částku uměle navýšená na tuto státem zaručenou minimální hranici.' },
            
            'pohotovost': { label: 'Odměny Za Pracovní Pohotovost', desc: 'Pole formuláře v podřízené oblasti Odměny (v rámci hlavní oblasti Evidence Mzdy Zúčtované). Mzdovým účetním slouží k přesné evidenci částky zúčtované zaměstnanci za pracovní pohotovost podle § 140 zákoníku práce za sledovaný kalendářní měsíc.', format: 'Nepovinné číselné pole (ID 10343), které se vyplňuje pouze v případě, že u zaměstnance v daném měsíci tato specifická situace reálně nastala a odměna mu byla zúčtována.', scenarios: 'Zásadní účetní chyták pro toto pole spočívá v tom, že Odměny za Pracovní Pohotovost nemají charakter běžné mzdy za vykonanou práci, a proto se striktně nesmí zahrnovat do hlavní částky v poli Mzda Za Práci Zúčtovaná (ID 10328). Musí být vykázány výhradně a odděleně v tomto poli. Stejně jako celá mzdová oblast, i toto pole zcela chybí a nelze jej odeslat u výjimečných datových scénářů, jako je například Jiný Příjem s kódy činnosti skupin 11, 13 a 14.' },
            
            
			
            
            'castkaodvodpojistneho': { label: 'Částka vyměřovacího základu zaměstnance, ze které je odváděno pojistné', desc: 'Pole formuláře v podřízené oblasti pro Vyměřovací základ v Průběhu pojištění určující částku z celkového vyměřovacího základu zaměstnance, z níž zaměstnanec skutečně platí pojistné (ID 10477). Zaměstnanec neplatí pojistné z částky, která u jednoho zaměstnavatele v kalendářním roce přesáhne zákonný maximální vyměřovací základ. Pokud tohoto maxima nebylo dosaženo, je tato částka rovna celkovému Vyměřovacímu základu do ELDP (ID 10245). Z této hodnoty se následně přímo počítá odvod na sociální pojištění zaměstnance (7,1 %) nebo případná sleva na pojistném zaměstnance (6,5 %).', format: 'Číselná hodnota. Nepovinný údaj, který se v případě vyplnění zadává jako celé nezáporné číslo o maximální délce 12 číslic, striktně bez desetinných míst a bez úvodní nuly. (Pozn.: K tomuto údaji neexistuje žádný číselník, zadává se přímo konkrétní částka).', scenarios: 'Vyplňuje se s ohledem na dosažení či nedosažení ročního maximálního vyměřovacího základu. Hodnota tohoto pole slouží jako primární matematický základ, ze kterého systém a kontroly odvozují správnost výpočtu Sociálního pojištění za zaměstnance (ID 10370) a z nějž vychází i výpočet Výše slevy na pojistném u pracujících důchodců (ID 10491) či zaměstnanců v ovocnářství a zelinářství (ID 10547).' },
            
            'prijemnepojistenacinnost': { label: 'Vykázaný příjem z nepojištěné činnosti', desc: 'Pole formuláře v podřízené oblasti pro Průběh pojištění v daném měsíci určené k evidenci zúčtovaného příjmu ze zaměstnání malého rozsahu (ZMR) nebo dohody o provedení práce (DPP), ze kterého se neodvádí pojistné na sociální zabezpečení (ID 10476). Jedná se o tzv. započitatelný příjem pro účely nemocenského pojištění (tj. podlimitní příjem, který by se jinak u zaměstnanců účastných nemocenského pojištění zahrnoval do standardního vyměřovacího základu). Vykazují se zde veškeré příjmy, ze kterých se pojistné neodvádí, přičemž i v případě nulových podlimitních příjmů se do tohoto pole explicitně uvádí hodnota 0.', format: 'Číselná hodnota. Nepovinný údaj, který se v případě vyplnění zadává jako celé nezáporné číslo bez desetinných míst o maximální délce 12 číslic a striktně bez úvodní nuly. (Pozn.: K tomuto poli neexistuje žádný číselník, zadává se přímo konkrétní částka).', scenarios: 'Pole se uplatní primárně u dohod o provedení práce (DPP) a zaměstnání malého rozsahu (ZMR), pokud zúčtovaný příjem v daném měsíci nedosáhl rozhodné částky a zaměstnanci nevznikla účast na pojištění. Údaj je rovněž legislativně i systémově klíčový pro agendu Odložených příjmů. Pokud odložený příjem (např. bonus po skončení PPV) v součtu s příjmem z posledního měsíce výkonu práce nedosáhne rozhodného příjmu pro účast na pojištění, vykáže se tato částka výhradně zde. Dále, pokud je soudně uznána neplatnost ukončení PPV a zaměstnavatel z jakéhokoliv důvodu přiznanou náhradu mzdy nezúčtuje, musí se do tohoto pole vyplnit výše minimální mzdy platné pro dotčené měsíce, aby nedošlo k poškození zaměstnance v rámci nemocenského pojištění.' },
            
            'vymerovacizakladparagraf5': { label: 'Rozpad vyměřovacího základu podle § 5a (Kategorie písmen A / B / C)', desc: 'Hlavní blok formuláře v podřízené oblasti pro Průběh Pojištění v Daném Měsíci, který slouží k přesnému rozpadu celkové částky vyměřovacího základu zaměstnance, ze které je odváděno pojistné (ID 10477). Tento rozpad se provádí podle § 5a odst. 1 zákona č. 589/1992 Sb. (ZPSZ) na specifické kategorie (písmena a, b, c) určující částky vstupující do vyměřovacího základu zaměstnavatele. Z pohledu mzdové účetní se používá primárně u profesí se specifickými sazbami odvodů, jako jsou zdravotničtí záchranáři, členové HZS podniku nebo zaměstnanci vykonávající rizikové zaměstnání.', format: 'Komplexní nepovinný element (kontejner). Sám o sobě neobsahuje žádnou konkrétní číselnou hodnotu, ale striktně v sobě sdružuje tři podřízená pole formuláře: § 5 Písmeno A (ID 10478), § 5 Písmeno B (ID 10479) a § 5 Písmeno C (ID 10480). K samotnému uzlu neexistuje žádný číselník, do podřízených polí se zadávají přímo konkrétní částky ve formátu celého nezáporného čísla bez desetinných míst a bez úvodní nuly o maximální délce 12 číslic.', scenarios: 'Uzel se uplatní u zaměstnanců, u nichž se aplikuje výpočet pojistného za zaměstnavatele dle § 5a ZPSZ. Pokud se tento rozpad vyplňuje a nadřazená Částka odvodu pojistného (ID 10477) je nenulová, musí být dle kontrolního pravidla vyplněno alespoň jedno z podřízených písmen A, B nebo C. Dále platí absolutní a nepropustná validační kontrola: součet zadaných částek pod písmeny A (ID 10478), B (ID 10479) a C (ID 10480) se musí matematicky přesně rovnat částce uvedené v ID 10477. Důležitý procesní chyták pro mzdové účtárny: tento uzel a jeho podřízený rozpad nejsou legislativně podporovány a technicky v XML schématu zcela chybějí v datových scénářích pro Činnosti KS (kódy činnosti K-S, např. společníci, jednatelé, likvidátoři) a pro Pěstouny (kód M). U těchto činností se odpočet neuplatňuje a tagy pro paragraf 5 se nesmí vůbec vykazovat.' },
            'pismenoa': { label: 'Částka Vyměřovacího Základu Zaměstnance Podle § 5a odst. 1 písm. a) ZPSZ (ID 10478)', desc: 'Pole formuláře určené pro vykázání částky vyměřovacího základu zaměstnance (vycházející z celkové částky pro odvod pojistného - ID 10477), která vstupuje do částky vyměřovacího základu zaměstnavatele podle § 5a odst. 1 písm. a) zákona o pojistném na sociální zabezpečení.', format: 'Nepovinné pole formuláře. Pokud se vyplňuje, uvádí se jako celé nezáporné číslo bez desetinných míst o délce 1 až 12 číslic a to vždy bez úvodní nuly.', scenarios: 'Toto pole je součástí podřízené oblasti formuláře pro rozpad vyměřovacích základů. Vyplňuje se v závislosti na povaze pracovněprávního vztahu a druhu činnosti. U specifických oblastí formuláře, jako je například činnost KS (krátkodobé zaměstnání), není toto pole z legislativních důvodů vůbec dostupné a nesmí se vyplňovat.' },
            
            'pismenob': { label: 'Částka Vyměřovacího Základu Zaměstnance Podle § 5a odst. 1 písm. b) ZPSZ (ID 10479)', desc: 'Pole formuláře určené pro vykázání částky vyměřovacího základu zaměstnance (vycházející z celkové částky pro odvod pojistného - ID 10477), která vstupuje do částky vyměřovacího základu zaměstnavatele podle § 5a odst. 1 písm. b) zákona o pojistném na sociální zabezpečení.', format: 'Nepovinné pole formuláře. Pokud se vyplňuje, uvádí se jako celé nezáporné číslo bez desetinných míst o délce 1 až 12 číslic a to vždy bez úvodní nuly.', scenarios: 'Toto pole je součástí podřízené oblasti formuláře pro rozpad vyměřovacích základů. Platí zde striktní kontrola, že součet polí pro písmena a), b) a c) (ID 10478, 10479 a 10480) musí přesně odpovídat celkové částce vyměřovacího základu zaměstnance (ID 10477). U specifických oblastí formuláře, jako je činnost KS (krátkodobé zaměstnání) nebo pěstoun, není toto pole z legislativních důvodů dostupné a rozpad se vůbec nevyplňuje.' },
            
            'pismenoc': { label: 'Částka Vyměřovacího Základu Zaměstnance podle § 5a odst. 1 písm. c) ZPSZ (ID 10480)', desc: 'Pole formuláře určené pro vykázání částky vyměřovacího základu zaměstnance (vycházející z celkové částky pro odvod pojistného - ID 10477), která vstupuje do částky vyměřovacího základu zaměstnavatele podle § 5a odst. 1 písm. c) zákona o pojistném na sociální zabezpečení.', format: 'Nepovinné pole formuláře. Pokud se vyplňuje, uvádí se jako celé nezáporné číslo bez desetinných míst o délce 1 až 12 číslic a to vždy bez úvodní nuly.', scenarios: 'Toto pole je součástí podřízené oblasti formuláře pro rozpad vyměřovacích základů. Zcela totožně jako u předchozích písmen zde platí striktní kontrola, že součet polí pro písmena a), b) a c) (ID 10478, 10479 a 10480) musí přesně odpovídat celkové částce vyměřovacího základu zaměstnance (ID 10477). U specifických oblastí formuláře, jako je činnost KS (krátkodobé zaměstnání) nebo pěstoun, není toto pole z legislativních důvodů dostupné a rozpad se vůbec nevyplňuje.' },
            
            'socialnipojisteni': { label: 'Částka', desc: 'Pole formuláře pro vykazování výše pojistného na sociální zabezpečení a příspěvku na státní politiku zaměstnanosti. Vykazuje se samostatně ve dvou podřízených oblastech: ZA ZAMĚSTNANCE (ID 10370), kde činí 7,1 % z vyměřovacího základu zaměstnance (ID 10477), a ZA ZAMĚSTNAVATELE (ID 10481), kde se uvádí pojistné počítané z vyměřovacího základu zaměstnance jako částka před uplatněním případné slevy na pojistném.', format: 'Číselné pole. Vyžaduje se povinně celé nezáporné číslo bez desetinných míst o délce 1 až 12 číslic, které nesmí začínat úvodní nulou.', scenarios: 'Toto pole je povinné pro pracovněprávní vztahy s účastí na pojištění a vyplňuje se v oblastech PRO POJIŠTĚNÍ ZAMĚSTNANCE A ZAMĚSTNAVATELE. Výpočet je striktně hlídán nepropustnými formálními kontrolami (např. kontrola ID 118 pro ZAMĚSTNANCE a ID 315 pro ZAMĚSTNAVATELE), které v systému DIS ověřují, zda částka přesně odpovídá příslušnému podílu z vyměřovacího základu, a při nesouladu podání odmítnou. U specifických datových scénářů (např. oblast formuláře JINÝ PŘÍJEM u Nepodléhajících Příjmů) jsou tyto podřízená oblasti zcela skryty a pole se vůbec nevyplňuje.' },
            
            'pojistenizamestnanec': { label: 'Pojistné za Zaměstnance', desc: 'Podřízená oblast formuláře v bloku Průběh pojištění v daném měsíci, která je určena pro agregaci údajů o pojistném na sociální zabezpečení, jež je povinen platit samotný zaměstnanec. Toto pojistné se odvíjí a počítá z částky vyměřovacího základu zaměstnance (ID 10477), ze které je pojistné v daném měsíci odváděno.', format: 'Podřízená oblast formuláře. Zapouzdřuje pole formuláře pro exaktní zadání konkrétní výše Sociálního pojištění (ID 10370).', scenarios: 'Tato oblast se vyplňuje u pracovněprávních vztahů, které zakládají účast na sociálním pojištění. Zadaná částka v poli Sociální pojištění podléhá striktní nepropustné kontrole (ID 118 na straně systému DIS), která matematicky ověřuje, zda odvedené pojistné za zaměstnance odpovídá zákonné sazbě (aktuálně 7,1 %) z jeho vykázaného vyměřovacího základu (ID 10477), a to po zaokrouhlení na celé koruny nahoru. V datových scénářích, které pojištění nepodléhají (např. vybrané kódy u formuláře Jiný příjem), je tato podřízená oblast zcela skryta.' },
            
            'pojistenizamestnavatel': { label: 'Pojistné za Zaměstnavatele', desc: 'Podřízená oblast formuláře v bloku Průběh pojištění v daném měsíci, která slouží k vykazování výše pojistného na sociální zabezpečení a příspěvku na státní politiku zaměstnanosti, které by zaměstnavatel platil z vyměřovacího základu zaměstnance. Zásadním mzdovým pravidlem je, že se zde vykazuje výhradně částka před uplatněním jakékoliv případné slevy na pojistném zaměstnavatele.', format: 'Podřízená oblast formuláře. Zapouzdřuje pole formuláře pro zadání exaktní výše Sociálního pojištění (ID 10481).', scenarios: 'Tato oblast se vyplňuje u pracovněprávních vztahů, které zakládají účast na sociálním pojištění. Vyplněná částka v poli Sociální pojištění podléhá striktní nepropustné kontrole (např. kontrola ID 315 v systému DIS), jež matematicky ověřuje, zda částka odpovídá příslušnému procentuálnímu podílu z vyměřovacího základu zaměstnance. U datových scénářů a činností, které sociálnímu pojištění nepodléhají (např. vybrané kódy u oblasti formuláře Jiný příjem), je tato podřízená oblast zcela skryta a pole se nevyplňuje.' },
    
            'slevadite': { label: 'Měsíční Sleva na Děti', desc: 'Částka daňového zvýhodnění uplatněná formou slevy na děti (maximálně do výše vypočtené zálohy na daň po slevě v souladu s § 35c ZDP).', format: 'Celé číslo (1–14 číslic)', scenarios: 'Nepovinný údaj. Vyplňujte měsíčně pouze u zaměstnanců, kteří tuto slevu uplatňují. Při podání přes ePortál se standardně předvyplňuje hodnotou z předchozího období.' },
            'srazkyzemzdyevidovany': { label: 'Srážky z Příjmu - Výkon Rozhodnutí (Ano / Ne)', desc: 'Indikátor, zda zaměstnavatel provádí z příjmu zaměstnance srážky na základě nařízeného soudního nebo správního výkonu rozhodnutí, konkursu nebo dohody o srážkách z příjmu uzavřené podle občanského zákoníku.', format: 'Logická hodnota (Ano / Ne)', scenarios: 'Tento údaj se vykazuje s měsíční periodicitou a je povinný v rámci bloku čisté mzdy (Sekce formuláře Mzda Čistá). Slouží k plnění oznamovací povinnosti vůči ČSSZ, například pro potřeby provádění srážek z dávek nemocenského nebo důchodového pojištění.' },
            
            			
			
            
			
			
            
            'prijmy': { label: 'Příjmy (Souhrnné příjmy zaměstnance)', desc: 'Obalovací (kontejnerový) XML element v rámci Souhrnných Dat Zaměstnance, který sdružuje informace o celkových příjmech. Zahrnuje celkový zúčtovaný příjem (včetně osvobozených příjmů a příjmů podléhajících srážkové dani), osvobozené příjmy a případný rozpad příspěvků zaměstnavatele. Obsahuje podřízené pole formuláře jako Zúčtovaný Příjem - CELKEM (ID 10286), Osvobozené Příjmy ze Zúčtovaných Příjmů - CELKEM (ID 10289), Zúčtovaný příjem - Z Toho Odměny Členů Orgánů Právnických Osob Kteří Jsou Daňovými NEREZIDENTY ČR (ID 10416) a komplexní poduzel Příspěvek Zaměstnavatele (z Osvobozených Příjmů).', format: 'Komplexní XML element (kontejner). Neobsahuje žádné vlastní číselníkové položky, sdružuje výhradně podřízené elementy s číselnými hodnotami (celá nezáporná čísla). U povinného podřízeného elementu <zuctovanoCelkem> přitom platí, že i v případě nulových zúčtovaných příjmů zde musí být exaktně uvedena číselná hodnota nula.', scenarios: 'Vzhledem k umístění v bloku Souhrnná Data Zaměstnance se tento uzel odesílá výhradně u Pracovněprávního Vztahu Označeného jako PRIMÁRNÍ PPV (ID 10495). Dále zde platí striktní nepropustná kontrola 283: Pokud je celkový zúčtovaný příjem v v poli formuláře Zúčtováno CELKEM roven nule, nesmějí podřízená pole formuláře jako Osvobozené Příjmy ze Zúčtovaných Příjmů - CELKEM (ID 10289), Odměny - Nerezident ani žádná pole formuláře sdružené v bloku Příspěvek Zaměstnavatele (z Osvobozených Příjmů) vůbec nabývat hodnot (nesmí se v XML objevit).' },
            
            
            
            'zalohanadan': { label: 'Výpočet zálohy na daň', desc: 'Obalovací (kontejnerový) XML element v rámci souhrnných dat zaměstnance (uzel <souhrnDataZec>), který sdružuje informace o výpočtu zálohy na daň z příjmů fyzických osob ze závislé činnosti. Obsahuje podřízené datové tagy pro základ pro výpočet zálohy na daň <zakladDane> (ID 10297), vypočtenou zálohu na daň <vypoctenaZaloha> (ID 10298), skutečně sraženou zálohu na daň po uplatnění slev <danZalohaPoSleve> (ID 10305) a výši vyplaceného měsíčního daňového bonusu <danBonus> (ID 10306).', format: 'Komplexní XML element (kontejner). Neobsahuje vlastní číselníkové hodnoty, ale sdružuje výhradně číselné podřízené elementy, které očekávají celá čísla o délce 1 až 14 pozic.', scenarios: 'Vzhledem ke svému umístění v uzlu Souhrnná Data Zaměstnance se tento blok vyplňuje a odesílá výhradně u zaměstnání, které je označeno jako primární pracovněprávní vztah (ID 10495). Důležitá aplikační kontrola platí u vnořeného pole Výše vyplaceného měsíčního daňového bonusu (ID 10306), které nesmí nabývat záporných hodnot, a pokud je hodnota kladná, nesmí být nižší než 50 Kč.' },
            
            'vypoctenazaloha': { label: 'Vypočtená záloha na daň', desc: 'Toto pole formuláře (ID 10298) slouží k zápisu částky zálohy na daň z příjmů fyzických osob ze závislé činnosti, kterou zaměstnavatel vypočetl ze základu pro výpočet zálohy na daň zaokrouhleného podle příslušného zákona. Nachází se v podřízené oblasti formuláře Výpočet zálohy na daň uvnitř hlavní oblasti Souhrnná data zaměstnance.', format: 'Nepovinné pole formuláře. Očekává se zápis ve formě celého nezáporného čísla o délce 1 až 14 číslic. K tomuto poli nejsou navázány žádné číselníkové položky.', scenarios: 'Jelikož je toto pole součástí souhrnných dat zaměstnance, lze jej vyplnit výhradně u zaměstnání, které je označeno jako primární pracovněprávní vztah (nepropustná kontrola 248). Dále nesmí být toto pole vyplněno v případech, kdy zaměstnanec nepodepsal prohlášení poplatníka k dani a jeho příjmy podléhají srážkové dani (např. dohody o provedení práce pod stanovený limit) dle logiky kontroly 245. Zadaná hodnota v tomto poli také podléhá kontrole 313, která ověřuje její exaktní matematickou shodu se zadaným základem pro výpočet zálohy na daň.' },
            
            'danzalohaposleve': { label: 'Daň Záloha Po Slevě', desc: 'Toto pole formuláře se v datové větě vyskytuje ve dvou úrovních. Na individuální úrovni zaměstnance (ID 10305) se zapisuje do oblasti Výpočet Zálohy na Daň v Souhrnných Datech Zaměstnance, a značí částku skutečně sražené zálohy po uplatnění slev (např. na děti). Na celofiremní úrovni zaměstnavatele (Úhrn Skutečně Sražených Záloh na Dani po Slevách, ID 10034) se nachází v Souhrnné Části Podání a představuje celkový úhrn sražených záloh přes všechny zaměstnance.', format: 'Na individuální úrovni (ID 10305) jde o nepovinné pole pro celé nezáporné číslo o délce 1 až 14 pozic. Na celofiremní úrovni (ID 10034) jde o striktně povinné pole, kde musí být i v případě nulových záloh exaktně odeslána hodnota "0". Jelikož se jedná o datový typ číslo finanční hodnoty, k tomuto poli formuláře nejsou navázány žádné číselníkové položky.', scenarios: 'Zápis hodnoty u zaměstnance (ID 10305) je vázán pouze na primární pracovněprávní vztah (nepropustná kontrola 248). Zásadní jsou logické kontroly 244 a 245: pokud zaměstnanec nepodepsal prohlášení poplatníka k dani, nesmí být tento tag u zaměstnance vůbec emitován (nesmí nabývat žádných hodnot). Současně platí striktní pravidlo datové integrity, kdy celková částka v souhrnu za zaměstnavatele (ID 10034) musí exaktně odpovídat matematickému součtu všech individuálně vykázaných částek v poli ID 10305 napříč celým podáním.' },
            
            
            
            'zakladnisleva': { label: 'Základní sleva na poplatníka', desc: 'Toto pole formuláře (ID 10299) představuje částku měsíční slevy na dani na poplatníka podle zákona o daních z příjmů (jedná se o 1/12 roční základní slevy, např. pro rok 2024 to činilo 2 570 Kč). Zapisuje se v podřízené oblasti formuláře Prohlášení poplatníka daně z příjmů ze závislé činnosti, která spadá pod oblast Výpočet zálohy na daň uvnitř hlavní oblasti Souhrnná data zaměstnance. Tuto položku lze vyplnit pouze v případě, že zaměstnanec učinil u zaměstnavatele prohlášení k dani.', format: 'Nepovinné pole formuláře. Očekává se zápis ve formě celého nezáporného čísla o délce 1 až 14 číslic. Vzhledem k tomu, že jde o exaktní číselnou peněžní částku, nejsou k tomuto poli navázány žádné číselníkové položky.', scenarios: 'Vyplnění pole je striktně vázáno na zaměstnání označené jako primární pracovněprávní vztah (nepropustná kontrola 248). Dále je zcela závislé na hodnotě zadané v poli Prohlášení poplatníka (ID 10419). Pokud zaměstnanec prohlášení nepodepsal (hodnota NE), nesmí se toto pole ve formuláři vůbec objevit a nabývat hodnot (nepropustná kontrola 244). Pokud je naopak prohlášení podepsáno (hodnota ANO), aktivuje se nepropustná kontrola 318, podle které musí toto pole nabývat exaktně buď aktuální plné zákonné výše základní slevy, nebo přesně nulové hodnoty.' },
            
            'prohlasenipoplatnikadane': { label: 'Uplatněné Slevy a Daňová Zvýhodnění (Detail Prohlášení)', desc: 'Tento blok formuláře se vyskytuje v rámci oblasti Výpočet Zálohy na Daň uvnitř hlavní oblasti Souhrnná Data Zaměstnance. Tento blok sdružuje veškeré uplatněné slevy na dani a daňová zvýhodnění poplatníka. Konkrétně obsahuje podřízená pole jako Základní sleva na poplatníka (ID 10299), Základní sleva na invaliditu I. a II. stupně (ID 10300), Rozšířená sleva na invaliditu III. stupně (ID 10301), Sleva na držitele průkazu ZTP/P (ID 10302), Měsíční daňové zvýhodnění na děti (ID 10303), Měsíční sleva na děti (ID 10304) a další podřízený kontejner sdružující detaily o vyživovaných dětech a jiných vyživujících osobách ve společné domácnosti.', format: 'Komplexní blok formuláře (kontejner). Neobsahuje přímo žádné vlastní číselníkové hodnoty, ale funguje výhradně jako obálka pro podřízené elementy s datovými hodnotami, jimiž jsou typicky celá nezáporná čísla představující peněžní částky slev a zvýhodnění v Kč.', scenarios: 'Zásadní je provázanost s polem Prohlášení poplatníka daně (ID 10419). Na základě nepropustné kontroly 244 platí, že pokud zaměstnanec prohlášení nepodepsal (hodnota NE), je striktně zakázáno tento uzel a jeho podřízená pole do datové věty vůbec vkládat. Stejně tak platí obecná kontrola 248, že tento blok smí být obsažen pouze u zaměstnání označeného jako primární pracovněprávní vztah. Specifické pravidlo (kontrola 243) se pak týká daňových nerezidentů (kód státu rezidenství jiný než CZ): i pokud mají prohlášení podepsáno, smí se v tomto bloku uplatnit výhradně základní sleva na poplatníka (ID 10299), ostatní slevy a daňová zvýhodnění zde nesmí být vůbec vykázány.' },
            
            'mzdacista': { label: 'Mzda Čistá (Čistý Příjem)', desc: 'Blok formuláře v rámci Souhrnných Dat Zaměstnance. Tento blok sdružuje údaje o čistém příjmu zaměstnance a informace o prováděných srážkách. Vždy obsahuje podřízené datové pole pro samotný čistý příjem (ID 10344) a logický příznak pro evidenci srážek ze mzdy (ID 10116). U specifických scénářů chráněného trhu práce se větví i na komplexní poduzly pro výdělek osob OZP (<vydelekOZP>) a detailní srážky (<srazky>).', format: 'Komplexní XML element (kontejner). Neobsahuje přímo žádné vlastní číselníkové hodnoty, ale funguje výhradně jako obálka pro sdružení podřízených datových elementů.', scenarios: 'Vzhledem ke svému umístění uvnitř uzlu Souhrnná data zaměstnance (<souhrnDataZec>) se tento obalovací blok smí ve formuláři vyplnit a odeslat výhradně u zaměstnání, které je aktuálně označeno jako primární pracovněprávní vztah (ID 10495).' },

'@nam': { label: 'Název / Rodné Příjmení (Sdružený Atribut)', desc: 'Silně přetížený textový atribut. Podle toho, ve kterém uzlu údajů se nachází, znamená: Rodné Příjmení v uzlu Rodné Údaje (ID 10063), Název Zaměstnavatele v uzlu Identifikace Zaměstnavatele (ID 10120), Jméno Cizozemského Nositele Pojištění v uzlu Informace o Cizozemském Nositeli Pojištění (ID 10093), a Název Současného (ID 10103) či Předchozího Orgánu (ID 10104) Nemocenského Pojištění u Ozbrojených Složek.', format: 'Textový (A, ZX, SP) s proměnlivou délkou (1-50 znaků u rodného příjmení, až do 150 znaků pro název organizace).', scenarios: 'Kritické pravidlo: V bloku Identifikace Zaměstnavatele (ID 10120) je Název Zaměstnavatele (ID 10120) vždy tvrdě povinný u všech akcí A1-A8. Účetní chyták u uzlu Rodné Údaje (Rodné Příjmení, ID 10063): Pokud zaměstnanec jméno neměnil, mzdový software SALARY sem běžně jako výchozí stav překopíruje hodnotu aktuálního Příjmení. Účetní chyták u cizích institucí: Názvy Nemocenského Pojištění (10103 / 10104) se vyplňují pouze u Převodů Vojáků / Policistů, a nikoli u běžných civilistů!' },


'@cit': { label: 'Obec / Místo (Sdružený adresní atribut)', desc: 'Univerzální pole formuláře REGZEC pro lokalizaci. Označuje Obec u všech typů adres: Trvalý pobyt (ID 10080), Pobyt v ČR (ID 10516), Kontaktní adresa (ID 10509), Adresa rezidentství (ID 10523) a Adresa cizí pojišťovny (ID 10097). Mimo adresy navíc definuje Místo narození klienta v bloku <birth> (ID 10066) a Název obce místa výkonu práce v bloku <job> (ID 10528).', format: 'Textový (A, NN, ZL, SP), délka 1-50 znaků.', scenarios: 'Chyták na adresy: U změn (akce A3/A4) jsou adresy nepovinné. Pokud ale vyplníte byť jen jedinou část adresy, rázem se Město/Obec stává striktně povinnou položkou napříč celou rozdělanou adresou. U cizinců navíc Místo narození (ID 10066) částečně nahrazuje chybějící rodné číslo a je při nástupu tvrdě povinné.' },


'@str': { label: 'Ulice (Sdružený adresní atribut)', desc: 'Objevuje se jako název ulice ve všech vnořených strukturách pro adresy: Trvalý pobyt (ID 10077), Pobyt v ČR u cizinců (ID 10513), Kontaktní adresa (ID 10506), Adresa ve státě rezidence (ID 10519) a Adresa cizozemského nositele pojištění (ID 10094).', format: 'Textový (A, NN, ZZ, SP), délka 1-50 znaků.', scenarios: 'Zrádná položka: Jedná se o volitelný prvek (jelikož mnoho obcí v ČR ulice nevede). Chyták je v tom, že jakmile jej do XML vyplníte, aktivujete tím celou skupinovou povinnost dané adresy a systém bude padat, pokud nepošlete také obec, PSČ a číslo popisné.' },


'@num': { label: 'Číslo popisné / Doklad', desc: 'Komplexní položka REGZEC formuláře. V uzlech adres reprezentuje Číslo popisné: Trvalý pobyt (ID 10078), Pobyt v ČR (ID 10514), Kontaktní adresa (ID 10507), Adresa rezidence (ID 10520) a Cizí pojišťovna (ID 10095). Avšak mimo adresy reprezentuje Číslo daňového identifikátoru klienta v uzlu <taxidrezid> (ID 10062) a Číslo průkazu totožnosti v uzlu <proofid> (ID 10070).', format: 'Alfanumerický (dle uzlu), pro adresy délka do 12 znaků, pro identifikátory maximálně do 20 znaků.', scenarios: 'Největší chyták celého REGZEC pro adresy: Pokud se jedná o českou adresu (stát je "CZ"), systém vynucuje maximální délku 4 znaky a povoluje zde JEN A POUZE číslice! U Daňového identifikátoru (10062) se tento tag musí odeslat vždy, když kód státu rezidentství je vyplněn jinak než CZ.' },


'@onum': { label: 'Číslo orientační (Sdružený adresní atribut)', desc: 'Doplňkový údaj o čísle domu u všech typů evidovaných adres (ID 10079, 10515, 10508, 10521 a 10096).', format: 'Alfanumerický (A, NN, ZZ), délka 1-12 znaků.', scenarios: 'Atribut je plně nepovinný. Účetní chyták se projevuje u akce A3 (Změna): Pokud hlásíte pouze změnu tohoto orientačního čísla, musíte přesto k němu do balíčku povinně nabalit minimálně Obec, Číslo popisné, PSČ a Stát dané adresy, jinak ePortál dávku zamítne.' },


'@pnu': { label: 'Poštovní směrovací číslo (PSČ)', desc: 'Směrovací kód pošt v adresních uzlech Trvalého pobytu (ID 10082), Pobytu v ČR (ID 10517), Kontaktní adresy (ID 10510), Adresy rezidence (ID 10522) a Adresy cizozemského nositele pojištění (ID 10098).', format: 'Numerický/Alfanumerický, délka 1-11 znaků.', scenarios: 'Účetní pravidlo: U tuzemské české adresy (kód CZ) vyžaduje systém formát přesně pět po sobě jdoucích číslic bez mezer. Existuje zde hard-kontrola, kdy první číslice PSČ nesmí NIKDY začínat na 8, 9 nebo 0.' },


'@ruianpoint': { label: 'Kód adresního místa RÚIAN', desc: 'Identifikátor z registru nemovitostí. Lze jej vložit do adres Trvalého pobytu (ID 10076), Pobytu v ČR (ID 10512) a Kontaktní adresy (ID 10505).', format: 'Číselný (N), délka 9 znaků.', scenarios: 'Zajímavost a validační zkratka: Ačkoliv jde o technický nepovinný tag, je-li software SALARY  do podání vygenerován, činí všechny ostatní atributy adresy povinnými pro validaci. U adres, které RÚIAN nemají (zahraniční), se striktně vynechává.' },


'@stat': { label: 'Stát (Narození / Rezidentství / Vydání dokladu)', desc: 'Identifikátor suverénního státu nezávislý na adresách. Znamená Stát narození v uzlu <birth> (ID 10065), Kód státu daňového rezidentství v uzlu <taxidrezid> (ID 10068) a Stát vydání cizozemského průkazu totožnosti v uzlu <proofid> (ID 10072).', format: 'Textový kód (A), přesně 2 znaky napojené na číselník C_STAT.', scenarios: 'Velký chyták pro Daňovou rezidenci (ID 10068): Tento stát musí být reportován VŽDY u všech nástupů (A1) a hlášení změn (A3), a to včetně českých občanů (posílá se CZ). Oproti tomu Stát vydání dokladu (ID 10072) posíláte výhradně a pouze za cizince pro účely mezinárodní výměny informací VDA.' },


'@cnt': { label: 'Kód státu (Občanství / Stát adresy)', desc: 'Druhý typ státního identifikátoru. Určuje Státní občanství klienta v bloku <stat> (ID 10067) a dále kód Státu u většiny adres: Trvalý pobyt (ID 10083), Kontaktní adresa (ID 10511), Adresa rezidence (ID 10524) a Adresa cizí pojišťovny (ID 10099).', format: 'Textový kód (A), přesně 2 znaky (číselník C_STAT).', scenarios: 'Logická past mezi státy: Pokud u Státního občanství (ID 10067) vyplníte "CZ", stává se RČ naprosto povinné. Pokud u adresy trvalého pobytu vložíte jiný stát než "CZ", nutí vás to založit a poslat ještě navíc strukturu adresy Pobytu v ČR (<fdr>). U adresy Pobytu v ČR tag státu (@cnt) vůbec nenajdete, protože je z logiky věci zamknutá na Česko.' },



'@type': { label: 'Typ záznamu (Identifikace / Doklad / Omezení)', desc: 'Řídící klasifikátor bloku. V uzlu <taxidrezid> definuje Typ daňové identifikace (ID 10061, např. DIČ či Social Security), v uzlu <proofid> udává Typ dokladu cizince (ID 10069, např. Pas), a v uzlu <healtrest> klasifikuje Typ zdravotního omezení / Invalidity (ID 10085).', format: 'Číselníkové hodnoty.', scenarios: 'Chyták u Invalidity (ID 10085): Účetní hlásí kódy z nového číselníku pro stupně invalidity (I. až III.) nebo OZZ. Změny těchto kódů se plnohodnotně hlásí pomocí běžné akce A3. U Dokladů totožnosti (10069) si dávají účetní pozor – týká se to pouze cizinců, české OP si stát páruje automaticky.' },






'@fro': { label: 'Datum OD (Sdružený časový atribut počátku)', desc: 'Zastupuje datum počátku úkonu. Jde o Platnost akce / Změna ze dne (ID 10009), Datum nástupu do zaměstnání (ID 10223), Zdravotní omezení přiznané od (ID 10086), Doba trvání cizího pracovního oprávnění od (ID 10109) a Počátek intervalu důchodového pojištění (ID 10386).', format: 'Datum (RRRR-MM-DD).', scenarios: 'Největší chyták systému: Atribut Platnost akce OD (ID 10009) se absolutně NESMÍ vyplnit u nového nástupu (A1) a skončení (A2), dává se výhradně u změn a oprav! U Invalidity (10086) se zase NIKDY nesmí zadat datum nástupu do firmy, ale výhradně skutečné datum, kdy orgán SSZ přiznal status ZTP nebo invalidity.' },


'@to': { label: 'Datum DO (Sdružený časový atribut konce)', desc: 'Univerzální atribut zastupující datum konce daného úkonu. Podle kontextu zahrnuje: Datum skončení zaměstnání (ID 10224), Zdravotní omezení přiznané do (ID 10087), Trvání pracovního oprávnění cizince do (ID 10110) a Dobu trvání důchodového pojištění ze zaměstnání do (ID 10387).', format: 'Datum (RRRR-MM-DD).', scenarios: 'Mzdový chyták č. 1 (Konec zaměstnání): Datum skončení zaměstnání (ID 10224) se logicky hlásí přes Odhlášku (akce A2). Jakmile ho vyplníte, systém automaticky zaktivuje povinnost doplnit i podklady pro Úřad práce. Výjimku lze nastavit pouze použitím správného kódu pro Důvod neposkytnutí podkladů (ID 10376). Mzdový chyták č. 2 (Průběžné změny): Vypršení platnosti dokumentů u cizinců (10110) nebo u invalidity/OZZ (10087) může nastat kdykoliv během pracovněprávního vztahu. Jakmile dokument vyprší, nebo dojde k jeho prodloužení, musí se nová hodnota bezodkladně odeslat nezávisle přes ePortál pomocí akce Změna (A3).' },



'@mal': { label: 'Pohlaví', desc: 'Fyzický atribut biologického pohlaví klienta z bloku stat (ID 10059).', format: 'Textový/Alfabetický, délka 1 znak.', scenarios: 'Může nabývat výhradně logických hodnot "M" a "Ž". Systém jej při příjmu tvrdě křížově validuje s přiděleným rodným číslem (kontrola na připočítané padesátky v měsíci u žen), což rovnou odhaluje překlepy.' },


'@vs': { label: 'Variabilní symbol zaměstnavatele', desc: 'Identifikační znak plátce (mzdové účtárny) přidělený příslušnou okresní správou (ID 10221).', format: 'Číselný typ (N), délka 8 až 10 znaků (Luhnův algoritmus).', scenarios: 'Je zcela povinný u všech procesních akcí podání REGZEC (A1-A8).' },


'@nvs': { label: 'Nový variabilní symbol', desc: 'Doplňkový identifikátor organizační složky nebo cizí mzdové účtárny, pod kterou je zaměstnanec po fúzi nebo vnitropodnikové změně nově převáděn (ID 10222).', format: 'Číselný typ (N), délka 8-10 znaků s kontrolou modulo.', scenarios: 'Vyplňuje se exkluzivně pouze při speciální akci A5 (Převod zaměstnance k jinému VS). Logický chyták: Nově vyplněný symbol se při převodu na vstupu do ČSSZ nesmí nikdy shodovat s původním variabilním symbolem z téže dávky.' },




'@oid': { label: 'ID pojistného vztahu (Identifikátor zaměstnání)', desc: 'Jedinečný technický identifikátor konkrétního pracovněprávního vztahu generovaný systémem ČSSZ (ID 10228).', format: 'Číselný typ (N), maximální délka 22 znaků.', scenarios: 'Zcela se vynechává u Nástupu (A1), protože ještě nebylo přiděleno. Je však striktně povinné u všech oprav, změn a odhlášek (A2-A8), kde tvoří naprosto klíčový párovací identifikátor.' },


'@fro': { label: 'Datum OD (Sdružený časový atribut počátku)', desc: 'Zastupuje Datum nástupu do zaměstnání (ID 10223) a Datum přiznání zdravotního omezení od (ID 10086).', format: 'Datum (RRRR-MM-DD).', scenarios: 'Datum nástupu je povinné u všech akcí. U cizinců nesmí přesáhnout 8 dnů do budoucna. U zdravotního omezení se nejedná o nástup do firmy, ale striktně o datum právní moci posudku.' },




'@rel': { label: 'Druh činnosti', desc: 'Klasifikátor typu výdělečné činnosti z číselníku ČSSZ (ID 10239).', format: 'Alfanumerický kód, délka 1-2 znaky.', scenarios: 'Zásadní chyták u oprav (A4): Systém nedovolí překlopit běžný pracovní poměr (kódy 1-9) na specifické právní vztahy (např. společník) a naopak. Pro nápravu takové chyby se musí odeslat Storno (A8) a založit nový Nástup (A1).' },


'@relDetail': { label: 'Bližší určení PPV', desc: 'Vynucený detailní rozpad pro standardní druhy činnosti k odlišení specifických úředníků (ID 10502).', format: 'Číselníková hodnota (1 = Žádné, 2 = Výkon trestu, 3 = Pracovní vztah spec. skupiny).', scenarios: 'Těžký chyták na uživatele mzdových systémů: Pokud je hlášen klasický druh činnosti s kódem 1-9, je tento element povinný. Běžná firma zde tak rutinně musí vždy odeslat hodnotu "1" (Žádné).' },


'@sme': { label: 'Zaměstnání malého rozsahu (ZMR)', desc: 'Indikátor pracovního vztahu, kde sjednaný příjem formálně nedosahuje rozhodné částky (ID 10243).', format: 'Logický příznak.', scenarios: 'Účast na pojištění a odvody se aktivují střídavě v měsících dosažení limitu. Odhláška (A2) u ZMR se ovšem na ČSSZ odesílá nikoliv podle konce účasti, ale zásadně až po vypršení faktického data kontraktu.' },

'@notstart': { label: 'Zaměstnanec nenastoupil', desc: 'Příznak u Storna pročišťující evidenci, jestliže k výkonu podepsaného PPV fyzicky vůbec nedošlo (ID 10226).', format: 'Logický příznak.', scenarios: 'Odesílá a objevuje se naprosto exkluzivně pouze tehdy, když do sítě ČSSZ emitujete Výmaz zaměstnání pod akcí A8.' },


'@contractfro': { label: 'Vznik zaměstnání', desc: 'Právně stanovené datum vzniku pracovněprávního vztahu vyznačené ve fyzické smlouvě (ID 10227).', format: 'Datum (RRRR-MM-DD).', scenarios: 'Stát tento tag využívá v případech, kdy k faktickému výkonu práce dochází až dny/týdny po formálním podpisu (např. v případě nemoci před nástupem).' },


'@relat': { label: 'Postavení v zaměstnání', desc: 'Statistický klíč určující typ pracovněprávního vztahu z Národní klasifikace postavení v zaměstnání (ID 10249).', format: 'Čtyřmístný kód (číselník NKPZ).', scenarios: 'Atribut odebíraný primárně pro strukturální statistiky a Český statistický úřad (ISPV).' },


'@workmode': { label: 'Pracovní režim', desc: 'Identifikátor směnnosti fondu konkrétního pracovníka (ID 10255).', format: 'Číselníkový kód (1 = Jednosměnný, 2 = Dvousměnný, atd.).', scenarios: 'Zákeřné pro dohody mimo pracovní poměr: U dohodářů (DPP a DPČ) musíte v softwaru vždy bezpodmínečně vybrat kód "4 - Neuvedeno".' },


'@cont': { label: 'Nepřetržitý provoz', desc: 'Logický příznak nasazení pracovníka do režimu, který zajišťuje nepřetržitý chod podniku (ID 10407).', format: 'Logický příznak.', scenarios: 'Slouží k monitoringu pro Inspekci práce při auditech fondů přesčasů a směnností.' },


'@place': { label: 'Práce probíhá převážně', desc: 'Lokalizace faktického výkonu směn u OZP (v provozovně, u zákazníka, doma) (ID 10258).', format: 'Číselníkový kód z CIS Průběh práce.', scenarios: 'Složitá křížová podmínka: Mzdová účetní jej smí odeslat pouze tehdy, když je podnik uznán na chráněném trhu práce a občan má zároveň přiznán určitý typ zdravotního omezení (ID 10085).' },


'@preplace': { label: 'Předpokládané místo výkonu práce', desc: 'Slovní doplňující geolokace pro cizince, u kterých nelze místo určit jedinou adresou (ID 10526).', format: 'Textový typ, max 500 znaků.', scenarios: 'Past pro personalisty cizinců: Tento text nesmí přesáhnout hranice území, které jste předtím reportovali na inzerátu Úřadu práce pro vydání Modré/Zaměstnanecké karty.' },


'@contractplace': { label: 'Místo výkonu práce (smlouva)', desc: 'Přesný opis ujednání umístění pracoviště dle pracovní smlouvy (ID 10527).', format: 'Textový typ, max 200 znaků.', scenarios: 'Metodické omezení JMHZ: U dohod (DPP/DPČ) nebo u smluv typu "celá ČR" sem nesmíte vypsat ony obce, ale musíte vyplnit výhradně legislativní sídlo zaměstnavatele.' },





'@municode': { label: 'Kód obce (místo výkonu)', desc: 'Šestimístný statistický klíč obce převzatý do JMHZ z registru RÚIAN/CIS_OBCE (ID 10529).', format: 'Číselný kód o 6 znacích.', scenarios: 'Vyžadováno pro státní a demografické statistiky a k přerozdělení daní Finanční správou.' },


'@clas': { label: 'Kód profese (CZ-ISCO)', desc: 'Klasifikátor převažující pracovní náplně pozice podle evidence ČSÚ (ID 10234).', format: 'Numerický, délka 3-5 znaků.', scenarios: 'Systém neakceptuje ledabylé vyplnění jedním číslem. Účetní u nástupu volí exaktní kód (minimálně 3 znaky nadřazené větve) přímo z CIS Klasifikace zaměstnání.' },


'@edu': { label: 'Vzdělání pro profesi', desc: 'Určuje minimální formální stupeň vzdělání, který firma nutně požaduje pro výkon povolaní (ID 10248).', format: 'Znak z číselníku KKOV.', scenarios: 'Nejhorší validátor pro cizineckou politiku: Skutečně dosažené vzdělání cizince (ID 10091) nesmí matematicky klesnout pod hodnotu požadovanou pro vízum v tomto tagu, jinak je balík nemilosrdně zamítnut.' },


'@name': { label: 'Název Pozice', desc: 'Běžný domácký či vnitropodnikový interní název uvedený v reálné smlouvě klienta (ID 10235).', format: 'Text, max 100 znaků.', scenarios: 'Toto pole REGZEC formuláře je nepovinný, ovšem s háčkem. Pokud sem mzdový software SALARY natáhne název pozice, vynutí si tím od uživatele automaticky i vyplnění numerického kódu klasifikace CZ-ISCO.' },


'@lead': { label: 'Vedoucí zaměstnanec', desc: 'Příznak udávající, že pozice disponuje pravomocemi řídit podřízené pracovníky (ID 10238).', format: 'Logický příznak ANO / NE.', scenarios: 'Slouží čistě pro podklady o strukturálních rozdílech ve mzdách v ČR.' },

    // --- 2. FUNKCE PRO VYKRESLENÍ MODÁLU ---
    window.showJmhzInfoModal = function(key) {
        const info = window.JMHZ_INFO_DICTIONARY[key];
        if (!info) return;
        
        let modal = document.getElementById('jmhz-info-modal');
        if (!modal) {
            modal = document.createElement('div');
            modal.id = 'jmhz-info-modal';
            modal.className = 'info-modal-backdrop';
            modal.innerHTML = `
                <div class="info-modal-dialog">
                    <div class="info-modal-header">
                        <h3 class="info-modal-title" id="info-modal-title"></h3>
                        <button class="info-modal-close-icon" onclick="document.getElementById('jmhz-info-modal').classList.remove('active')">&times;</button>
                    </div>
                    <div class="info-modal-body">
                        <div class="info-modal-section">
                            <p id="info-modal-desc"></p>
                        </div>
                        <div class="info-modal-section" id="info-modal-format-wrapper">
                            <h4>Struktura a Formát</h4>
                            <p id="info-modal-format"></p>
                        </div>
                        <div class="info-modal-section" id="info-modal-scenario-wrapper">
                            <h4>Pravidla a Scénáře vyplnění</h4>
                            <p id="info-modal-scenario"></p>
                        </div>
                    </div>
                    <div class="info-modal-footer">
                        <button class="info-modal-btn-close" onclick="document.getElementById('jmhz-info-modal').classList.remove('active')">Zavřít Infohlášku</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        }
        
        document.getElementById('info-modal-title').textContent = info.label;
        document.getElementById('info-modal-desc').innerHTML = info.desc;
        
        const formatWrapper = document.getElementById('info-modal-format-wrapper');
        if (info.format) {
            document.getElementById('info-modal-format').innerHTML = info.format;
            formatWrapper.style.display = 'block';
        } else {
            formatWrapper.style.display = 'none';
        }
        
        const scenarioWrapper = document.getElementById('info-modal-scenario-wrapper');
        if (info.scenarios) {
            document.getElementById('info-modal-scenario').innerHTML = info.scenarios;
            scenarioWrapper.style.display = 'block';
        } else {
            scenarioWrapper.style.display = 'none';
        }
        
        modal.classList.add('active');
    };

    // --- 3. FUNKCE PRO START INJEKTORU ---
    // Tuto funkci zavoláme bezpečně AŽ po inicializaci celé aplikace
    function startInfohlaskyInjector() {
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length) {
                    
                    // A. Injekce do řádků polí formuláře podle XML Tagu z XPath
                    const fieldRows = document.querySelectorAll('.field-table tr:not(.info-injected)');
                    fieldRows.forEach(function(row) {
                        const labelEl = row.querySelector('.field-label');
                        const xpathEl = row.querySelector('.xpath');
                        
                        if (labelEl && xpathEl) {
                            // Vezmeme plnou cestu, např. "souhrnDataZec/zdravPojZamestnavatel/zdravotniPojisteni"
                            const fullPath = xpathEl.textContent.trim();
                            if (fullPath) {
                                // Rozdělíme podle lomítek a získáme úplně poslední část (samotný tag)
                                const pathParts = fullPath.split('/');
                                const xmlTag = pathParts[pathParts.length - 1].toLowerCase();
                                
                                // Porovnáme tag s klíči ve slovníku
                                if (window.JMHZ_INFO_DICTIONARY[xmlTag]) {
                                    const btn = document.createElement('span');
                                    btn.className = 'info-icon-btn';
                                    btn.innerHTML = 'i';
                                    btn.title = 'Zobrazit Infohlášku';
                                    btn.onclick = function(e) { e.stopPropagation(); window.showJmhzInfoModal(xmlTag); };
                                    
                                    // Vložíme ikonku k popisku pole
                                    labelEl.appendChild(btn);
                                }
                            }
                        }
                        row.classList.add('info-injected');
                    });

                    // B. Injekce do hlaviček sekcí (hlavní bloky formuláře)
                    // Protože UI hlaviček sekcí nevypisuje přímo XML XPath tagy jako u polí, 
                    // provedeme mapování z titulků sekcí na konkrétní tagy (podle vašeho zadání).
                    const sectionHeaders = document.querySelectorAll('.section-header .section-title:not(.info-injected)');
                    sectionHeaders.forEach(function(header) {
                        const titleText = header.textContent.trim().toLowerCase();
                        
                        // Ruční mapování textů z hlaviček na XML tagy z vaší databáze
                        const sectionMap = {
                            'daňové zvýhodnění': 'zvyhodnenidetimesic',
                            'seznam eldp': 'eldpseznam',
                            'záznam evidenčního listu': 'eldp',
                            'souhrnná data zaměstnance': 'souhrndatazec',
                            'vykonávaná pozice': 'vykonavanapozice',
                            'průběh zaměstnání': 'prubehzamestnani',
                            'evidence mzdy': 'mzda'
                        };

                        for (const [textMatch, xmlKey] of Object.entries(sectionMap)) {
                            if (titleText.includes(textMatch) && window.JMHZ_INFO_DICTIONARY[xmlKey]) {
                                const btn = document.createElement('span');
                                btn.className = 'info-icon-btn';
                                btn.innerHTML = 'i';
                                btn.onclick = function(e) { e.stopPropagation(); window.showJmhzInfoModal(xmlKey); };
                                header.appendChild(btn);
                                break; 
                            }
                        }
                        header.classList.add('info-injected');
                    });

                }
            });
        });

        // Nyní bezpečně sledujeme kontejner "app", který už jádro inicializovalo
        const appContainer = document.getElementById('app');
        if (appContainer) {
            observer.observe(appContainer, { childList: true, subtree: true });
        }
    }

    // --- 4. ZAVADĚČ APLIKACE A SPUŠTĚNÍ ---
    (function () {
        const loaderText = document.getElementById('loader-text');
        const loaderTitle = document.getElementById('loader-title');
        const loaderSpinner = document.getElementById('loader-spinner');
        
        function log(msg) { loaderText.textContent = msg; }
        function showError(msg) {
            loaderSpinner.style.display = 'none';
            loaderTitle.textContent = 'Kritická chyba';
            loaderTitle.style.color = '#dc2626';
            loaderText.innerHTML = msg;
            loaderText.className = 'loader-error';
        }

        function loadScript(url) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = url;
                s.onload = resolve;
                s.onerror = () => reject(new Error('Nepodařilo se stáhnout soubor: <b>' + url + '</b>'));
                document.head.appendChild(s);
            });
        }

        log('Vyhledávání konfiguračního souboru (manifest.js)...');
        
        const ms = document.createElement('script');
        ms.src = 'manifest.js?t=' + Date.now();
        
        ms.onload = function () {
            const m = window.__JMHZ_MANIFEST__;
            if (!m) { 
                showError('Soubor <b>manifest.js</b> byl načten, ale neobsahuje platná data konfigurace.'); 
                return; 
            }
            
            const f = m.files || {};
            const r = (name) => f[name] || name;

            log('Načítání WebAssembly modulu pro validaci XML...');
            
            loadScript(r('vendor/xmllint-wasm-bundle.js'))
                .then(() => {
                    log('Načítání datových XSD schémat...');
                    return Promise.all([
                        loadScript(r('data/xsd-data.js')),
                        loadScript(r('data/jmhz-xsd-data.js'))
                    ]);
                })
                .then(() => {
                    log('Načítání kontrolních mechanismů...');
                    return Promise.all([
                        loadScript(r('assets/formats.js')),
                        loadScript(r('assets/kontroly-utils.js')),
                        loadScript(r('assets/mh-kontroly.js')),
                        loadScript(r('assets/regzec-kontroly.js'))
                    ]);
                })
                .then(() => {
                    log('Spouštění jádra aplikace (Viewer Runtime)...');
                    return loadScript(r('assets/viewer.runtime.js'));
                })
                .then(() => {
                    const target = document.getElementById('app');
                    if (window.JMHZViewerRuntime) {
                        // 1. Vyčistíme loader a předáme kontejner aplikaci
                        target.innerHTML = ''; 
                        window.JMHZViewerRuntime.mount(target, { manageDocumentTitle: true, warnBeforeUnload: true });
                        
                        // 2. Aplikace běží, zapínáme detekci Injekcí Infohlášek!
                        startInfohlaskyInjector();
                    } else {
                        throw new Error('Jádro aplikace (JMHZViewerRuntime) nebylo nalezeno v načtených skriptech.');
                    }
                })
                .catch(err => {
                    showError(err.message + '<br><br>Zkontrolujte, zda máte na FTP vytvořené správné složky (assets, data, vendor).');
                    console.error(err);
                });
        };
        
        ms.onerror = () => showError('Soubor <b>manifest.js</b> nebyl na serveru nalezen.<br>Ujistěte se, že leží ve stejném adresáři jako tento HTML soubor.');
        
        document.head.appendChild(ms);
    })();
</script>
