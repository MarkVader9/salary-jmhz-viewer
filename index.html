			'pojistenido': { label: 'Pojištění Do (Trvání Účasti Na Nemocenského Pojištění v Daném Měsíci)', desc: 'Toto datové pole formuláře (ID 10355) slouží k vykázání dne skončení účasti zaměstnance na nemocenském pojištění nebo exaktního dne celkového skončení zaměstnání. Mzdová účetní zde uplatňuje zrcadlové pravidlo k počátečnímu datu: pokud výdělečná činnost a účast na pojištění plynule pokračuje i v následujícím kalendářním měsíci, zapisuje se sem striktně poslední kalendářní den právě vykazovaného měsíce.', format: 'Povinné pole navázané na předchozí počáteční datum. Očekává se platný zápis data v exaktním XML formátu RRRR-MM-DD.', scenarios: 'Toto pole formuláře je pevnou součástí sekce Průběh Pojištění v daném měsíci (ID 10355) a spolupracuje s polem formuláře Pojištění Od. Stejně jako u počátečního data platí, že se údaj využívá primárně pro evidenci nemocenského pojištění. U specifických dohod (DPP, ZMR) je navíc účast na pojištění zohledňována také na základě překročení rozhodné částky v daném měsíci. Pamatujte, že pro sestavování ročních ELDP se tyto měsíční hranice ignorují a ČSSZ si bere údaje z pole formuláře Platnost Do.' },
			
			
			
			'kod': { label: 'Kód ELDP (ID 10240)', desc: 'Pole formuláře pro zápis kódu Evidenčního listu důchodového pojištění (ELDP). Určuje povahu pracovněprávního vztahu a účasti na důchodovém pojištění. Hodnota se vybírá ze systémového číselníku (CIS Kód ELDP). První pozice tohoto kódu musí navíc vždy odpovídat vybrané hodnotě v poli Druh činnosti (ID 10239).', format: 'Jednotlivé pole formuláře. Je povinnou součástí podřízené oblasti formuláře ELDP, která spadá do hlavní oblasti Průběh pojištění v daném měsíci.', scenarios: 'Toto pole je povinné vždy, pokud zaměstnanec v daném měsíci vykazuje započtené dny důchodového pojištění (ID 10356 > 0). Pokud toto pole naopak není vyplněno, nesmí se vyplňovat žádné další údaje o době důchodového pojištění, vyměřovacím základu ani vyloučených dobách. Systém nad tímto polem provádí přísné křížové kontroly: pokud má kód na druhé pozici znak "P", musí být vždy uveden vyměřovací základ (ID 10245), avšak započtené dny musí být striktně nulové. Zároveň platí restrikce pro Zaměstnání malého rozsahu (ID 10243) – pokud má kód ELDP na první pozici znak "T", "U", "V", "W", "X", "Y", "Z", "ZA", "ZB", "ZC", na druhé pozici znak "P", nebo na třetí pozici znak "B", "F", "J", "V", "T", nesmí být u daného zaměstnání příznak malého rozsahu vybrán jako "ANO".' },
			
			
			
			'platnostod': { label: 'Platnost kódu ELDP od (ID 10241)', desc: 'Pole formuláře pro zápis počátečního data, od kterého v daném kalendářním měsíci platí uvedený Kód ELDP (ID 10240). Údaj je společně s datem platnosti do a počtem započtených dnů klíčový pro správné vymezení doby trvání důchodového pojištění a následné sestavení Evidenčního listu důchodového pojištění (ELDP).', format: 'Jednotlivé pole formuláře očekávající zadání data. Je součástí podřízené oblasti formuláře ELDP, která spadá do hlavní oblasti Průběh pojištění v daném měsíci.', scenarios: 'Pole se vyplňuje výhradně tehdy, je-li současně vyplněno pole Kód ELDP (ID 10240); bez něj nesmí toto datum nabývat hodnot (nepropustná kontrola 307). Zadané datum podléhá přísným logickým kontrolám: musí spadat výhradně do kalendářního měsíce, za který je hlášení podáváno (nepropustná kontrola 99, s výjimkou specifického hlášení pro odložený příjem), a navíc musí být vždy menší nebo rovno datu zadanému v poli Platnost kódu do (ID 10242) v rámci nepropustné kontroly 100. Specifická pravidla platí např. u odloženého příjmu (deputátů), kdy se jako počátek platnosti může uvádět první den v měsíci nebo den následující po odregistraci.' },
			
			
			
			'platnostdo': { label: 'Platnost kódu ELDP do (ID 10242)', desc: 'Pole formuláře pro zápis koncového data, do kterého v daném kalendářním měsíci platí uvedený Kód ELDP (ID 10240). Údaj je společně s datem platnosti od a počtem započtených dnů klíčový pro správné vymezení doby trvání důchodového pojištění a následné sestavení Evidenčního listu důchodového pojištění (ELDP).', format: 'Jednotlivé pole formuláře očekávající zadání data. Je součástí podřízené oblasti formuláře ELDP, která spadá do hlavní oblasti Průběh pojištění v daném měsíci.', scenarios: 'Pole se vyplňuje výhradně tehdy, je-li současně vyplněno pole Kód ELDP (ID 10240); bez něj nesmí toto datum nabývat hodnot (nepropustná kontrola 307). Zadané datum podléhá přísným logickým kontrolám: musí spadat výhradně do kalendářního měsíce, za který je hlášení podáváno (nepropustná kontrola 99, s výjimkou specifického formuláře pro odložený příjem), a navíc musí být vždy větší nebo rovno počátečnímu datu zadanému v poli Platnost kódu od (ID 10241) v rámci nepropustné kontroly 100. Specifická pravidla platí např. u odloženého příjmu, kdy se jako konec platnosti typicky uvádí poslední den v měsíci zúčtování.' },
			
			
			
			'pocetdnu': { label: 'Započtené Dny Důchodového Pojištění (ID 10356)', desc: 'Pole formuláře pro zápis počtu kalendářních dnů v daném měsíci, po které trvala účast zaměstnance na důchodovém pojištění. Údaj je klíčový pro sestavení Evidenčního listu důchodového pojištění (ELDP) a vyhodnocuje se v přísné vazbě na pole Kód ELDP (ID 10240) a Vyměřovací základ (ID 10245).', format: 'Jednotlivé pole formuláře. Je součástí podřízené oblasti formuláře ELDP, která spadá do hlavní oblasti Průběh pojištění v daném měsíci. Očekává se hodnota celého nezáporného čísla.', scenarios: 'Zadaná hodnota nesmí překročit celkový počet kalendářních dnů v daném měsíci (kontrola 58) ani délku nahlášeného intervalu trvání pojištění od-do (kontrola 134). Systém provádí křížové kontroly s polem Kód ELDP (ID 10240): pokud má Kód ELDP na druhé pozici znak "P", musí být toto pole striktně rovno nule (0). Naopak, pokud je hodnota větší než 0, je vyplnění Kódu ELDP striktně povinné (kontrola 330). Pokud je hodnota v tomto poli 0 a Kód ELDP nemá na druhé pozici znak "D" nebo "P", musí být systémově nulový i Vyměřovací základ (ID 10245) v rámci kontroly 59.' },
			
			
			
			'vymerovacizaklad': { label: 'Vyměřovací Základ', desc: 'Pole formuláře v podřízené oblasti pro Evidenční List Důchodového Pojištění (ELDP) určené k uvedení úhrnu zúčtovaných příjmů započitatelných do vyměřovacího základu pro stanovení pojistného ve smyslu § 5 odst. 1 a odst. 4 zákona č. 589/1992 Sb. za daný kalendářní měsíc (ID 10245). Vyměřovací Základ se do této oblasti uvádí v plné výši bez ohledu na skutečnost, že odvodu pojistného podléhá pouze MAXIMÁLNÍ VYMĚŘOVACÍ ZÁKLAD (Pozn.: Termín se v datovém modelu vyskytuje i jako pojmenování nadřazené oblasti pro Dílčí Odpočty, tato infohláška však popisuje primární pole pro ELDP pouze).', format: 'Číselná hodnota peněžní částky v Kč. Nepovinný údaj, který se v případě vyplnění zadává jako celé nezáporné číslo o maximální délce 10 číslic bez úvodní nuly. Hodnota nesmí být záporná.', scenarios: 'Vyplnění pole je striktně vázáno na pole Kód ELDP (ID 10240). Pokud není Kód ELDP vyplněn, nesmí se vyplnit ani toto pole. Dále platí logické kontroly vůči Započteným Dnům (ID 10356) a Vyloučeným Dobám (ID 10357): Vyměřovací Základ musí být uveden, je-li druhá pozice Kódu ELDP písmeno "P". Naopak musí nabývat hodnoty 0, pokud se Započtené Dny rovnají Vyloučeným Dobám a druhá pozice Kódu ELDP není "D", případně pokud jsou Započtené Dny nulové a druhá pozice Kódu ELDP není "D" ani "P". Specificky se nuluje i při navazujících obdobích před Dovršením Důchodového Věku s kódem "D", nebo pokud jsou Započtené Dny rovny nule a Odečtené Doby (ID 10375) se rovnají Vyloučeným Dobám u kódu "D" na druhé pozici.' },
			
			
			
			'vyloucenedobycelkem': { label: 'Vyloučené doby - trvání omluvných důvodů dle § 16 odst. 4', desc: 'Pole formuláře určené pro uvedení celkového počtu dnů trvání omluvných důvodů podle § 16 odst. 4 písm. a) a j) zákona č. 155/1995 Sb. o důchodovém pojištění (ID 10357). Pro mzdové účetní platí, že se jedná o součet podřízených vyloučených dnů (dočasná neschopnost, mateřství, ošetřování, otcovská a specifické dny dle písm. j). V ojedinělých situacích neplatně rozvázaného pracovního poměru se do této položky může navíc dopočítávat s tím související doba.', format: 'Nepovinné pole formuláře. Pokud je vyplněno, hodnota se uvádí jako celé kladné číslo bez desetinných míst. Toto pole je součástí podřízené oblasti formuláře Vyloučené dny § 16 odst. 4, která spadá do hlavní oblasti Průběh pojištění v daném měsíci (ELDP).', scenarios: 'Položka se v měsíčním hlášení vyplňuje v příslušném kalendářním měsíci zvlášť pro každý jednotlivý kód ELDP u zaměstnance, u kterého tyto omluvné důvody nastaly (včetně každého měsíce u datového scénáře Odložený příjem).' },
			
			
			
			'docasneschopnost': { label: 'Počet dnů trvání dočasné pracovní neschopnosti (ELDP)', desc: 'Pole formuláře pro uvedení počtu dnů trvání dočasné pracovní neschopnosti v rámci vyloučených dnů podle § 16 odst. 4 písm. a) zákona o důchodovém pojištění (ID 10358). Z pohledu mzdové účetní jde o dílčí atribut, který vstupuje do celkového součtu vyloučených dob ELDP.', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé kladné číslo bez desetinných míst (nesmí začínat nulou). Toto pole je součástí podřízené oblasti formuláře Vyloučené dny § 16 odst. 4.', scenarios: 'Vyplňuje se v měsíčním hlášení k příslušnému kódu ELDP v měsíci, kdy u zaměstnance dočasná pracovní neschopnost prokazatelně trvala (a to případně i pro každý měsíc v rámci scénáře Odložený příjem).' },
			
			
			'penezitapomocmaterstvi': { label: 'Počet dnů čerpání peněžité pomoci v mateřství (do dne předcházejícímu porodu)', desc: 'Pole formuláře určené pro uvedení počtu dnů před porodem, po které nebyla vykonávána výdělečná činnost z důvodu těhotenství (ID 10359). Pro mzdové účetní platí, že jde typicky o období nejdříve od začátku osmého týdne před očekávaným dnem porodu do dne bezprostředně předcházejícího dni porodu.', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé kladné číslo bez desetinných míst. Spadá do podřízené oblasti formuláře Vyloučené dny § 16 odst. 4 (ELDP).', scenarios: 'Údaj se vykazuje v příslušném kalendářním měsíci pro konkrétní kód ELDP, u kterého zaměstnankyně čerpala tuto dobu před porodem.' },
			
			
			'osetrovaniclenarodiny': { label: 'Počet dnů ošetřování dítěte nebo péče o něj (s nárokem na ošetřovné)', desc: 'Pole formuláře určené k evidenci počtu kalendářních dnů ošetřování dítěte (nebo péče o něj, či jiného člena domácnosti), za které zaměstnanci náleží ošetřovné či dlouhodobé ošetřovné (ID 10360). Pro mzdové účetní jde o dílčí atribut vyloučených dob pro účely ELDP podle § 16 odst. 4 písm. a) zákona o důchodovém pojištění.', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé kladné číslo bez desetinných míst. Spadá do podřízené oblasti formuláře Vyloučené dny § 16 odst. 4.', scenarios: 'Vyplňuje se u příslušného kódu ELDP v měsíci, kdy tato situace u zaměstnance s nárokem na dávku reálně nastala.' },
			
			
			
			
			
			'otcovska': { label: 'Počet dnů čerpání otcovské (Vyloučené / Odečítané dny)', desc: 'Pole formuláře sloužící pro uvedení počtu dnů, po které trvala podpůrčí doba u dávky otcovské poporodní péče. Pro mzdové účetní je klíčové, že tento sdílený datový prvek pokrývá dva různé procesy: standardní evidenci v rámci vyloučených dnů pro účely důchodového pojištění ELDP (ID 10362) a specifickou evidenci jako odečítané dny u výdělečně činného pojištěnce (pracujícího důchodce) po dovršení důchodového věku, který po 31. 12. 2024 nepobírá starobní důchod v plné výši (ID 10466).', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé kladné číslo bez desetinných míst (pro odečítané dny typicky v rozsahu 1-99). Z hlediska struktury formuláře spadá toto pole buď do podřízené oblasti Vyloučené dny § 16 odst. 4, nebo do podřízené oblasti Odečítané dny v závislosti na řešeném procesu.', scenarios: 'Položka se v měsíčním hlášení vyplňuje vždy u příslušného kódu ELDP v měsíci, kdy zaměstnanec dávku reálně čerpal. Běžný záznam (ID 10362) se vykazuje u standardních zaměstnanců, zatímco záznam v bloku odečítaných dnů (ID 10466) se vyplňuje výhradně u cílové skupiny pracujících důchodců (tzv. „na procenta“).' },
			
			
			
			
			
			
			'vyloucenepar16': { label: 'Počet dnů podle § 16 odst. 4 písm. j) zákona č. 155/1995 Sb.', desc: 'Pole formuláře sloužící k evidenci specifických vyloučených dnů podle § 16 odst. 4 písm. j) zákona o důchodovém pojištění v rámci ELDP (ID 10536).', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé kladné číslo bez desetinných míst. Spadá do podřízené oblasti formuláře Vyloučené dny § 16 odst. 4.', scenarios: 'Vyplňuje se pouze při výskytu tohoto konkrétního omluvného důvodu v měsíčním hlášení u příslušného kódu ELDP daného zaměstnance.' },
			
			
			'vyloucenepar18': { label: 'Vyloučené dny podle § 18 odst. 7 zákona č. 187/2006 Sb.', desc: 'Pole formuláře určené k uvedení celkového počtu vyloučených dnů pro účely nemocenského pojištění podle § 18 odst. 7 zákona č. 187/2006 Sb. (ID 10366). Pro mzdové účetní je to klíčový součtový atribut, který se skládá z omluvené nepřítomnosti bez náhrady (ID 10473), dnů s náhradou příjmu (ID 10474) a dnů s výplatou dávek (ID 10475).', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé kladné číslo bez desetinných míst. Spadá do podřízené oblasti formuláře Vyloučené dny § 18 odst. 7, která tvoří součást oblasti Průběh pojištění v daném měsíci (ELDP).', scenarios: 'Vyplňuje se za každý kalendářní měsíc (i v režimu odloženého příjmu) u příslušného kódu ELDP v situacích, kdy měl zaměstnanec vyloučené doby pro nemocenské pojištění.' },
			
			
			'omluvenanepritomnost': { label: 'Počet dnů omluvené nepřítomnosti, za které nenáleží náhrada příjmu', desc: 'Pole formuláře určené pro dny omluvené nepřítomnosti zaměstnance v práci, za které mu nenáleží náhrada příjmu, s výjimkou nemocenských dávek či dnů po ukončení podpůrčí doby (ID 10473). Mzdové účetní sem typicky zahrnují rodičovskou dovolenou (dobu péče o dítě do 4 let) nebo neplacené volno či stávku.', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé kladné číslo bez desetinných míst. Jde o dílčí pole spadající do podřízené oblasti formuláře Vyloučené dny § 18 odst. 7.', scenarios: 'Vyplňuje se k příslušnému kódu ELDP, pokud taková absence bez náhrady nastala. Lze ji např. kombinovat s vykazováním dnů výplaty dávek (např. u ošetřovného), pokud si mzdová účetní potřebuje dny rozpočítat na ty s dávkou a ty fungující jako neplacené volno.' },
			
			
			'pracovnineschopnost': { 
                label: 'PRACOVNÍ NESCHOPNOST', 
                desc: '<strong>PRVNÍ PŘÍPAD PRACOVNÍ NESCHOPNOSTI:</strong> Pracovní Neschopnost s Náhradou Příjmu • ELDP - Vyloučené Dny (ID 10474). Pole formuláře určené pro kalendářní dny dočasné pracovní neschopnosti nebo karantény, v nichž náleží zaměstnanci náhrada mzdy nebo platu v období prvních 14 kalendářních dní.<br><br><strong>DRUHÝ PŘÍPAD PRACOVNÍ NESCHOPNOSTI:</strong> Pracovní Neschopnost (KARANTÉNA) ELDP - Odečítané Dny (ID 10462). Pole formuláře pro evidenci počtu dnů trvání nezaviněné dočasné pracovní neschopnosti nebo karantény specificky u pojištěnce (pracujícího důchodce), který po 31. 12. 2024 nepobírá plný starobní důchod a pracuje i po dovršení důchodového věku.', 
                format: '<strong>Případ 1 (ID 10474):</strong> Nepovinné pole formuláře. Hodnota se uvádí jako celé kladné číslo bez desetinných míst. Patří do podřízené oblasti Vyloučené dny § 18 odst. 7.<br><br><strong>Případ 2 (ID 10462):</strong> Nepovinné pole formuláře. Hodnota se uvádí jako celé kladné číslo bez desetinných míst. Patří do podřízené oblasti Odečítané dny.', 
                scenarios: '<strong>Případ 1 (ID 10474):</strong> Vyplňuje se v měsíčním hlášení u daného kódu ELDP za měsíc, ve kterém zaměstnavatel vyplácel zaměstnanci náhradu mzdy za prvních 14 dnů nemoci. Pro mzdové účetní platí, že je přípustné sem souhrnně vykázat celých prvních 14 dnů (tedy i víkendy), ačkoliv náhrada reálně náleží pouze za pracovní dny.<br><br><strong>Případ 2 (ID 10462):</strong> Vyplňuje se v měsíci, kdy u této specifické skupiny pracujících důchodců nemoc či karanténa reálně nastala. Mzdové účetní tyto dny vykazují bez ohledu na to, zda došlo k omezení nároku na výplatu nemocenské dávky.'
            },
			
			
			'vyplacenidavek': { label: 'Počet dnů, za které bylo vypláceno nemocenské, ošetřovné či mateřská', desc: 'Pole formuláře sloužící k uvedení kalendářních dnů, za které byla zaměstnanci reálně vyplácena některá z dávek (nemocenské, peněžitá pomoc v mateřství, otcovská, ošetřovné nebo dlouhodobé ošetřovné) (ID 10475). Z pohledu mzdové účetní platí, že v nemocenské agendě se vylučují všechny dny, kdy zaměstnanec ošetřoval, bez ohledu na nárok na dávku, a lze je tedy případně kombinovat s evidencí neplaceného volna.', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé kladné číslo bez desetinných míst. Patří do podřízené oblasti formuláře Vyloučené dny § 18 odst. 7.', scenarios: 'Vyplňuje se v měsíčním hlášení k příslušnému kódu ELDP za každý měsíc, ve kterém byly dávky vypláceny.' },
			
			
			'odecitanedobycelkem': { label: 'Doby odečítané po důchodovém věku - celkový počet dnů', desc: 'Pole formuláře určené k uvedení celkového počtu kalendářních dnů odečítaných u specifické skupiny výdělečně činných pojištěnců (ID 10375). Pro mzdové účetní je to klíčový údaj u zaměstnanců (pracujících důchodců), kteří po 31. 12. 2024 nepobírají starobní důchod v plné výši a jsou výdělečně činní po dovršení důchodového věku, u nichž se odečítá pracovní volno bez náhrady, neomluvená absence nebo omluvné důvody dle § 16 odst. 4 písm. a).', format: 'Podmíněně povinné pole formuláře (pokud jsou odečítané dny uplatněny). Uvádí se jako celé kladné číslo bez desetinných míst. Tvoří samostatnou podřízenou oblast Odečítané dny v rámci Průběhu pojištění v daném měsíci (ELDP).', scenarios: 'Vyplňuje se výhradně u pracujících důchodců ve zmíněném režimu (tzv. "na procenta") k příslušnému kódu ELDP v měsíčním hlášení. Představuje součet všech podřízených položek odečítaných dnů.' },
			
			
			
			
			
			'materstvi': { label: 'Počet dnů čerpání peněžité pomoci v mateřství - Odečítané dny', desc: 'Pole formuláře sloužící k evidenci počtu dnů, za které byla vyplácena peněžitá pomoc v mateřství specificky u pojištěnce po dovršení důchodového věku, který po 31. 12. 2024 nepobírá starobní důchod v plné výši (ID 10463).', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé kladné číslo bez desetinných míst (1-99). Patří do podřízené oblasti formuláře Odečítané dny.', scenarios: 'Položka se vyplňuje u příslušného kódu ELDP v daném měsíci výhradně u této skupiny pracujících důchodců.' },
			
			
			'osetrovanisnarokem': { label: 'Počet dnů ošetřování, za které náleží ošetřovné - Odečítané dny', desc: 'Pole formuláře pro uvedení počtu dnů potřeby ošetřování dítěte nebo jiného člena domácnosti, za které prokazatelně náleží ošetřovné či dlouhodobé ošetřovné, u výdělečně činného pojištěnce po dovršení důchodového věku nepobírajícího plný starobní důchod (ID 10464).', format: 'Nepovinné pole formuláře. Uvádí se jako celé kladné číslo bez desetinných míst (1-99). Spadá do podřízené oblasti formuláře Odečítané dny.', scenarios: 'Vyplňuje se v měsíčním hlášení k danému kódu ELDP pro pracující důchodce ve zmíněném režimu, u nichž nastala potřeba ošetřování s nárokem na dávku.' },
			
			
			'osetrovanibeznaroku': { label: 'Počet dnů ošetřování, za které nenáleží ošetřovné - Odečítané dny', desc: 'Pole formuláře pro uvedení počtu dnů ošetřování nebo péče, za které zaměstnanci (pojištěnci po dovršení důchodového věku nepobírajícímu po 31. 12. 2024 plný důchod) prokazatelně nenáleží ošetřovné či dlouhodobé ošetřovné (ID 10465).', format: 'Nepovinné pole formuláře. Uvádí se jako celé kladné číslo bez desetinných míst. Patří do podřízené oblasti formuláře Odečítané dny.', scenarios: 'Vyplňuje se v měsíčním hlášení k příslušnému kódu ELDP výhradně u cílové skupiny pracujících důchodců.' },
			
			
						
			'neplacenevolno': { label: 'Počet dnů čerpání neplaceného volna - Odečítané dny', desc: 'Pole formuláře určené k evidenci počtu dnů, ve kterých pojištěnec po dovršení důchodového věku (nepobírající plný starobní důchod) nevykonával výdělečnou činnost výhradně z důvodu čerpání neplaceného volna (ID 10468).', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé kladné číslo bez desetinných míst. Patří do podřízené oblasti formuláře Odečítané dny.', scenarios: 'Vyplňuje se v měsících, kdy zaměstnanec z této specifické skupiny pracujících důchodců reálně čerpal neplacené volno, a to ke konkrétnímu kódu ELDP.' },
			
			
			'neomluveneabsence': { label: 'Počet dnů neomluvené absence - Odečítané dny', desc: 'Pole formuláře sloužící pro uvedení počtu dnů, ve kterých pojištěnec po dovršení důchodového věku (nepobírající plný starobní důchod) nevykonával výdělečnou činnost z důvodu neomluvené absence v práci (ID 10469).', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé kladné číslo bez desetinných míst. Patří do podřízené oblasti formuláře Odečítané dny.', scenarios: 'Vyplňuje se v příslušném kalendářním měsíci u cílové skupiny pracujících důchodců k příslušnému kódu ELDP, pakliže byla mzdovou účetní u zaměstnance zjištěna neomluvená absence.' },

			
			'slevazamestnavateleevidovana': { label: 'Sleva na Pojistném Zaměstnavatele (ID 10372)', desc: ' ANO / NE.Pole formuláře určující, zda zaměstnavatel za daného zaměstnance z příslušného zaměstnání uplatňuje slevu na pojistném zaměstnavatele. Slouží k evidenci nároku na slevu podle § 7a zákona č. 589/1992 Sb. Vyplňuje se pouze logickou hodnotou ANO / NE.', format: 'Příznakové pole formuláře (ANO/NE). V případě volby ANO se zpřístupní k vyplnění související podřízená pole formuláře: Rozsah kratší pracovní/služební doby (ID 10373) a Důvod uplatnění slevy (ID 10374), kde mzdová účetní volí právě jednu z hodnot číselníku (A - dosáhl alespoň 55 let, B - pečuje o dítě mladší 10 let, C - pečuje o osobu blízkou, D - studium do 26 let, E - rekvalifikace, F - osoba se zdravotním postižením, G - mladší 21 let).', scenarios: 'Tento údaj se vyplňuje v individualizované části formuláře pro každý konkrétní pracovněprávní vztah (PPV). Mzdová účetní volí hodnotu ANO pouze tehdy, pokud je v daném měsíci sleva na pojistném u zaměstnance uplatněna (lze uplatnit vždy jen z jednoho zaměstnání). V případě výběru hodnoty ANO a současně důvodu A až F je nezbytné vyplnit i rozsah sjednané kratší pracovní doby, který nesmí přesáhnout 30 hodin týdně ze všech PPV. Pokud je důvodem uplatnění slevy volba G (mladší 21 let), podřízené pole pro rozsah kratší pracovní doby se neuvádí.' },
			
			
			
			
			
			
			'prispevekdoplnpenzpripoj': { label: 'Příspěvek na doplňkové penzijní spoření', desc: 'Pole formuláře určené pro uvedení částky osvobozeného příjmu ve formě příspěvku zaměstnavatele na doplňkové penzijní spoření zaměstnance. Pro mzdové účetní platí, že jde o plnění osvobozené od daně podle § 6 odst. 9 písm. m) zákona o daních z příjmů za jednotlivý produkt (ID 10293).', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé číslo (může nabývat i záporných hodnot) o maximální délce 14 číslic. Toto pole je součástí podřízené oblasti formuláře Příjmy (konkrétně v části Příspěvek zaměstnavatele z osvobozených příjmů), která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se vyplňuje v měsíčním hlášení, pokud zaměstnavatel v daném měsíci poskytl zaměstnanci příspěvek na tento produkt. Údaj se vykazuje agregovaně a výhradně u primárního pracovněprávního vztahu.' },


			'prispevekpenzpoj': { label: 'Příspěvek na penzijní pojištění', desc: 'Pole formuláře sloužící k uvedení částky osvobozeného příjmu ve formě příspěvku zaměstnavatele na penzijní pojištění zaměstnance. Pro mzdové účetní platí, že se jedná o plnění osvobozené od daně z příjmů podle § 6 odst. 9 písm. m) zákona o daních z příjmů vztahující se k tomuto konkrétnímu produktu (ID 10294).', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé číslo (připouští se i záporná hodnota) o maximální délce 14 číslic. Toto pole je součástí podřízené oblasti formuláře Příjmy (v části Příspěvek zaměstnavatele z osvobozených příjmů) v rámci hlavní oblasti Souhrnná data zaměstnance.', scenarios: 'Položka se vyplňuje v měsíčním hlášení tehdy, kdy zaměstnavatel v daném měsíci zaměstnanci přispěl na penzijní pojištění. Podobně jako u ostatních souhrnných dat a příjmů se i tento údaj vykazuje agregovaně a striktně jen u primárního pracovněprávního vztahu.' },



			'prispevekzivotpoj': { label: 'Příspěvek na soukromé životní pojištění', desc: 'Pole formuláře určené pro uvedení částky osvobozeného příjmu ve formě příspěvku zaměstnavatele na soukromé životní pojištění zaměstnance. Z pohledu mzdové účetní se jedná o plnění osvobozené od daně podle § 6 odst. 9 písm. m) zákona o daních z příjmů za tento jednotlivý produkt (ID 10295).', format: 'Nepovinné pole formuláře. Hodnota se uvádí jako celé číslo (včetně možnosti zadání záporné hodnoty pro případné korekce) o maximální délce 14 číslic. Toto pole je součástí podřízené oblasti formuláře Příjmy (konkrétně v části Příspěvek zaměstnavatele z osvobozených příjmů), která spadá do hlavní oblasti formuláře Souhrnná data zaměstnance.', scenarios: 'Položka se v měsíčním hlášení vyplňuje v případech, kdy je zaměstnanci ze strany zaměstnavatele v příslušném kalendářním měsíci uhrazen příspěvek na soukromé životní pojištění. Tento údaj se vyplňuje agregovaně za osobu a výhradně u jejího primárního pracovněprávního vztahu.' },
			
			
            'souhrn': { label: 'Souhrnná Část (Úhrny za Zaměstnavatele) ', desc: 'Hlavní blok formuláře reprezentující Souhrnnou Část Měsíčního Hlášení. Tento celý uzel sdružuje Souhrnné Údaje za celého Zaměstnavatele (IČO), zejména úhrnné daňové údaje za hlášený měsíc (např. celkové sražené zálohy po slevách - ID 10034, daňové bonusy - ID 10035), údaje z ročního zúčtování odesílané v prvním čtvrtletí, informace o plnění povinného podílu zaměstnávání OZP a případné specifické právní skutečnosti či údaje o kolektivních smlouvách a formě vlastnictví.', format: 'Komplexní XML element (kontejner) fungující jako obálka. V rámci jeho vnořených položek formuláře se uplatňují tyto číselníky: Specifická právní skutečnost (1 - smrt zůstavitele, 2 - zánik PO bez likvidace, 3 - vstup PO do likvidace, 4 - zpracování návrhu na použití likvidačního zůstatku, 5 - nabytí účinnosti rozhodnutí o úpadku, 6 - zrušení PO s právním nástupcem), Typ kolektivní smlouvy (0 - neexistuje, 1 - podniková, 2 - vyššího stupně na základě členství, 3 - vyššího stupně na základě rozšíření závaznosti) a Forma hospodářské a finanční kontroly / vlastnictví (1 - plně ve veřejném vlastnictví, 2 - plně v soukromém nebo družstevním vlastnictví, 3 - ve sdíleném vlastnictví s většinovým veřejným podílem, 4 - ve většinovém vlastnictví s většinovým soukromým nebo družstevním podílem).', scenarios: 'Tento obalovací blok je striktně povinnou součástí každého řádného měsíčního hlášení. Zásadní pravidlo platí u rozsáhlých podání rozdělených do více XML balíků (pro organizace s více než 1502 formuláři): uzel SOUHRN smí být umístěn exaktně a výhradně pouze v prvním dílčím podání s pořadím balíku. V dalších případných balících (v dalších navazujících XML souborech) téhož Měsíčního Hlášení se již SOUHRN a PVPOJ netisknou, protože stačí, že jsou v prvním XML souboru vašeho Měsíčního Hlášení pouze. Dále zde u daňových údajů platí přísné logické kontextové kontroly prováděné v Centrálních Systémech JMHZ (cJMHZ), které ověřují, zda částky vykázané v tomto souhrnu exaktně odpovídají matematickému součtu všech individuálních částek vykázaných v individualizovaných formulářích napříč všemi zaměstnanci (např. u Sražených Záloh).' },
            
			
			'pojisteni': { label: '3. Pojištění (Průběh pojištění v Daném Měsíci)', desc: 'Hlavní blok formuláře umístěný uvnitř datového scénáře individualizovaného formuláře (např. uvnitř formuláře Bez Příznaku a/nebo uvnitř formuláře Odložený Příjem). Sdružuje veškeré detailní údaje týkající se průběhu pojištění zaměstnance v daném měsíci. Podle typu scénáře může obsahovat podřízené obalovací bloky, jako jsou Trvání Pojištění (ID 10354 Od Data a ID 10355 Do Data), Evidenční Listy Důchodového Pojištění (ELDP), Vyměřovací Základy (VZ a Paragraf 5), Odvody Pojistného za Zaměstnance a Zaměstnavatele a Uplatňované Slevy na Pojistném.', format: 'Komplexní blok formuláře. Vzhledem k tomu, že jde o strukturální prvek, neobsahuje přímo žádné vlastní číselníkové hodnoty, ale plní výhradně funkci obálky pro navázané podřízené datové elementy a bloky týkající se tématu Pojištění.', scenarios: 'Struktura a samotná přítomnost tohoto uzlu je striktně závislá na vybraném datovém scénáři. Zásadní výjimkou v v pravidlech a logice ČSSZ pro JMHZ - Měsíční Hlášení (MH) je scénář formuláře Jiný Příjem (např. pro kódy činnosti 11, 13, 14), kde uzel Pojištění je záměrně zcela vynechán a nesmí být do XML datové věty vůbec tištěn. U specifického scénáře Vězeň je vnitřní struktura tohoto bloku legislativně a technicky redukována a smí obsahovat pouze uzly pro Trvání Pojištění, pro ELDP a pro Případnou Slevu Zaměstnance.' },
			
            'danbonus': { label: 'Daňový Bonus', desc: 'Tento údaj se v datové větě vyskytuje ve dvou logických úrovních. Na individuální úrovni zaměstnance (ID 10306) se zapisuje v podřízené oblasti Výpočet Zálohy na Daň v rámci Souhrnných Dat Zaměstnance a udává Výši Vyplaceného Měsíčního Daňového Bonusu podle § 35d ZDP. Na celofiremní úrovni v Souhrnné Části (položka Výše Vyplaceného Měsíčního Daňového Bonusu, ID 10035) reprezentuje CELKOVÝ ÚHRN VŠECH Měsíčních Daňových Bonusů vyplacených zaměstnavatelem všem zaměstnancům za daný měsíc.', format: 'Nepovinné pole na obou úrovních. Očekává se exaktní zápis celého nezáporného čísla o maximální délce 1 až 14 číslic. Vzhledem k tomu, že jde o konkrétní peněžní částku v Kč, nejsou k tomuto datovému poli navázány žádné číselníkové položky.', scenarios: 'Zápis na individuální úrovni (ID 10306) se vyplňuje výhradně u zaměstnání označeného jako Primární Pracovněprávní Vztah. Pro mzdové účetní zde platí zásadní aplikační pravidlo: hodnota nesmí být nikdy záporná. Navíc se zde uplatňuje specifická propustná kontrola ČSSZ – pokud je hodnota kladná (BONUS JE reálně vyplácen), nesmí být nižší než 50 Kč. Pokud byste uvedli částku např. 40 Kč, systém podání sice nezamítne, ale zbytečně tím vygeneruje sice propustnou chybu v protokolu ale tím vás také vyzve k podání Opravného Hlášení, což by bylo zbytečné papírování navíc.' },
            
            'cinnostks': { label: 'Datový Scénář Činnost KS (Specifické Činnosti a Funkce)', desc: 'Hlavní oblast formuláře určená pro specifické kategorie pracovních vztahů. Spadají sem druhy činnosti s kódy skupiny K, N, O, P, Q, R, S (Skupina kódů K až S (ID 10239). Tato oblast číselníku specifikuje zvláštní kategorie pracovních vztahů, na které se aplikuje dedikovaný scénář hlášení. Patří sem přesně tyto položky: K - dobrovolný pracovník pečovatelské služby, N - smluvní zaměstnanec, O - člen družstva, P - Prokuristé, Q - členové kolektivních orgánů právnických osob, R - Likvidátoři a S - společník, jednatel, komanditista, ředitel obecně prospěšné společnosti, osoby pověřené obchodním vedením na základě smluvního zastoupení) NEBO činnosti s kódy 1 až 9, pokud mají u pole Bližší Určení Pracovněprávního Vztahu (ID 10502) zvolenou hodnotu z číselníku konkrétně "3 - Pracovní Vztah Specifické Skupiny" (významné veřejné funkce a specifické profese, jako jsou soudci, uvolnění členové zastupitelstev, poslanci, senátoři, členové vlády, prezident republiky, členové NKÚ, státní zástupci, ale i členové volebních či maturitních komisí.). Pro tyto vztahy platí specifická pravidla pro odvody, daně a evidenci pracovní doby.', format: 'Samostatný blok formuláře nahrazující standardní hlášení. Skládá se z podřízených oblastí podobných běžnému hlášení, avšak s legislativními úpravami. Specificky obsahuje například podřízené oblasti pro Zvláštní Sazbu Daně či Příjmy se zaměřením na Daňové Nerezidenty, kam patří pole Zúčtovaný Příjem Nerezidentů (ID 10416), Odměna Člena Nerezidenta (ID 10308) a Sražená Záloha na Daň Nerezidenta (ID 10310).', scenarios: 'Tato oblast formuláře se řídí přísnými pravidly pro vykazování. Z legislativních důvodů zde striktně chybí některá pole, například Zdravotní pojištění za zaměstnavatele (ID 10482) a pole pro rozpad vyměřovacích základů podle § 5a (ID 10478, ID 10479, ID 10480), jelikož na tyto činnosti nelze uplatnit státní dotace. U polí pro Stanovený fond pracovní doby (ID 10259) a Sjednaný fond pracovní doby (ID 10260) se navíc povinně vykazuje hodnota 0, jelikož se u těchto specifických funkcí a činností klasická pracovní doba neeviduje.' },
            
            'vykonavanapozice': { label: '4. Vykonávaná Pozice Zaměstnance', desc: 'Zastřešující oblast formuláře sdružující detailní informace o pracovním zařazení zaměstnance a specifikách jeho pracovněprávního vztahu (PPV) v daném měsíci. Zahrnuje údaje o místě výkonu práce, sjednaném a stanoveném fondu pracovní doby, uplatnění mzdových příspěvků Aktivní Politiky Zaměstnanosti (APZ), Funkčních Požitcích a případném Dočasném Přidělení Agenturního Zaměstnance k Jinému Uživateli.', format: 'Nadřazená oblast formuláře složená z několika podřízených oblastí a polí. Obsahuje mj. podřízenou oblast Místo výkonu práce (Obec [ID 10229], Kód obce [ID 10230], Stát [ID 10231] z číselníku zemí CZEM), podřízenou oblast Fond pracovní doby (Stanovený fond [ID 10259], Sjednaný fond [ID 10260]), a logická pole s možností volby ANO/NE pro Mzdový příspěvek APZ [ID 10232], Funkční požitky [ID 10247] či Dočasné přidělení [ID 10251]. V případě volby ANO u dočasného přidělení se zpřístupní další podřízená pole pro Identifikaci Uživatele (např. IČO [ID 10252], RČ [ID 10457] nebo Údaje Zahraniční Osoby).', scenarios: 'Tato oblast se povinně vyplňuje v rámci individualizovaného formuláře zaměstnance u většiny běžných činností. Systém DIS (Datový Integrační Systém ČSSZ / cJMHZ) uplatňuje nad touto oblastí řadu nepropustných kontrol, např. kontrolu ID 103, která striktně hlídá, že pokud je u dočasného přidělení vybráno ANO, musí být exaktně vyplněna alespoň jedna identifikace cílového uživatele. Mzdovou výjimkou je Místo výkonu práce: pokud práce probíhá výhradně mimo ČR, vyplní se do pole Stát [ID 10231] stát skutečného výkonu, avšak do textového pole Obec [ID 10229] se dává sídlo zaměstnavatele (vazba kód obce a stát se zde ignoruje). U specifických datových scénářů (např. u formuláře Jiný příjem pro nepodléhající dohody) je celá tato oblast zcela skryta a vůbec se nevykazuje.' },
            
            'position': { label: 'Pracovní zařazení', desc: 'Údaje o úvazku a rozvržení doby u zaměstnavatele.' },
            
            'sjednanyfond': { label: 'Sjednaný Fond Pracovní Doby (V Hodinách Měsíčně)', desc: '(ID 10260) Pole formuláře v podřízené oblasti Fond pracovní doby (v rámci oblasti Vykonávaná pozice). Pro mzdové účetní slouží k evidenci plánovaného hodinového fondu pracovní doby konkrétního zaměstnance. Zatímco "Stanovený fond" určuje teoretický plný úvazek pro danou profesi, do tohoto pole se uvádí reálný sjednaný fond odpovídající konkrétnímu úvazku zaměstnance. Započítává se celkový počet hodin za pracovní dny (včetně svátků v jinak pracovní dny), po které byl pracovník v daném měsíci v evidenčním stavu.', format: 'Povinné číselné pole (ID 10260). Vyplňuje se jako desetinné číslo s maximálně 3 desetinnými místy a celkovou délkou do 7 číslic. Dle nepropustné kontroly 95 na systému DIS nesmí zadaná hodnota nabývat záporných čísel (musí být kladná nebo nula).', scenarios: 'U zaměstnanců s plným úvazkem bude hodnota tohoto pole logicky shodná s polem Stanovený fond (ID 10259). V případě zkráceného úvazku zde bude hodnota úměrně nižší. U dohod dohod konaných mimo pracovní poměr (DPP, DPČ) mzdová účetní vyplní předpokládaný rozsah práce v příslušném měsíci, a to i včetně případné plánované dovolené. Největším chytákem je opět situace u specifických činností s kódy K až S (typicky jednatelé či společníci s.r.o.), kde se pracovní doba neeviduje a mzdová účetní sem musí striktně uvést nulovou hodnotu (0). Naopak u klasických kódů činností 1-9 bez sjednané doby se sem uvede přepočet odpovídající 40hodinovému týdnu (8 hodin za pracovní den).' },
            
            'stanovenatydennidoba': { label: 'Stanovená Týdenní Pracovní Doba Zaměstnance (§ 79 ZP)', desc: ' (ID 10261) Pole formuláře v podřízené oblasti Fond pracovní doby (v rámci oblasti Vykonávaná pozice). Mzdovým účetním slouží k evidenci týdenní pracovní doby stanovené zákonem pro daný typ provozu, a to primárně pro statistické účely a pro stanovení výše povinného podílu zaměstnávání osob se zdravotním postižením (OZP). Standardní doba činí 40 hodin týdně, u dvousměnných provozů 38,75 hodiny a u vícesměnných či nepřetržitých 37,5 hodiny.', format: 'Povinné číselné pole (ID 10261). Vyplňuje se jako desetinné číslo s maximálně 2 desetinnými místy a celkovou délkou do 7 číslic. Dle nepropustné kontroly 96 na systému DIS nesmí být hodnota nulová ani záporná – musí jít striktně o kladnou hodnotu větší než nula.', scenarios: 'Zásadní chyták spočívá v tom, že nejde o reálný sjednaný zkrácený úvazek zaměstnance, ale o maximální stanovený týdenní fond pro daný typ provozu či profesi dle zákoníku práce, případně zkrácený vnitřním předpisem či kolektivní smlouvou (pozor, zkrácení bez snížení mzdy nesmí provést zaměstnavatel v platové sféře). Dalším významným specifikem je to, že pokud se daný zaměstnanec dle platné legislativy do výpočtu povinného podílu OZP vůbec nezapočítává, musí zde mzdová účetní uvést "Speciální Chybějící Hodnotu" 99.' },
            
            'prubehzamestnani': { label: '5. Průběh Zaměstnání v Daném Měsíci', desc: 'Oblast formuláře určená k detailní evidenci odpracované i neodpracované doby zaměstnance pro konkrétní pracovněprávní vztah ve sledovaném kalendářním měsíci. Mzdovým účetním slouží k nahlášení dnů v evidenčním stavu, odpracovaných hodin (včetně přesčasů a práce ve ztíženém prostředí) a k přesnému rozkladu neodpracovaných hodin (nemoc, dovolená, OČR, překážky v práci).', format: 'Hlavní oblast formuláře v individualizované části, která sdružuje podřízené oblasti: Odpracované dny (obsahuje pole Počet Dní v Evidenčním Stavu ID 10265), Odpracované Hodiny (Základní Hodiny ID 10268, Přesčasy ID 10269, Hlubinné Hornictví a Riziková Práce, u které se povinně vybírá kód z číselníku Kategorizace Rizika ID 10274), Neodpracované Hodiny (Celkový Počet ID 10275 a jeho detailní rozpad) a Překážky v Práci (ID 10471 a 10472).', scenarios: 'U dohod konaných mimo pracovní poměr (DPP, DPČ) mzdová účetní do pole Počet Dní v Evidenčním Stavu (ID 10265) uvádí vždy nulovou hodnotu. Zásadní účetní chyták představují nepropustné kontroly ČSSZ číslo 282 a 286 v systému DIS (cJMHZ): Pokud vykážete Počet Odpracovaných Hodin (ID 10268) jako 0, nesmíte vůbec odeslat podřízená pole pro Přesčasy či Rizikové Práce. Obdobně, je-li Celkový Počet Neodpracovaných Hodin (ID 10275) roven 0, nesmí se odeslat žádná z podřízených položek rozpadu (Dovolená, Překážky, Nemoc . . .  atd.). Navíc u specifického datového scénáře Jiný Příjem (Kódy Činnosti 11, 13, 14) ČSSZ proces neumožňuje tuto oblast vůbec tisknout do XML souboru a odeslat na ČSSZ.' },
            
            'odpracovanedny': { label: 'Odpracované Dny', desc: 'Podřízená oblast formuláře (spadající pod hlavní oblast Průběh zaměstnání v daném měsíci), která slouží k evidenci celkového počtu dní v měsíci, po které byl zaměstnanec u daného pracovněprávního vztahu veden v evidenčním stavu zaměstnanců.', format: 'Tato oblast formuláře obsahuje primárně povinné číselné pole Počet dní v evidenčním stavu (ID 10265), kam se vyplňuje celé nezáporné číslo. Dále pod ni spadá i pole Počet odpracovaných dnů (ID 10267), avšak dle platné metodiky JMHZ se tento atribut aktuálně nebude vůbec využívat a do hlášení se nevyplňuje.', scenarios: 'U běžných pracovních, služebních či členských poměrů se uvádí reálný počet kalendářních dní v měsíci, po které byl daný vztah v evidenčním stavu. Zásadním specifikem a účetním chytákem je však vykazování u zaměstnanců pracujících na základě dohod o pracích konaných mimo pracovní poměr (DPP, DPČ) – u těchto smluvních vztahů musí mzdová účetní do pole Počet dní v evidenčním stavu (ID 10265) striktně a vždy uvést nulovou hodnotu (0).' },
            
            'dnyevidencnistav': { label: 'Počet Dní v Evidenčním Stavu (ID 10265)', desc: 'Pole formuláře pro uvedení celkového počtu dní v měsíci, ve kterých byl zaměstnanec v daném pracovním, služebním nebo členském poměru v evidenčním stavu zaměstnanců. V případě zaměstnanců pracujících na základě dohody o pracích konaných mimo pracovní poměr se do tohoto pole vždy uvádí nulová hodnota.', format: 'Povinné číselné pole formuláře, do kterého se vkládá celé nezáporné číslo. Spadá do oblasti formuláře Údaje k průběhu zaměstnání v daném měsíci, konkrétně pod podřízenou oblast Odpracované dny.', scenarios: 'Tento údaj se vyplňuje povinně každý měsíc v rámci individualizované části formuláře pro každý konkrétní pracovněprávní vztah. Tento údaj se hlásí pro každé konkrétní zaměstnání (ID PPV) a není vázán výhradně na primární PPV. U dohod konaných mimo pracovní poměr (DPP, DPČ) je nezbytné pro splnění technické i byznysové kontroly do pole vždy odeslat hodnotu 0.' },
            
            
            'odpracovanehodiny': { label: 'Odpracované Hodiny', desc: 'Podřízená oblast formuláře sdružující údaje o skutečně odpracovaných nebo odsloužených hodinách v měsíci ve stanovené pracovní době. Zahrnuje jak celkový počet odpracovaných hodin, tak případný detailní rozpad těchto hodin (například na přesčasy, práci v hlubinném hornictví nebo rizikovou práci).', format: 'Podřízená oblast formuláře spadající do nadřazené oblasti Údaje k průběhu zaměstnání v daném měsíci. Skládá se z povinného pole Počet odpracovaných hodin (ID 10268) a volitelné podřízené oblasti pro detailní rozpad na Přesčasové hodiny (ID 10269), Směny v hornictví (ID 10270, 10271) a Rizikovou práci (ID 10273, 10274 včetně výběru z číselníku Kategorizace rizika).', scenarios: 'Tato oblast se vyplňuje v individualizované části pro konkrétní pracovněprávní vztah. Vykázaný celkový počet odpracovaných hodin (ID 10268) nesmí být menší než uvedený počet přesčasových hodin nebo hodin v rizikové práci. Dle nepropustné kontroly 282 platí, že pokud je celkový počet odpracovaných hodin nulový, nesmí být podřízená oblast pro detailní rozpad hodin (přesčasy, hornictví, riziková práce) vůbec vyplněna a odeslána, jinak bude podání odmítnuto.' },
            
            
            'pocet': { label: 'Počet Odpracovaných Hodin (ID 10268)', desc: 'Pole formuláře pro uvedení skutečně odpracovaných nebo odsloužených hodin v měsíci ve stanovené pracovní době, včetně proplacených přesčasů, přípravy pracoviště a čekání na práci. Nezahrnují se sem hodiny placené, ale neodpracované (jako svátky, dovolená či nepřítomnost z důvodu nemoci), a to ani tehdy, pokud se měsíční mzda nebo plat nekrátí. U příslušníků se za přesčas považují pouze proplacené hodiny služby přesčas vykazované v měsíci proplacení.', format: 'Povinné číselné pole formuláře, do kterého se vkládá desetinné číslo s maximálně 3 desetinnými místy a celkovou délkou až 8 číslic. Spadá do oblasti formuláře Údaje k průběhu zaměstnání v daném měsíci, konkrétně pod podřízenou oblast Odpracované hodiny.', scenarios: 'Vykázaný počet odpracovaných hodin nesmí být menší než uvedený počet přesčasových hodin (ID 10269) a nesmí být menší ani než počet odpracovaných hodin v rizikové práci (ID 10273) – v obou případech by podání bylo nepropustně odmítnuto. Existuje také kontrolní pravidlo upozorňující na překročení maximálního možného počtu odpracovaných hodin (standardně 240 hodin v měsíci), což generuje pouze propustnou chybu jako upozornění. Pokud je toto pole nulové, nesmí být vůbec vyplněna pole pro přesčasy, práci v hornictví ani rizikovou práci.' },
            
            
            'neodpracovanehodiny': { label: 'Neodpracované hodiny', desc: 'Podřízená oblast formuláře sdružující údaje o neodpracovaných hodinách zaměstnance v daném měsíci ze sjednané pracovní doby. Slouží k uvedení celkového počtu neodpracovaných hodin a jejich detailnímu rozpadu na konkrétní důvody nepřítomnosti, jako je pracovní neschopnost (s náhradou i bez náhrady), čerpání dovolené na zotavenou, ošetřování člena rodiny (OČR) či překážky v práci s náhradou mzdy.', format: 'Podřízená oblast formuláře spadající pod nadřazenou oblast Údaje k průběhu zaměstnání v daném měsíci. Skládá se z povinného pole Celkový počet neodpracovaných hodin (ID 10275) a volitelných polí pro detailní rozpad: Neodpracované hodiny s náhradou či nekrácením mzdy (ID 10276), Dočasná pracovní neschopnost bez náhrady (ID 10277), Dočasná pracovní neschopnost s náhradou (ID 10278), Čerpání dovolené (ID 10279) a Ošetřování člena rodiny - OČR (ID 10280).', scenarios: 'Tato oblast se vyplňuje v individualizované části pro konkrétní pracovněprávní vztah. Dle nepropustné kontroly 286 platí přísné formální pravidlo: pokud je pole Celkový počet neodpracovaných hodin (ID 10275) rovno nule, nesmí být vůbec vyplněna a odeslána žádná z podřízených položek pro detailní rozpad těchto hodin (a to včetně navázaných překážek v práci ID 10471 a 10472). V případě nedodržení tohoto pravidla systém podání nepropustně zamítne.' },
            
            'hodinyneodpraccelkem': { label: 'Celkový Počet Neodpracovaných Hodin (ID 10275)', desc: 'Pole formuláře pro uvedení celkového počtu neodpracovaných hodin v měsíci ze sjednané pracovní doby daného pracovněprávního vztahu zaměstnance. Zahrnuje dobu dovolené, svátky připadající na pracovní dny (i když se měsíční mzda či plat nekrátí), dobu překážek v práci, pracovní neschopnosti, ošetřování člena rodiny, neplacené volno a podobně.', format: 'Číselné pole formuláře, do kterého se vkládá desetinné číslo s maximálně 3 desetinnými místy a celkovou délkou až 8 číslic. Spadá do oblasti formuláře Údaje k průběhu zaměstnání v daném měsíci, konkrétně pod podřízenou oblast Neodpracované hodiny.', scenarios: 'Pole se vyplňuje v individualizované části pro každý konkrétní pracovněprávní vztah. Dle nepropustné kontroly 286 platí přísné pravidlo: pokud je celkový počet neodpracovaných hodin nulový, nesmí být vůbec vyplněna a odeslána další podřízená pole pro detailní rozpad těchto hodin (jako jsou hodiny pro dočasnou pracovní neschopnost, dovolenou, OČR či překážky v práci). Pokud by se rozpadové hodiny odeslaly při nulovém celku, systém podání nepropustně odmítne.' },
            
            'hodinyneodpracbeznahrady': { label: 'Počet Neodpracovaných Hodin v Důsledku Dočasné Pracovní Neschopnosti bez Náhrady Mzdy (ID 10277)', desc: 'Pole formuláře pro uvedení počtu neodpracovaných nebo neodsloužených hodin v měsíci z důvodu dočasné pracovní neschopnosti (případně karantény) či neschopnosti ke službě, za které zaměstnavatel neposkytuje náhradu mzdy, platu, odměny z dohody nebo služebního příjmu po dobu této neschopnosti. Upozorňujeme, že se sem nezahrnují hodiny ošetřování člena rodiny (OČR).', format: 'Nepovinné číselné pole formuláře, do kterého se vkládá desetinné číslo s maximálně 3 desetinnými místy a celkovou délkou až 8 číslic. Spadá do oblasti formuláře Údaje k průběhu zaměstnání v daném měsíci, konkrétně pod podřízenou oblast Neodpracované hodiny.', scenarios: 'Vyplňuje se v individualizované části pouze v situaci, kdy tato překážka v práci u konkrétního pracovněprávního vztahu v daném měsíci reálně nastala. Dle nepropustných formálních kontrol platí, že toto pole pro detailní rozpad smí být vyplněno a odesláno výhradně tehdy, pokud je uveden nenulový Celkový počet neodpracovaných hodin (ID 10275). Pokud by se tento rozpad odeslal při nulovém celku, systém podání nepropustně odmítne.' },
            
            'hodinyneodpracneschop': { label: 'Počet neodpracovaných hodin z důvodu dočasné pracovní neschopnosti, za které je ze strany zaměstnavatele poskytována náhrada mzdy (ID 10278)', desc: 'Pole formuláře pro uvedení počtu neodpracovaných hodin v měsíci z důvodu dočasné pracovní neschopnosti (případně karantény) či neschopnosti ke službě, za které zaměstnavatel poskytuje náhradu mzdy, platu, odměny z dohody nebo služebního příjmu po dobu této neschopnosti. Nejedná se o dobu, za kterou se poskytuje nemocenská dávka podle zákona o nemocenském pojištění.', format: 'Nepovinné číselné pole formuláře, do kterého se vkládá desetinné číslo s maximálně 3 desetinnými místy a celkovou délkou až 8 číslic. Spadá do oblasti formuláře Údaje k průběhu zaměstnání v daném měsíci, konkrétně pod podřízenou oblast Neodpracované hodiny.', scenarios: 'Vyplňuje se v individualizované části pro konkrétní pracovněprávní vztah při výskytu dané situace. Dle nepropustné kontroly 286 smí být toto pole pro detailní rozpad vyplněno výhradně tehdy, pokud je uveden nenulový Celkový počet neodpracovaných hodin (ID 10275). Dále se uplatňuje důležitá nepropustná kontrola 34: pokud je v tomto poli vykázán počet hodin větší než nula, musí být zároveň povinně vykázána i částka větší než nula v navazujícím poli Náhrady při dočasné pracovní neschopnosti (ID 10342), jinak je podání nepropustně zamítnuto.' },
            
            'prekazkyvpraci': { label: 'Překážky v práci', desc: 'Podřízená oblast formuláře pro uvedení počtu neodpracovaných hodin z důvodu překážek v práci. Sdružuje detailní rozpad neodpracovaných hodin na překážky na straně zaměstnance, za které náleží náhrada mzdy či platu (např. vyšetření, darování krve, svatba), a na překážky na straně zaměstnavatele (např. prostoje, přerušení práce způsobené nepříznivými povětrnostními vlivy).', format: 'Nepovinná podřízená oblast formuláře, která spadá pod oblast Údaje k průběhu zaměstnání v daném měsíci. Skládá se ze dvou volitelných číselných polí: Překážky na straně zaměstnance s náhradou mzdy/platu (ID 10471) a Překážky na straně zaměstnavatele (ID 10472). Do těchto polí se vkládá desetinné číslo s maximálně 3 desetinnými místy a celkovou délkou až 8 číslic.', scenarios: 'Tato oblast se vyplňuje v individualizované části pro konkrétní pracovněprávní vztah. Dle nepropustné kontroly 286 smí být tato oblast a její podřízená pole vyplněna výhradně tehdy, pokud je v poli Celkový počet neodpracovaných hodin (ID 10275) uvedena hodnota větší než nula. Dále se uplatňují přísné formální kontroly 144 a 145, které nepropustně hlídají, že vykázaný počet hodin u překážek na straně zaměstnance (ID 10471) ani na straně zaměstnavatele (ID 10472) nesmí být nikdy vyšší než vyplněný Sjednaný fond pracovní doby (ID 10260).' },
            
            
            'prekazkazamestnanec': { label: 'Překážky Na Straně Zaměstnance s Náhradou Mzdy / Platu - Počet Neodpracovaných Hodin (ID 10471)', desc: 'Pole formuláře pro uvedení počtu neodpracovaných hodin z důvodu překážek v práci na straně zaměstnance (např. dle zákoníku práce nebo nařízení vlády č. 590/2006 Sb.), za které tomuto zaměstnanci reálně náleží náhrada mzdy, platu nebo služebního příjmu.', format: 'Nepovinné číselné pole formuláře, do kterého se vkládá desetinné číslo s maximálně 3 desetinnými místy a celkovou délkou až 8 číslic. Spadá do oblasti formuláře Údaje k průběhu zaměstnání v daném měsíci, konkrétně pod podřízenou oblast Překážky v práci.', scenarios: 'Vyplňuje se v individualizované části pro konkrétní pracovněprávní vztah při výskytu dané překážky. Dle nepropustné kontroly 286 smí být toto pole vyplněno výhradně tehdy, pokud je v nadřazeném poli Celkový počet neodpracovaných hodin (ID 10275) uvedena hodnota větší než nula. Dále se uplatňuje přísná nepropustná kontrola 144: vykázaný počet neodpracovaných hodin z důvodu těchto překážek nesmí být nikdy vyšší než vyplněná Pracovní doba sjednaná v hodinách měsíčně (Sjednaný fond pracovní doby, ID 10260). Při nedodržení těchto pravidel systém podání nepropustně zamítne.' },
            
            
            'prekazkazamestnavatel': { label: 'Překážky Na Straně Zaměstnavatele - Počet Neodpracovaných Hodin', desc: 'Pole formuláře slouží k vykázání počtu neodpracovaných hodin z důvodu překážek na straně zaměstnavatele podle zákoníku práce (část osmá, hlava III), za které zaměstnanci náleží náhrada mzdy, platu, služebního příjmu nebo odměny z dohody (ID Atributu 10472).', format: 'Nepovinný údaj. Vyplňuje se jako desetinné číslo s maximálně 3 desetinnými místy a celkovým počtem číslic do 8.', scenarios: 'Pole se vyplňuje měsíčně, a to pouze v případě, že daná situace u zaměstnance nastala. Hodnota v tomto poli formuláře nesmí být vyšší než Sjednaný fond pracovní doby v hodinách měsíčně (ID Atributu 10260). Zároveň platí nepropustná formální kontrola, že toto pole nesmí nabývat hodnot (nesmí být vyplněno), pokud je Celkový počet neodpracovaných hodin (ID Atributu 10275) roven nule.' },
            
            'prijem': { label: '6. Příjem v Daném Měsíci', desc: 'Oblast formuláře obsahující údaje k příjmu zaměstnance v daném kalendářním měsíci. Slouží k evidenci částky základu pro výpočet zálohy na daň nebo srážkové daně na úrovni konkrétního pracovněprávního vztahu (ID 10535) a k určení data výplatního termínu při nastání specifické právní skutečnosti (ID 10410), např. při úpadku zaměstnavatele.', format: 'Tato oblast formuláře se skládá z podřízených oblastí: Daň (obsahuje pole Základ pro výpočet daně) a Specifická skutečnost (obsahuje pole Výplatní termín při nastání specifické právní skutečnosti).', scenarios: 'Pole Základ pro výpočet daně (ID 10535) je nepovinné, ale pokud je vyplněno, smí obsahovat pouze celé kladné číslo a nesmí nabývat záporných hodnot. Pole Výplatní termín (ID 10410) musí být dle nepropustné kontroly 82 povinně vyplněno u všech součástí podání v případě, že je v souhrnné vrstvě zaměstnavatele nahlášena Specifická právní skutečnost s příslušným kódem (ID 10408). Tato oblast je dostupná napříč většinou datových scénářů a je stěžejní například u scénáře Jiný příjem (kódy činnosti 11, 13, 14), který je značně redukovaný a zcela postrádá oblasti pro pojištění, vykonávanou pozici, průběh zaměstnání i detailní mzdu.' },
            
            'dan': { label: 'Daň (Příjem v Daném Měsíci)', desc: 'Podřízená oblast formuláře v rámci sekce příjmů, která slouží k vyčíslení daňového základu přímo na úrovni konkrétního pracovněprávního vztahu. Vykazuje se zde částka základu pro výpočet zálohy na daň nebo částka základu pro výpočet daně podle srážkové daně za sledovaný měsíc.', format: 'Podřízená oblast formuláře. Obsahuje datové pole Základ pro výpočet daně (ID Atributu 10535), do kterého se zadává celé nezáporné číslo bez desetinných míst s maximální délkou 14 číslic.', scenarios: 'Oblast se vyplňuje v individualizované části formuláře u příslušného pracovněprávního vztahu. V případě, že se tato oblast vykazuje, musí být v poli formuláře výslovně zadána hodnota, a to i v situaci, kdy je základ pro výpočet daně nulový (zadá se nula). Pole nesmí zůstat prázdné a nesmí obsahovat zápornou hodnotu, jinak podání neprojde přes nepropustnou formální kontrolu 304. Zadaná částka (ID Atributu 10535) je navíc klíčová pro systémové vyhodnocení limitů srážkové daně (např. limit pro DPP) vůči aplikovaným daňovým slevám v rámci složitějších nepropustných kontrol 245 a 325. U výjimečných zjednodušených datových scénářů (např. oblast formuláře pro Jiný příjem) je tato podřízená oblast jednou z mála, která se společně s identifikací a hrubým příjmem vůbec vyplňuje a odesílá.' },
            
            'zakladdane': { label: 'Základ pro výpočet daně (Záloha na daň, Zvláštní sazba daně, Příjem v daném měsíci)', desc: 'Pole formuláře, které slouží k vyčíslení základu daně. V závislosti na podřízené oblasti formuláře, ve které se toto pole nachází, se jedná buď o agregovaný Základ pro výpočet zálohy na daň (ID Atributu 10297) nebo agregovaný Základ pro výpočet daně podle zvláštní sazby daně (ID Atributu 10307) v rámci souhrnných dat zaměstnance, anebo o Základ pro výpočet daně vykazovaný přímo na úrovni příjmů konkrétního pracovněprávního vztahu (ID Atributu 10535).', format: 'Pole formuláře. Zadává se jako nezáporné celé číslo bez desetinných míst s maximální délkou 14 číslic. Zadaná hodnota nesmí být záporná a v případě nulového základu pro výpočet daně (např. u ID Atributu 10535) musí být výslovně vyplněna nula.', scenarios: 'Použití a vykazování tohoto pole se řídí kontextem oblasti formuláře. U primárního pracovněprávního vztahu v oblasti souhrnných dat se vyplňuje buď pro zálohovou daň (ID 10297) nebo pro srážkovou daň (ID 10307). Přítomnost těchto polí podléhá striktním nepropustným kontrolám napojeným na Prohlášení poplatníka daně (ID 10419) a daňové rezidentství. Například pokud daňový rezident ČR podepíše prohlášení, pole pro základ daně zvláštní sazbou (ID 10307) se nesmí do formuláře odeslat (nepropustná kontrola 242). Naopak u srážkové daně bez podepsaného prohlášení se nesmí vyplnit pole pro zálohovou daň (nepropustná kontrola 245). Na úrovni podřízené oblasti příjmů u konkrétního PPV se zadává hodnota do pole ID 10535, které podléhá nepropustné kontrole 304 bránící zadání záporných čísel.' },
            
            'prispevekdip': { label: 'Příspěvek na Dlouhodobý Investiční Produkt', desc: 'Toto datové pole formuláře (ID 10296) slouží k detailnímu vykázání částky příspěvku, který zaměstnavatel uhradil za svého zaměstnance na dlouhodobý investiční produkt (DIP). Jde o jeden z daňově podporovaných produktů spoření na stáří, u kterého je plnění do úhrnného společného ročního limitu 50 000 Kč osvobozeno od daně podle § 6 odst. 9 písm. m) zákona o daních z příjmů. V XML datové větě se tento tag nachází jako podřízený element uvnitř obalovacího kontejneru Příspěvky zaměstnavatele, který spadá pod sekci Příjem v Souhrnných datech zaměstnance.', format: 'Nepovinné pole formuláře, u kterého se očekává exaktní zápis finanční částky ve formě celého nezáporného čísla o maximální délce 14 číslic. Vzhledem k tomu, že toto pole slouží výhradně k zápisu konkrétní peněžní hodnoty v Kč, neexistují k tomuto XML tagu žádné navázané číselníkové položky.', scenarios: 'Mzdová účetní vykazuje tento údaj v měsíci, kdy zaměstnavatel daný příspěvek reálně uhradil, a to primárně u zaměstnání aktuálně označeného jako primární pracovněprávní vztah. Stejně jako u ostatních produktů spoření na stáří slouží tato částka jako detailní rozpad k nadřízenému součtovému poli Osvobozené příjmy celkem. Pro mzdovou praxi je klíčové sledování úhrnného limitu: pokud úhrn všech příspěvků zaměstnavatele na daňově podporované produkty přesáhne v daném roce zákonný limit 50 000 Kč, nesmí se nadlimitní částka do tohoto pole již vykazovat a zaměstnavatel ji musí ihned zdanit a odvést z ní pojistné přímo v měsíci překročení limitu.' },
            
            'slevazamestnance': { label: 'Sleva na pojistném zaměstnance', desc: 'Zastřešující oblast formuláře v bloku Průběh pojištění v daném měsíci, která slouží k evidenci a vyčíslení slevy na pojistném přímo za zaměstnance. Tato oblast se logicky člení na dvě hlavní podřízené sekce (pro pracující důchodce a pro zaměstnance v ovocnářství a pěstování zeleniny). V obou případech se nejprve vyžaduje zadání logického příznaku ANO/NE, zda má zaměstnanec v daném měsíci na slevu nárok, a v případě hodnoty ANO se následně zpřístupní pole pro zadání konkrétní částky výše slevy.', format: 'Nadřazená oblast formuláře sdružující podřízená pole pro evidenci slevy. Obsahuje logické příznaky nároku na slevu (ID 10490 pro pracující důchodce nebo ID 10546 pro ovocnářství) a na ně navázaná pole pro exaktní zadání výše slevy (ID 10491 nebo ID 10547). Zákonná částka slevy činí 6,5 % z vyměřovacího základu zaměstnance.', scenarios: 'Tato oblast se vyplňuje u zaměstnanců s oprávněným nárokem na slevu na pojistném. Systém (DIS) uplatňuje striktní nepropustné kontroly (např. ID 208 a 272), které ověřují, že pole s konkrétní částkou je vyplněno POUZE tehdy, byla-li v předřazeném poli nároku vybrána hodnota ANO. Dále nepropustná kontrola (ID 275) striktně hlídá výlučnost – témuž zaměstnanci nelze v jednom formuláři uplatnit obě slevy současně (v případě souběhu má přednost sleva pro zaměstnance v ovocnářství).' },
            
            'slevazamestnanceevidovana': { label: 'Sleva na Pojistném Zaměstnance (Pracující Důchodce)', desc: 'ANO / NE. Pole formuláře v podřízené oblasti Průběh Pojištění v daném měsíci, které slouží jako logický příznak pro evidenci nároku na slevu na pojistném placeném samotným zaměstnancem. Konkrétně se jedná o slevu vyhrazenou pro pracující důchodce (ID 10490). Hodnotou ANO mzdová účetní deklaruje, že má zaměstnanec v daném kalendářním měsíci na tuto slevu oprávněný nárok a vypočtená sleva je nenulová.', format: 'Logické pole formuláře. Očekává nabytí hodnoty ANO nebo NE. V případě volby ANO přímo podmiňuje zpřístupnění a povinnost vyplnění navazujícího pole formuláře pro exaktní zadání Výše slevy na pojistném zaměstnance (ID 10491).', scenarios: 'Systém DIS nad tímto polem provádí striktní nepropustnou kontrolu (ID 208), která ověřuje, že pole s konkrétní částkou slevy (ID 10491) je vyplněno POUZE v případě, kdy je tento příznak nastaven na hodnotu ANO. Zároveň je nepropustnou kontrolou (ID 275) hlídána výlučnost uplatnění slev – témuž zaměstnanci nelze v jednom formuláři uplatnit slevu pro pracující důchodce (ID 10490) současně se slevou pro zaměstnance v ovocnářství a pěstování zeleniny (ID 10546); v případě souběhu má legislativní přednost sleva pro ovocnáře. Hodnota tohoto pole rovněž vstupuje do křížových kontrol sumářů za celého zaměstnavatele (např. kontrola ID 297 pro ověření maximálního počtu zaměstnanců uplatňujících slevu).' },
            
            'vyseslevy': { label: 'Výše Slevy na Pojistném Zaměstnance (Částka)', desc: 'Pole formuláře v podřízené oblasti Průběh pojištění v daném měsíci, které slouží k exaktnímu zadání konkrétní částky slevy na pojistném uplatňované za zaměstnance. Toto pole zapouzdřuje dvě specifická uplatnění: slevu pro pracující důchodce (ID 10491) a slevu pro zaměstnance v ovocnářství a pěstování zeleniny (ID 10547). Zákonná částka slevy se vypočítává jako 7,1 % z vyměřovacího základu zaměstnance, ze kterého je odváděno pojistné (ID 10477), a vždy se zaokrouhluje na celé koruny směrem nahoru.', format: 'Číselné pole formuláře. Očekává se striktně celé nezáporné číslo bez desetinných míst o délce 1 až 12 číslic, které nesmí začínat úvodní nulou.', scenarios: 'Vyplnění tohoto pole je striktně podmíněno předchozím potvrzením nároku. Systém DIS na pozadí uplatňuje nepropustné kontroly (ID 208 pro důchodce a ID 272 pro ovocnáře), které podání ihned zamítnou, pokud je do pole zadána výše slevy bez předchozího nastavení logického příznaku na hodnotu ANO u příslušného nároku (ID 10490 nebo ID 10546). V případě slevy pro ovocnáře navíc nepropustná kontrola (ID 273) exaktně hlídá, že se zadaná výše slevy (ID 10547) matematicky rovná vypočtenému sociálnímu pojištění zaměstnance (ID 10370). Zároveň platí nepropustná kontrola výlučnosti (ID 275) striktně zamezující souběhu obou těchto slev u téhož zaměstnance v jednom formuláři.' },
            
            'mistovykonuprace': { label: 'Místo Výkonu Práce / Činnosti', desc: 'Podřízená oblast formuláře (patřící pod oblast Vykonávaná pozice) sloužící k detailní identifikaci lokace, kde zaměstnanec v daném kalendářním měsíci vykonával svou práci. Obsahuje nezbytná data pro správné místní určení pracoviště a statistické účely.', format: 'Tato oblast formuláře se skládá ze tří povinných polí: pole Obec (ID 10229) pro textový zápis názvu obce, pole Kód Obce (ID 10230) vyžadující přesně šestimístný kód dle číselníku obcí vycházejícího z klasifikace ČSÚ (číselník CISOB) a pole Stát (ID 10231) obsahující dvoupísmenný kód země dle číselníku států (číselník CZEM) (CZ pro Česko, SK pro Slovensko, DE pro Německo, NL pro Holandsko, CL pro Chile, CI pro Republiku Pobřeží Slonoviny,...atd.).', scenarios: 'Pokud výkon práce v daném měsíci probíhal ve více obcích, uvádí se obec převažujícího výkonu práce, případně obec umístění provozovny, kde zaměstnanec práci zahajoval. V případě výkonu práce převážně mimo ČR, avšak částečně i v ČR, se do polí Obec (ID 10229) a Kód obce (ID 10230) hlásí DOTČENÁ ČESKÁ OBEC. Významný chyták nastává v případě, že je místo výkonu práce umístěno výhradně mimo území ČR – v takovém případě se do pole Obec (ID 10229) vyplní Obec Sídla Českého Zaměstnavatele, ale do pole Stát (ID 10231) se uvede KÓD STÁTU SKUTEČNÉHO VÝKONU PRÁCE V ZAHRANIČÍ (v Salary to cítíme s vámi - Legislativní bordel), a to zcela bez ohledu na vazbu k uvedenému kódu České obce.' },
            
            'obec': { label: 'Obec', desc: 'Pole formuláře v podřízené oblasti Místo výkonu práce / činnosti (v rámci oblasti Vykonávaná pozice), které slouží k určení obce, na jejímž území zaměstnanec v daném kalendářním měsíci vykonával svou práci. Výběr hodnoty vychází z číselníku obcí (číselník CISOB) spravovaného ČSÚ.', format: 'Povinné textové pole (ID 10229) o maximální délce 255 znaků. Správnost zadané hodnoty vůči číselníku CISOB je ověřována nepropustnou kontrolou 335. Toto pole přímo souvisí s navazujícími poli Kód obce (ID 10230) a Stát (ID 10231).', scenarios: 'Pokud výkon práce v daném měsíci probíhal ve více obcích, uvádí se obec převažujícího výkonu práce nebo obec umístění provozovny, ve které zaměstnanec zahajoval práci. Při výkonu práce převážně mimo ČR, ale částečně i v ČR, se uvádí dotčená česká obec. Ve specifickém případě, kdy se místo výkonu nacházelo výhradně mimo území ČR, se do tohoto pole vyplní obec sídla zaměstnavatele (umístění provozovny) a skutečný stát výkonu v zahraničí se uvede samostatně do pole Stát (ID 10231).' },
            
            'uplatnujiprispevekapz': { label: 'Mzdový Příspěvek v Rámci Nástrojů APZ', desc: ' ANO / NE (ID 10232). Povinné pole formuláře v podřízené oblasti Vykonávaná Pozice. Slouží k označení, zda na daného zaměstnance v daném kalendářním měsíci žádáte od Úřadu Práce ČR refundaci mzdových nákladů (Mzdový Příspěvek) na základě uzavřené Písemné Dohody v rámci tzv. Aktivní Politiky Zaměstnanosti (APZ). Pokud tedy na pracovníka pobíráte Dotaci z ÚP (např. na Vyhrazené Místo, Veřejně Prospěšné Práce či Sdílené Místo), zvolíte zde ANO. Úřad práce si tak z tohoto hlášení rovnou natáhne data potřebná k proplacení dotace.', format: 'Pole typu příznak nabývající hodnot ANO / NE (ID 10232). Při volbě ANO se stává striktně povinným navazující pole Nástroj / opatření (ID 10233), kde se vybírá z číselníku konkrétní typ dotace: §112 zákona o zaměstnanosti (veřejně prospěšné práce), §113 (společensky účelné pracovní místo vyhrazené) nebo §106 (sdílené pracovní místo). V případě nárokování APZ je dále nutné v sekci Mzda povinně vyplnit pole Datum úhrady mzdy včetně odvodů (ID 10347).', scenarios: 'Pokud je uplatnění APZ nastaveno na ANO a není vybrán kód Nástroje, bude podání odmítnuto jako formálně chybné v rámci nepropustné kontroly 159. Systém má navíc zabudovanou nápovědu (propustná kontrola 140): pokud jste u zaměstnance v předchozím měsíci APZ uplatnili a v aktuálním hlášení nikoliv, systém vás na to upozorní, abyste o dotaci nepřišli vlastním opomenutím. Specifickým chytákem je situace, kdy by na dotovaném APZ místě pracovala osoba nepodléhající předpisům sociálního zabezpečení ČR (např. s formulářem A1); v takovém případě se žádost o příspěvek řeší s Úřadem práce zcela mimo systém JMHZ.' },
            
            'funkcnipozitky': { label: 'Funkční Požitky dle § 6 odst. 10 ZDP', desc: 'ANO / NE  (ID 10247). Pole formuláře v podřízené oblasti Činnost (v rámci oblasti Vykonávaná pozice). Slouží k určení, zda se u daného pracovněprávního vztahu v hlášeném měsíci jedná o příjmy plynoucí z funkčních požitků podle § 6 odst. 10 Zákona o Daních z Příjmů (ZDP). Mzdové účetní toto označení využijí typicky při zpracování odměn Představitelů Státní Moci (např. poslanců, senátorů, soudců) nebo u Funkcionářů Profesních Komor, spolků a orgánů obcí (Uvolnění i Neuvolnění Zastupitelé).', format: 'Povinné pole formuláře typu příznak (ID 10247). Nabývá výhradně dvou logických hodnot, a to buď ANO / NE.', scenarios: 'Toto pole je striktně povinné pro každý hlášený Pracovněprávní Vztah v Měsíčním Hlášení. U drtivé většiny běžných zaměstnanců (Pracovní Poměry, DPP, DPČ) zde mzdová účetní vždy uvede hodnotu NE. Zvláštní pozornost je třeba věnovat hodnotě ANO, která je vyhrazena pouze pro přesně definovaný okruh specifických funkcí a pozic, u nichž je nezbytné správné daňové posouzení tohoto příjmu pro potřeby Finanční Správy.' },
            'docasnepridelenievidovano': { label: 'Zaměstnání za Účelem Dočasného Přidělení u Uživatele', desc: 'ANO / NE (ID10251). Pole formuláře v podřízené oblasti Forma Práce (v rámci oblasti Vykonávaná Pozice). Slouží k označení, zda byl zaměstnanec v daném kalendářním měsíci dočasně přidělen k výkonu práce k jinému subjektu (uživateli / organizaci / firemní entitě). Zjednodušeně: Tento údaj využijete typicky jako Agentura Práce, pokud svou pracovní sílu "zapůjčujete" jiné firmě. Zvolíte zde ANO a následně musíte tohoto koncového uživatele (zákazníka / firmu) přesně identifikovat.', format: 'Pole typu příznak (ID 10251), které nabývá hodnot ANO / NE. Při volbě ANO se stává povinným vyplnění navazujících polí pro identifikaci uživatele. Vyplňuje se buď IČO uživatele (ID 10252), Rodné číslo uživatele (ID 10457), nebo Identifikace Zahraniční Osoby, která zahrnuje Kód státu (ID 10492, výběr dvoupísmenného Kódu Státu dle číselníku států CZEM), Registrační Číslo (ID 10493) a Název Zahraniční Osoby (ID 10494).', scenarios: 'U naprosté většiny běžných zaměstnavatelů zde mzdová účetní vždy ponechá výchozí hodnotu NE. Volba ANO je typická pro procesy Agenturního Zaměstnávání. Důležitým technickým chytákem je striktní pravidlo dle nepropustné kontroly ČSSZ číslo 103 v systému DIS: Pokud zvolíte ANO, musíte vyplnit PRÁVĚ JEDEN TYP IDENTIFIKÁTORU UŽIVATELE (buď pouze IČO, nebo pouze RČ, nebo kompletní trojici polí pro Zahraniční Osobu). Pokud vyplníte více typů identifikace najednou, nebo naopak žádnou, bude vaše podání odmítnuto jako formálně chybné.' },
            
            'stanovenyfond': { label: 'Stanovený Fond pro Danou Profesi (V Hodinách Měsíčně)', desc: 'Pole formuláře v podřízené oblasti Fond pracovní doby (v rámci oblasti Vykonávaná pozice). Pro mzdové účetní slouží k evidenci plánovaného hodinového fondu pracovní doby pro danou pracovní pozici, který odpovídá plnému pracovnímu úvazku. Uvádí se zde celkový počet hodin za pracovní dny (včetně svátků připadajících na jinak pracovní dny), po které byl zaměstnanec v daném měsíci v evidenčním stavu nebo po které měl uzavřenou dohodu o pracích konaných mimo pracovní poměr.', format: 'Povinné číselné pole (ID 10259). Vyplňuje se jako desetinné číslo s maximálně 3 desetinnými místy a celkovou délkou do 7 číslic. Systém pomocí nepropustné kontroly ČSSZ čáslo 94 v systému DIS (cJMHZ) navíc ověřuje, zda zadaná hodnota není záporná, tedy musí jít o kladné číslo nebo nulu.', scenarios: 'U Běžných Pracovních Poměrů a Dohod (DPP, DPČ) se uvádí Standardní Fond Hodin pro Plný Úvazek na dané pozici, ke kterému se následně v souvisejícím poli Sjednaný Fond (ID 10260) případně zohledňuje skutečný kratší sjednaný úvazek daného zaměstnance. Zásadní chyták nastává u osob, které nemají stanovenou pracovní dobu a tato se u nich neeviduje (což jsou typicky jednatelé, společníci a další funkcionáři s kódy druhu činnosti K až S). U těchto Specifických Druhů Činností se musí do tohoto pole striktně vyplnit nulová hodnota (0).' },
            
            'fondpracovnidoby': { label: 'Fond Pracovní Doby', desc: 'Podřízená oblast formuláře (v rámci oblasti Vykonávaná Pozice) určená k evidenci plánovaného rozvržení pracovní doby zaměstnance v daném kalendářním měsíci. Mzdovým účetním tato sekce slouží k nahlášení časového fondu, který odpovídá plnému úvazku na dané pozici, a Skutečně Sjednaného Fondu, pokud má zaměstnanec kratší úvazek. Tyto údaje jsou nezbytné pro statistické účely ČSÚ a pro kontrolu odpracované doby.', format: 'Tato oblast formuláře sdružuje povinná číselná pole: Stanovený Fond Pro Danou Profesi (ID 10259), Sjednaný Fond Pracovní Doby (ID 10260) a Stanovená Týdenní Pracovní Doba Zaměstnance (ID 10261). Hodnoty se vyplňují jako desetinná čísla a podle nepropustných kontrol ČSSZ číslo 94, 95 a 96 v systému DIS (cJMHZ) nesmí nabývat záporných hodnot.', scenarios: 'U Standardních Pracovních Poměrů se fondy vyplňují reálnými hodnotami dle Sjednaného Rozvrhu Směn. U dohod (DPP, DPČ) se uvádí předpokládaný rozsah práce v daném měsíci. Zásadní účetní chyták platí pro osoby bez stanovené pracovní doby, jako jsou jednatelé, společníci či členové orgánů (Specifické Druhy Činnosti skupiny K až S). U těchto vztahů se pracovní doba neeviduje a mzdová účetní zde musí do polí Stanovený Fond (ID 10259) i Sjednaný Fond (ID 10260) striktně uvést nulovou hodnotu (0).' },
            
            'vyzivujejinaosoba': { label: 'Vyživuje Tytéž Děti v Téže Domácnosti i Jiná Osoba (Roční Zúčtování - RZD)', desc: 'Toto datové pole formuláře (ID 10455) se využívá výhradně v bloku výsledku ročního zúčtování (odesílaném v měsíčních hlášeních za leden, únor nebo březen). Slouží k určení, zda tytéž děti, na které zaměstnanec uplatňuje daňové zvýhodnění, vyživuje ve společně hospodařící domácnosti i jiná osoba. Jde o údaj, který poplatník uvádí na druhé straně Prohlášení poplatníka k dani. Na rozdíl od obdobného měsíčního příznaku (ID 10453) se tento tag používá specificky tehdy, když se tyto údaje doplňují až dodatečně a zpětně právě v rámci ročního zúčtování daně.', format: 'Nepovinné pole, které se však stává striktně povinným, jakmile je v hlášení vyplňována roční část daňového zvýhodnění na děti. Očekává se zápis logického příznaku (boolean) ve formátu ANO / NE. Jelikož jde o prostý logický přepínač, nejsou k tomuto XML tagu navázány žádné další obsáhlejší číselníkové položky.', scenarios: 'Pro mzdovou praxi zde platí naprosto zásadní systémová vazba (označovaná jako interakce IN23, kontrolovaná pod ID 126): Pokud mzdová účetní v tomto poli uvede hodnotu ANO (1), musí v hlášení povinně vyplnit podřízený blok s údaji o této osobě – konkrétně Jméno (ID 10441), Příjmení (ID 10442) a dvanáctiznakový řetězec pro Měsíce vyživování (ID 10445). Navíc zde systém uplatňuje přísnou logickou kontrolu (XOR) pro jednoznačnou identifikaci této jiné osoby: účetní musí povinně vyplnit buď Rodné číslo (ID 10444), nebo Datum narození (ID 10443), ale nesmí odeslat oba údaje současně ani oba vynechat.' },
                    
            'vyzivovanedeti': { label: 'Vyživované Děti', desc: 'Tento hlavní blok formuláře slouží ke sdružení jednoho či více podřízených bloků s detailními údaji o konkrétních vyživovaných dětech (Vyživované Dítě). Z pohledu mzdové účetní je tento blok naprosto klíčový pro evidenci dětí z původního "růžového" Prohlášení Poplatníka, na které zaměstnanec uplatňuje daňové zvýhodnění. Může se vyskytovat na dvou místech podání: v měsíční oblasti Uplatnění Slev (uvnitř nadřízeného bloku Měsíční Daňové Zvýhodnění na Děti) nebo v sekci výsledku Ročního Zúčtování Daně (RZD).', format: 'Nepovinný komplexní blok formuláře. Uvnitř jeho zanořených položek formuláře se však využívá ad-hoc číselník pro určení pořadí dítěte (ID 10440 pro měsíc / ID 10451 pro rok) s exaktními povolenými hodnotami: 1, 2, 3 nebo N (neuplatněno). Dále se zde aplikují logické příznaky pro existenci průkazu ZTP/P u konkrétních dětí (ID 10439 pro měsíční hlášení formou ANO / NE, resp. u ID 10450 v ročním zúčtování ve specifické formě 12-ti znakového řetězce tvořeného znaky A/N pro každý měsíc).', scenarios: 'Do datové věty XML souboru se tento datový uzel tiskne výhradně tehdy, uplatňuje-li zaměstnanec slevu na vyživované dítě. Architektonickým a systémovým chytákem pro mzdovou praxi je, že uvnitř každého dítěte se vždy povinně generuje podřízený uzel komplexního typu Osoba (Dítě), do kterého se detailně rozepisují identifikační údaje (Jméno, Příjmení, Rodné Číslo nebo Datum Narození – pro měsíční bázi vedené pod ID 10435–10438, pro Roční Zúčtování Daně s ID 10446–10449). Účetní zde musí u každého vykázaného dítěte striktně ověřit správné uvedení jeho pořadí (1, 2, 3, N) pro čerpání slevy a bedlivě zohlednit oprávněnost k dvojnásobnému daňovému zvýhodnění z titulu ZTP/P, které se vždy váže k 1. (prvnímu) dni vykazovaného měsíce.' },
            
            'vyzivovanedite': { label: 'Vyživované dítě', desc: 'Záznam pro konkrétní vyživované dítě pro účely uplatnění daňového zvýhodnění.' },
            
            'dite': { label: 'Dítě', desc: 'ID 10435, 10436, 10437, 10438: Identifikační údaje vyživovaného dítěte (jméno, příjmení, datum narození, rodné číslo).' },
            
            
            'poradi': { label: 'Pořadí pro určení výše daňového zvýhodnění', desc: 'ID 10440: Číselná hodnota, a to na jedno dítě „1.“ na druhé dítě „2.“, na třetí a každé další vyživované dítě „3.“ Poplatník si sám určuje pořadí dítěte. Pořadí nemusí být chronologické. Tato položka formuláře slouží k exaktnímu určení pořadí konkrétního vyživovaného dítěte ve společně hospodařící domácnosti pro účely stanovení správné výše slevy na dani. V datové větě Měsíčního hlášení se vyskytuje ve dvou úrovních: pro průběžné měsíční zúčtování v bloku slev (ID 10440) a v rámci výsledku dodatečného ročního zúčtování daně (ID 10451). Pro mzdovou účetní je zásadní informací, že pořadí si určuje výhradně poplatník sám ve svém Prohlášení k dani, a toto pořadí nemusí být vůbec chronologické podle věku jednotlivých dětí.', format: 'Jedná se o povinné pole vždy, pokud je v příslušném bloku (Měsíčním Hlášení či Ročním Zúčtování Daně) vykazováno vyživované dítě. Uplatňuje se zde fixní ad-hoc číselník s povolenými exaktními hodnotami: 1 (první dítě), 2 (druhé dítě), 3 (třetí a každé další dítě) nebo hodnota N (Neuplatňuje). Zatímco pro měsíční bázi (ID 10440) se zapisuje pouze jeden konkrétní znak, v Ročním Zúčtování Daně (ID 10451) se zapisuje jako spojitý 12-ti znakový řetězec reprezentující platnost slevy pro všech 12 měsíců roku.', scenarios: 'Pro mzdovou praxi zde platí naprosto striktní logické pravidlo: Pokud poplatník v daném měsíci uplatňuje zvýhodnění na dítě s vyšším pořadím (např. 2 nebo 3), musí účetní do hlášení povinně zahrnout i dítě s nižším pořadím (např. 1), žijící ve stejné domácnosti, a to i tehdy, pokud se na něj sleva aktuálně neuplatňuje. Děti, na které se daňové zvýhodnění neuplatňuje, musí být vždy vykázány s kódem pořadí N (Neuplatňuje). Rovněž je nutné dát si pozor na formátování – na rozdíl od starších praxí se hodnoty zapisují prostým číslem či písmenem, dřívější zápis s tečkou (např. 1.) se v XML souboru již nesmí používat.' },
